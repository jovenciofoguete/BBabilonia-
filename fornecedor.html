<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fornecedor • BBabilônia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#111;--card:#1c1c1f;--line:#2c2c30;--tx:#f3f3f3;--mut:#9a9aa2;--ac:#ff4d6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px 16px 60px;max-width:560px;margin:auto}
h1{font-size:22px}h3{margin:22px 0 8px;font-size:16px}label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
button{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.p{background:var(--ac);border-color:var(--ac);color:#fff;width:100%;font-weight:600;margin-top:20px;height:50px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.it img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.it .x{position:absolute;top:4px;right:4px;width:28px;height:28px;padding:0;border-radius:50%;background:#000b}
.it input{border:0;border-radius:0;padding:8px;font-size:14px}.it label{display:flex;gap:6px;align-items:center;margin:0;padding:0 8px 8px;font-size:12px}
.it label input{width:auto}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ch span{background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:8px}
#m{margin-top:12px;color:var(--ac)}.hide{display:none}
</style></head><body>
<h1>Área do fornecedor</h1>
<div id="login">
 <label>Email</label><input id="em" type="email" autocomplete="email">
 <label>Palavra-passe (mínimo 6)</label><input id="pw" type="password" autocomplete="current-password">
 <button class="p" id="ent">Entrar</button>
 <button class="p" id="cri" style="background:none;border-color:var(--line)">Criar conta de fornecedor</button>
</div>
<div id="form" class="hide">
 <label>Nome do produto</label><input id="nome">
 <label>Preço</label><input id="preco" type="number" inputmode="decimal">
 <label>Moeda</label><select id="moeda"><option>MZN</option><option>USD</option><option>EUR</option><option>ZAR</option><option>BRL</option></select>
 <label>Descrição</label><textarea id="desc" rows="3"></textarea>
 <div id="catb" class="hide"><label>Categoria (grupo › subgrupo)</label><select id="cat"></select></div>

 <h3>Fotos do produto</h3><div class="g" id="fg"></div>
 <button id="af" style="margin-top:10px">+ Adicionar fotos</button>

 <h3>Cores (uma foto por cor)</h3><div class="g" id="cg"></div>
 <button id="ac" style="margin-top:10px">+ Adicionar cor com foto</button>

 <h3>Tamanhos</h3>
 <input id="ti" placeholder="Ex.: M, L, XL, 2XL (separe por vírgula)">
 <div class="ch" id="tc"></div>

 <h3>Vídeo (opcional)</h3>
 <button id="av">+ Escolher vídeo</button> <span id="vn" style="color:var(--mut)"></span>

 <button class="p" id="sv">Publicar produto</button><div id="m"></div>
</div>
<input type="file" id="ff" accept="image/*" multiple hidden>
<input type="file" id="fc" accept="image/*" multiple hidden>
<input type="file" id="fv" accept="video/*" hidden>
<script>
const sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0');
const $=i=>document.getElementById(i);
let user=null,fotos=[],cores=[],video=null;
const msg=t=>$('m').textContent=t;
async function init(){
 const {data}=await sb.auth.getSession();user=data.session&&data.session.user;
 $('login').classList.toggle('hide',!!user);$('form').classList.toggle('hide',!user);
 if(user)cats();
}
async function cats(){
 const {data}=await sb.from('categories').select('id,name,parent_id').order('name').limit(1000);
 if(!data||!data.length)return;
 const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
 const kids={},groups={},OUT='Outras categorias';
 data.forEach(c=>{const k=c.parent_id||'root';(kids[k]=kids[k]||[]).push(c)});
 function walk(c,path){
  const ch=kids[c.id];
  if(!ch||!ch.length){const g=path.length?path.join(' › '):OUT;(groups[g]=groups[g]||[]).push(c);return}
  ch.forEach(x=>walk(x,path.concat(c.name)));
 }
 (kids.root||[]).forEach(c=>walk(c,[]));
 const keys=Object.keys(groups).sort((a,b)=>a===OUT?1:b===OUT?-1:a.localeCompare(b,'pt'));
 $('cat').innerHTML='<option value="">— Escolha a categoria —</option>'+keys.map(k=>
  `<optgroup label="${esc(k)}">`+groups[k].sort((a,b)=>a.name.localeCompare(b.name,'pt')).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')+'</optgroup>').join('');
 $('catb').classList.remove('hide');
}
$('ent').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});error?alert('Email ou palavra-passe errados.'):init()};
$('cri').onclick=async()=>{const {error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value});
 if(error)return alert(error.message);alert('Conta criada. Toque em Entrar.');init()};
function draw(){
 $('fg').innerHTML=fotos.map((f,i)=>`<div class="it"><img src="${f.prev}"><button class="x" onclick="fotos.splice(${i},1);draw()">×</button></div>`).join('');
 $('cg').innerHTML=cores.map((c,i)=>`<div class="it"><img src="${c.prev}"><button class="x" onclick="cores.splice(${i},1);draw()">×</button>
  <input placeholder="Nome da cor" value="${c.nome}" oninput="cores[${i}].nome=this.value">
  <label><input type="checkbox" ${c.ok?'checked':''} onchange="cores[${i}].ok=this.checked"> Disponível</label></div>`).join('');
}
$('af').onclick=()=>$('ff').click();$('ac').onclick=()=>$('fc').click();$('av').onclick=()=>$('fv').click();
$('ff').onchange=e=>{[...e.target.files].forEach(f=>fotos.push({file:f,prev:URL.createObjectURL(f)}));e.target.value='';draw()};
$('fc').onchange=e=>{[...e.target.files].forEach(f=>cores.push({file:f,prev:URL.createObjectURL(f),nome:'',ok:true}));e.target.value='';draw()};
$('fv').onchange=e=>{video=e.target.files[0];$('vn').textContent=video?video.name:''};
$('ti').oninput=()=>{$('tc').innerHTML=tams().map(t=>`<span>${t}</span>`).join('')};
const tams=()=>$('ti').value.split(',').map(s=>s.trim()).filter(Boolean);
async function up(file){
 const p=`${user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}-${file.name.replace(/[^\w.]/g,'_')}`;
 const {error}=await sb.storage.from('produtos').upload(p,file);if(error)throw error;
 return sb.storage.from('produtos').getPublicUrl(p).data.publicUrl;
}
$('sv').onclick=async()=>{
 if(!$('nome').value||!$('preco').value)return msg('Preencha o nome e o preço.');
 if(!$('catb').classList.contains('hide')&&!$('cat').value)return msg('Escolha a categoria.');
 if(!fotos.length&&!cores.length)return msg('Adicione pelo menos uma foto.');
 if(cores.some(c=>!c.nome.trim()))return msg('Dê um nome a cada cor.');
 $('sv').disabled=true;
 try{
  msg('A enviar fotos…');
  const imgs=[];for(const f of fotos)imgs.push(await up(f.file));
  const cs=[];for(const c of cores){const u=await up(c.file);cs.push({nome:c.nome.trim(),foto:u,disponivel:c.ok});if(!imgs.includes(u))imgs.push(u)}
  let v=null;if(video){msg('A enviar vídeo…');v=await up(video)}
  const row={name:$('nome').value,price:Number($('preco').value),currency:$('moeda').value,description:$('desc').value,
   images:imgs,image_url:imgs[0],video_url:v,colors:cs,sizes:tams(),supplier_id:user.id};
  if(!$('catb').classList.contains('hide'))row.category_id=$('cat').value;
  const {data,error}=await sb.from('products').insert(row).select('id').single();
  if(error)throw error;
  msg('Produto publicado ✓');
  location.href='produto-bbabilonia.html?id='+data.id;
 }catch(e){msg('Erro: '+(e.message||e));$('sv').disabled=false}
};
init();
</script></body></html>
