<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBabilônia</title>
<style>
:root{--bg:#111;--card:#1c1c1f;--line:#2c2c30;--tx:#f3f3f3;--mut:#9a9aa2;--ac:#ff4d6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:96px}
header{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header a{color:var(--tx);text-decoration:none;font-weight:600}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;position:relative}
.gal img,.gal video{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:start;background:#000}
.cnt{position:absolute;right:12px;margin-top:-40px;background:#000a;padding:4px 10px;border-radius:14px;font-size:13px}
.box{padding:14px 16px}h1{font-size:22px;margin:4px 0}.pr{color:var(--ac);font-size:28px;font-weight:700}
.mut{color:var(--mut)}h3{margin:18px 0 8px;font-size:15px}
.cores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cor{border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);text-align:center;font-size:14px;position:relative;cursor:pointer}
.cor img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.cor span{display:block;padding:6px 2px}
.cor.on{border-color:var(--ac)}.cor.off{opacity:.4;pointer-events:none}
.cor.off::after{content:"Esgotado";position:absolute;top:6px;left:6px;background:#000c;font-size:11px;padding:2px 6px;border-radius:8px}
.tams{display:flex;flex-wrap:wrap;gap:8px}
.tam{padding:9px 16px;border:2px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.tam.on{border-color:var(--ac);color:var(--ac)}
.q{display:inline-flex;border:1px solid var(--line);border-radius:8px}.q button{width:42px;height:40px;background:none;border:0;color:var(--tx);font-size:20px}
.q b{width:44px;text-align:center;line-height:40px}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line)}
.bar button{flex:1;height:50px;border-radius:12px;font-size:16px;font-weight:600;border:2px solid var(--ac);background:none;color:var(--tx)}
.bar .b2{background:var(--ac);color:#fff}
#msg{color:var(--ac);min-height:20px;font-size:14px;margin-top:8px}
</style></head><body>
<header><a href="index.html">← BBabilônia</a><a href="carrinho.html">Carrinho</a></header>
<div id="app"><p class="box mut">A carregar…</p></div>
<script>
const URL_='https://dsfoqoeawvjafypycldz.supabase.co',KEY='sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0';
const id=new URLSearchParams(location.search).get('id');
let P,cor=null,tam=null,qtd=1,fotos=[];
const U=x=>typeof x==='string'?x:(x&&(x.url||x.src))||'';
const J=x=>{if(typeof x==='string'){try{return JSON.parse(x)}catch(e){return[]}}return x||[]};
(async()=>{
 try{
  const r=await fetch(`${URL_}/rest/v1/products?id=eq.${id}&select=*`,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  P=(await r.json())[0];
  if(!P)throw 0;
 }catch(e){document.getElementById('app').innerHTML='<p class="box">Produto não encontrado.</p>';return}
 fotos=J(P.images).map(U).filter(Boolean);
 if(!fotos.length&&P.image_url)fotos=[P.image_url];
 let cores=J(P.colors).map(c=>({nome:c.nome||c.name,foto:U(c.foto||c.image),ok:c.disponivel!==false}));
 let tams=J(P.sizes);
 if(!cores.length||!tams.length){ // produtos antigos
  const v=J(P.variants);
  if(!cores.length){const s={};v.forEach(x=>{const n=x.cor||x.color;if(n&&!s[n]){s[n]=1;cores.push({nome:n,foto:'',ok:(x.stock??x.quantity??1)>0})}})}
  if(!tams.length){tams=[...new Set(v.map(x=>x.tamanho||x.size).filter(Boolean))]}
 }
 const nome=P.name||P.nome||'Produto',cur=P.currency||'MZN';
 document.title=nome+' • BBabilônia';
 const vid=P.video_url?`<video src="${P.video_url}" controls playsinline preload="metadata"></video>`:'';
 document.getElementById('app').innerHTML=`
 <div class="gal" id="gal">${fotos.map(f=>`<img src="${f}" alt="">`).join('')}${vid}</div>
 <div class="cnt" id="cnt"></div>
 <div class="box"><h1>${nome}</h1><div class="pr">${P.price} ${cur}</div>
 <p class="mut">${P.description||''}</p>
 ${cores.length?`<h3>Cor: <span id="cn" class="mut">escolha uma</span></h3><div class="cores">${cores.map((c,i)=>`<div class="cor ${c.ok?'':'off'}" data-i="${i}"><img src="${c.foto||fotos[0]||''}" alt=""><span>${c.nome}</span></div>`).join('')}</div>`:''}
 ${tams.length?`<h3>Tamanho</h3><div class="tams">${tams.map(t=>`<div class="tam">${t}</div>`).join('')}</div>`:''}
 <h3>Quantidade</h3><div class="q"><button id="mn">−</button><b id="qt">1</b><button id="mx">+</button></div>
 <div id="msg"></div></div>
 <div class="bar"><button id="add">Adicionar ao carrinho</button><button class="b2" id="buy">Comprar agora</button></div>`;
 const gal=document.getElementById('gal'),cnt=document.getElementById('cnt');
 const upd=()=>{const n=gal.children.length;cnt.textContent=(Math.round(gal.scrollLeft/gal.clientWidth)+1)+'/'+n};
 gal.onscroll=upd;upd();
 document.querySelectorAll('.cor').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.cor').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  cor=cores[el.dataset.i];document.getElementById('cn').textContent=cor.nome;
  const i=fotos.indexOf(cor.foto);if(i>=0)gal.scrollTo({left:i*gal.clientWidth,behavior:'smooth'});
 });
 document.querySelectorAll('.tam').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.tam').forEach(x=>x.classList.remove('on'));el.classList.add('on');tam=el.textContent});
 mn.onclick=()=>{qtd=Math.max(1,qtd-1);qt.textContent=qtd};mx.onclick=()=>{qtd++;qt.textContent=qtd};
 const guardar=()=>{
  if(cores.length&&!cor)return msg.textContent='Escolha uma cor.',false;
  if(tams.length&&!tam)return msg.textContent='Escolha um tamanho.',false;
  const c=JSON.parse(localStorage.getItem('carrinho')||'[]');
  c.push({nome,cor:cor?cor.nome:'',tamanho:tam||'',qtd,preco:Number(P.price),moeda:cur,foto:(cor&&cor.foto)||fotos[0]||''});
  localStorage.setItem('carrinho',JSON.stringify(c));msg.textContent='';return true};
 add.onclick=()=>{if(guardar())msg.textContent='Adicionado ao carrinho ✓'};
 buy.onclick=()=>{if(guardar())location.href='carrinho.html'};
})();
</script></body></html>
