<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produto | BBabilônia</title>
<style>
:root{--azul:#264190;--fundo:#fff;--texto:#1A1D29;--suave:#6B7080;--linha:#E1E3EA;--ok:#1E7A4C;--erro:#B5472E}
@media (prefers-color-scheme:dark){:root{--fundo:#12141C;--texto:#F1F2F6;--suave:#9AA0B3;--linha:#2B2F3D}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--fundo);color:var(--texto);line-height:1.4;padding-bottom:30px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#1B2F6B;color:#fff;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font-weight:700}
main{max-width:560px;margin:auto}
.foto{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f1f1f1;display:block}
.mini{display:flex;gap:8px;padding:8px 14px;overflow-x:auto}
.mini img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid var(--linha);cursor:pointer}
video{width:100%;max-height:420px;background:#000;display:block}
.bloco{padding:14px;border-bottom:1px solid var(--linha)}
h1{font-size:20px;font-weight:600}
.preco{font-size:26px;font-weight:700;margin-top:6px}
.rot{color:var(--suave);margin-bottom:10px}
.rot b{color:var(--texto)}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{min-width:56px;padding:10px 14px;border:2px solid var(--linha);border-radius:10px;background:transparent;color:var(--texto);font:inherit;cursor:pointer;display:flex;align-items:center;gap:8px}
.op img{width:34px;height:34px;object-fit:cover;border-radius:6px}
.op[aria-pressed=true]{border-color:var(--texto);background:var(--texto);color:var(--fundo)}
.op:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.disp{margin-top:10px;font-size:14px;color:var(--ok)}
.disp.x{color:var(--erro)}
.qtd{display:inline-flex;border:2px solid var(--linha);border-radius:10px;align-items:center}
.qtd button{width:44px;height:44px;border:0;background:transparent;color:var(--texto);font-size:22px;cursor:pointer}
.qtd span{min-width:36px;text-align:center;font-weight:600}
#add{display:block;width:calc(100% - 28px);margin:16px 14px 6px;padding:15px;border:0;border-radius:12px;background:var(--azul);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
#msg{padding:4px 14px;font-weight:600;min-height:24px}
#msg a{color:var(--azul)}
</style>
</head>
<body>
<header><a href="index.html">B-Babilônia</a><a href="carrinho.html">Carrinho (<span id="n">0</span>)</a></header>
<main id="app"><p class="bloco">A carregar...</p></main>
<script>
const SUPA="https://dsfoqoeawvjafypycldz.supabase.co";
const KEY="sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0";
const $=i=>document.getElementById(i);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nome=o=>o.name||o.nome||o.title||o.titulo||"Produto";
const fmt=(v,m)=>Number(v||0).toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+(m||"MZN");
const id=new URLSearchParams(location.search).get("id");
let P=null,V=[],IM=[],cor=null,tam=null,qtd=1,fotoAtual=null;

function contar(){let n=0;try{JSON.parse(localStorage.getItem("carrinho")||"[]").forEach(i=>n+=Number(i.qtd||1))}catch(e){}$("n").textContent=n}

function ler(raw){
  let v=raw;
  if(typeof v==="string"){try{v=JSON.parse(v)}catch(e){v=[]}}
  if(!Array.isArray(v))return[];
  const out=[],vistos={};
  v.forEach(x=>{
    const c=String(x.cor||x.color||"").trim().replace(/\.$/,"");
    const s=Number(x.stock!=null?x.stock:(x.quantity!=null?x.quantity:x.qty))||0;
    const img=x.foto||x.image||x.image_url||null;
    let lista=String(x.tamanho||x.size||"").split(/[,;.\s]+/).filter(Boolean);
    if(!lista.length)lista=[""];
    lista.forEach(t=>{const k=c+"|"+t;if(vistos[k])return;vistos[k]=1;out.push({cor:c,tam:t,stock:s,img:img})});
  });
  return out;
}

function estoque(){
  const f=V.find(v=>v.cor===(cor||"")&&v.tam===(tam||""));
  return f?f.stock:null;
}

function desenhar(){
  const cores=[...new Set(V.map(v=>v.cor))].filter(Boolean);
  const tams=V.filter(v=>v.cor===(cor||"")&&v.tam);
  const principal=fotoAtual||IM[0]||"";
  const st=estoque();
  let h="";
  if(P.video_url)h+='<video controls playsinline preload="metadata" src="'+esc(P.video_url)+'"></video>';
  if(principal)h+='<img class="foto" src="'+esc(principal)+'" alt="">';
  if(IM.length>1)h+='<div class="mini">'+IM.map((u,i)=>'<img src="'+esc(u)+'" data-i="'+i+'" alt="">').join("")+'</div>';
  h+='<div class="bloco"><h1>'+esc(nome(P))+'</h1><div class="preco">'+fmt(P.price!=null?P.price:P.preco,P.currency)+'</div></div>';
  if(cores.length){
    h+='<div class="bloco"><div class="rot">Cor: <b>'+(cor?esc(cor):"escolha uma cor")+'</b></div><div class="ops">'+
      cores.map(c=>{const im=(V.find(v=>v.cor===c&&v.img)||{}).img;
        return '<button class="op" data-cor="'+esc(c)+'" aria-pressed="'+(c===cor)+'">'+(im?'<img src="'+esc(im)+'" alt="">':"")+esc(c)+'</button>'}).join("")+'</div></div>';
  }
  if(V.some(v=>v.tam)){
    h+='<div class="bloco"><div class="rot">Tamanho: <b>'+(tam?esc(tam):"escolha um tamanho")+'</b></div>';
    if(cores.length&&!cor){h+='<div class="rot">Escolha primeiro a cor.</div>';}
    else{
      h+='<div class="ops">'+tams.map(v=>'<button class="op" data-tam="'+esc(v.tam)+'" aria-pressed="'+(v.tam===tam)+'"'+(v.stock<=0?" disabled":"")+'>'+esc(v.tam)+'</button>').join("")+'</div>';
      if(tam&&st!==null)h+='<div class="disp'+(st>0?"":" x")+'">'+(st>0?st+" disponíveis":"Esgotado")+'</div>';
    }
    h+='</div>';
  }
  h+='<div class="bloco"><div class="rot">Quantidade</div><div class="qtd"><button data-q="-1" aria-label="Menos">−</button><span>'+qtd+'</span><button data-q="1" aria-label="Mais">+</button></div></div>';
  h+='<button id="add">Adicionar ao carrinho</button><div id="msg" role="status"></div>';
  $("app").innerHTML=h;
}

function adicionar(){
  const msg=$("msg");
  if(V.some(v=>v.cor)&&!cor){msg.textContent="Escolha uma cor.";return}
  if(V.some(v=>v.tam)&&!tam){msg.textContent="Escolha um tamanho.";return}
  const st=estoque();
  if(st!==null&&st<=0){msg.textContent="Este tamanho está esgotado.";return}
  if(st!==null&&qtd>st){msg.textContent="Só temos "+st+" disponíveis.";return}
  let c=[];try{c=JSON.parse(localStorage.getItem("carrinho")||"[]")}catch(e){}
  const ex=c.find(i=>i.id===P.id&&i.cor===(cor||"")&&i.tamanho===(tam||""));
  if(ex)ex.qtd=Number(ex.qtd||1)+qtd;
  else c.push({id:P.id,nome:nome(P),cor:cor||"",tamanho:tam||"",qtd:qtd,preco:Number(P.price!=null?P.price:P.preco)||0,moeda:P.currency||"MZN",foto:fotoAtual||IM[0]||""});
  localStorage.setItem("carrinho",JSON.stringify(c));
  contar();
  msg.innerHTML='Adicionado ao carrinho. <a href="carrinho.html">Ver carrinho</a>';
}

$("app").addEventListener("click",e=>{
  const b=e.target.closest("button,img[data-i]");
  if(!b)return;
  if(b.dataset.cor!==undefined){cor=b.dataset.cor;tam=null;qtd=1;fotoAtual=(V.find(v=>v.cor===cor&&v.img)||{}).img||null;desenhar();}
  else if(b.dataset.tam!==undefined){tam=b.dataset.tam;qtd=1;desenhar();}
  else if(b.dataset.q!==undefined){const st=estoque();let n=qtd+Number(b.dataset.q);if(n<1)n=1;if(st!==null&&n>st)n=Math.max(st,1);qtd=n;desenhar();}
  else if(b.dataset.i!==undefined){fotoAtual=IM[Number(b.dataset.i)];desenhar();}
  else if(b.id==="add")adicionar();
});

async function iniciar(){
  contar();
  if(!id){$("app").innerHTML='<p class="bloco">Produto não encontrado. <a href="index.html">Ver loja</a></p>';return}
  try{
    const r=await fetch(SUPA+"/rest/v1/products?id=eq."+encodeURIComponent(id)+"&select=*",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
    const d=await r.json();
    if(!Array.isArray(d)||!d[0])throw 0;
    P=d[0];
  }catch(e){
    $("app").innerHTML='<p class="bloco">Não foi possível carregar o produto. <a href="index.html">Ver loja</a></p>';return;
  }
  V=ler(P.variants);
  IM=[P.image_url].concat(Array.isArray(P.images)?P.images:[]).filter(Boolean);
  const cores=[...new Set(V.map(v=>v.cor))].filter(Boolean);
  if(cores.length===1)cor=cores[0];
  document.title=nome(P)+" | BBabilônia";
  desenhar();
}
iniciar();
</script>
</body>
</html>
