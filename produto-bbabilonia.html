<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produto | BBabilônia</title>
<style>
:root{
  --bg:#0f1424; --card:#171d33; --line:#2a3250; --text:#f2f4fa; --muted:#98a1bf;
  --brand:#1b2f6e; --accent:#ff5a36; --chip:#1e2540;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px}
header{background:var(--brand);display:flex;justify-content:space-between;align-items:center;padding:16px 18px;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font-weight:600;font-size:18px}
#foto{width:100%;max-height:420px;object-fit:contain;background:#0a0e1a;display:block}
.wrap{padding:18px}
h1{font-size:24px;font-weight:600;margin-bottom:6px}
.preco{font-size:30px;font-weight:700;color:var(--accent);margin-bottom:6px}
.desc{color:var(--muted);font-size:15px;line-height:1.5;margin-top:10px}
.sec{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.sec h2{font-size:15px;font-weight:500;color:var(--muted);margin-bottom:12px}
.sec h2 b{color:var(--text);font-weight:600}
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.cor{background:var(--chip);border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;text-align:center;font-size:14px;color:var(--text)}
.cor img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#0a0e1a}
.cor .sem{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#0a0e1a;color:var(--muted);font-size:12px}
.cor span{display:block;padding:7px 4px}
.cor.on{border-color:var(--accent)}
.cor.on span{color:var(--accent);font-weight:600}
.cor.off{opacity:.4}
.tams{display:flex;flex-wrap:wrap;gap:10px}
.tam{min-width:56px;padding:11px 16px;background:var(--chip);border:2px solid transparent;border-radius:10px;color:var(--text);font-size:16px;cursor:pointer;text-align:center}
.tam.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.tam.off{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.aviso{color:var(--muted);font-size:14px}
.qtd{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qtd button{width:48px;height:46px;background:none;border:0;color:var(--text);font-size:22px;cursor:pointer}
.qtd span{min-width:44px;text-align:center;font-size:18px}
.stock{color:var(--muted);font-size:14px;margin-left:12px}
video{width:100%;border-radius:10px;margin-top:14px;background:#000}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px}
#add{width:100%;padding:16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:18px;font-weight:600;cursor:pointer}
#add:disabled{background:#3a4263;color:#8c94b3}
#msg{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:10px;font-size:15px;display:none;z-index:9;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>
  <a href="index.html">B-Babilônia</a>
  <a href="carrinho.html">Carrinho (<span id="cnt">0</span>)</a>
</header>

<img id="foto" alt="" style="display:none">

<div class="wrap">
  <h1 id="nome">A carregar…</h1>
  <div class="preco" id="preco"></div>

  <div class="sec" id="secCor" style="display:none">
    <h2>Cor: <b id="corSel">escolha uma cor</b></h2>
    <div class="cores" id="cores"></div>
  </div>

  <div class="sec" id="secTam" style="display:none">
    <h2>Tamanho: <b id="tamSel">escolha um tamanho</b></h2>
    <div class="tams" id="tams"></div>
  </div>

  <div class="sec">
    <h2>Quantidade</h2>
    <div class="qtd"><button id="menos" type="button">−</button><span id="q">1</span><button id="mais" type="button">+</button></div>
    <span class="stock" id="stock"></span>
  </div>

  <div class="sec" id="secVideo" style="display:none">
    <h2>Vídeo do produto</h2>
    <video id="video" controls playsinline preload="metadata"></video>
  </div>

  <p class="desc" id="desc"></p>
</div>

<div class="barra"><button id="add" type="button">Adicionar ao carrinho</button></div>
<div id="msg"></div>

<script>
var SUPABASE_URL = "https://dsfoqoeawvjafypycldz.supabase.co";
var SUPABASE_KEY = "sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0";

var produto = null, variantes = [], cores = [];
var corSel = "", tamSel = "", qtd = 1;

function $(id){ return document.getElementById(id); }
function cap(s){ s = String(s).trim(); return s.charAt(0).toUpperCase() + s.slice(1); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function lerCarrinho(){
  try { return JSON.parse(localStorage.getItem("carrinho")) || []; } catch(e){ return []; }
}
function atualizarContador(){
  var n = 0; lerCarrinho().forEach(function(i){ n += Number(i.qtd) || 1; });
  $("cnt").textContent = n;
}
function aviso(t){
  var m = $("msg"); m.textContent = t; m.style.display = "block";
  clearTimeout(aviso.t); aviso.t = setTimeout(function(){ m.style.display = "none"; }, 2200);
}

/* Aceita os formatos antigos e novos de variants e separa cores escritas juntas
   (ex.: "Branco .preto. Azul. Vinho" vira 4 cores) */
function normalizar(raw){
  var lista = raw;
  if (typeof lista === "string") { try { lista = JSON.parse(lista); } catch(e){ lista = []; } }
  if (!Array.isArray(lista)) lista = [];
  var out = [];
  lista.forEach(function(v){
    if (!v) return;
    var cor = v.cor || v.color || v.colour || "";
    var tam = v.tamanho || v.size || "";
    var st = (v.stock !== undefined && v.stock !== null && v.stock !== "") ? v.stock
           : (v.quantity !== undefined ? v.quantity : (v.qtd !== undefined ? v.qtd : null));
    st = (st === null) ? null : Number(st);
    var foto = v.foto || v.image || v.image_url || v.img || "";
    var cs = String(cor).split(/[,.;\/|]+/).map(function(x){ return x.trim(); }).filter(Boolean);
    if (!cs.length) cs = [""];
    var ts = String(tam).split(/[,;\/|]+/).map(function(x){ return x.trim(); }).filter(Boolean);
    if (!ts.length) ts = [""];
    cs.forEach(function(c){ ts.forEach(function(t){
      out.push({cor: c ? cap(c) : "", tam: t.toUpperCase(), stock: st, foto: foto});
    }); });
  });
  return out;
}

function montarCores(){
  var vistos = {};
  cores = [];
  variantes.forEach(function(v){
    if (!v.cor) return;
    if (!vistos[v.cor]) { vistos[v.cor] = {nome: v.cor, foto: v.foto || "", total: 0}; cores.push(vistos[v.cor]); }
    if (!vistos[v.cor].foto && v.foto) vistos[v.cor].foto = v.foto;
    vistos[v.cor].total += (v.stock === null ? 999 : v.stock);
  });
}

function tamanhosDaCor(){
  var vistos = {}, lista = [];
  variantes.forEach(function(v){
    if (cores.length && v.cor !== corSel) return;
    if (!v.tam) return;
    if (!vistos[v.tam]) { vistos[v.tam] = {nome: v.tam, stock: 0}; lista.push(vistos[v.tam]); }
    vistos[v.tam].stock += (v.stock === null ? 999 : v.stock);
  });
  return lista;
}

function stockAtual(){
  var s = 0, achou = false;
  variantes.forEach(function(v){
    if (cores.length && v.cor !== corSel) return;
    if (tamSel && v.tam !== tamSel) return;
    achou = true; s += (v.stock === null ? 999 : v.stock);
  });
  return achou ? s : 999;
}

function fotoAtual(){
  var c = cores.filter(function(x){ return x.nome === corSel; })[0];
  if (c && c.foto) return c.foto;
  return (produto && produto.image_url) || "";
}

function desenhar(){
  // foto principal muda com a cor escolhida
  var f = fotoAtual(), img = $("foto");
  if (f) { img.src = f; img.style.display = "block"; } else { img.style.display = "none"; }

  // cores
  if (cores.length) {
    $("secCor").style.display = "block";
    $("corSel").textContent = corSel || "escolha uma cor";
    $("cores").innerHTML = cores.map(function(c){
      var thumb = c.foto ? '<img src="'+esc(c.foto)+'" alt="">' : '<div class="sem">sem foto</div>';
      var cls = "cor" + (c.nome === corSel ? " on" : "") + (c.total <= 0 ? " off" : "");
      return '<div class="'+cls+'" data-cor="'+esc(c.nome)+'">'+thumb+'<span>'+esc(c.nome)+'</span></div>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".cor"), function(el){
      el.onclick = function(){
        var nome = el.getAttribute("data-cor");
        var c = cores.filter(function(x){ return x.nome === nome; })[0];
        if (c && c.total <= 0) { aviso("Esta cor está esgotada"); return; }
        corSel = nome; tamSel = ""; qtd = 1; desenhar();
      };
    });
  } else { $("secCor").style.display = "none"; }

  // tamanhos
  var temTams = variantes.some(function(v){ return v.tam; });
  if (temTams) {
    $("secTam").style.display = "block";
    $("tamSel").textContent = tamSel || "escolha um tamanho";
    if (cores.length && !corSel) {
      $("tams").innerHTML = '<span class="aviso">Escolha primeiro a cor.</span>';
    } else {
      $("tams").innerHTML = tamanhosDaCor().map(function(t){
        var cls = "tam" + (t.nome === tamSel ? " on" : "") + (t.stock <= 0 ? " off" : "");
        return '<button type="button" class="'+cls+'" data-tam="'+esc(t.nome)+'">'+esc(t.nome)+'</button>';
      }).join("");
      Array.prototype.forEach.call(document.querySelectorAll(".tam"), function(el){
        el.onclick = function(){
          if (el.className.indexOf("off") > -1) { aviso("Tamanho esgotado"); return; }
          tamSel = el.getAttribute("data-tam"); qtd = 1; desenhar();
        };
      });
    }
  } else { $("secTam").style.display = "none"; }

  // quantidade e stock
  var max = stockAtual();
  if (qtd > max) qtd = Math.max(1, max);
  $("q").textContent = qtd;
  $("stock").textContent = (max < 999 && (tamSel || (!cores.length && !temTams))) ? ("Disponível: " + max) : "";
  $("add").disabled = (max <= 0);
}

function adicionar(){
  if (cores.length && !corSel) { aviso("Escolha a cor"); return; }
  var temTams = variantes.some(function(v){ return v.tam; });
  if (temTams && !tamSel) { aviso("Escolha o tamanho"); return; }
  if (stockAtual() <= 0) { aviso("Esgotado"); return; }

  var preco = Number(produto.price !== undefined ? produto.price : (produto.preco !== undefined ? produto.preco : 0));
  var item = {
    id: produto.id,
    nome: produto.name || produto.nome || produto.title || "Produto",
    cor: corSel, tamanho: tamSel, qtd: qtd,
    preco: preco, moeda: produto.currency || "MZN",
    foto: fotoAtual()
  };
  var c = lerCarrinho(), achou = false;
  c.forEach(function(i){
    if (i.id === item.id && i.cor === item.cor && i.tamanho === item.tamanho) { i.qtd = (Number(i.qtd)||0) + item.qtd; achou = true; }
  });
  if (!achou) c.push(item);
  try { localStorage.setItem("carrinho", JSON.stringify(c)); } catch(e){}
  atualizarContador();
  aviso("Adicionado ao carrinho");
}

$("menos").onclick = function(){ if (qtd > 1) { qtd--; $("q").textContent = qtd; } };
$("mais").onclick = function(){
  if (qtd < stockAtual()) { qtd++; $("q").textContent = qtd; } else { aviso("Não há mais stock"); }
};
$("add").onclick = adicionar;
atualizarContador();

var id = new URLSearchParams(location.search).get("id");
if (!id) {
  $("nome").textContent = "Produto não encontrado";
} else {
  fetch(SUPABASE_URL + "/rest/v1/products?id=eq." + encodeURIComponent(id) + "&select=*", {
    headers: { "apikey": SUPABASE_KEY }
  }).then(function(r){ return r.json(); }).then(function(rows){
    if (!rows || !rows.length) { $("nome").textContent = "Produto não encontrado"; return; }
    produto = rows[0];
    var nome = produto.name || produto.nome || produto.title || "Produto";
    document.title = nome + " | BBabilônia";
    $("nome").textContent = nome;
    var p = Number(produto.price !== undefined ? produto.price : (produto.preco !== undefined ? produto.preco : 0));
    $("preco").textContent = p.toLocaleString("pt-PT", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " " + (produto.currency || "MZN");
    $("desc").textContent = produto.description || produto.descricao || "";
    if (produto.video_url) { $("video").src = produto.video_url; $("secVideo").style.display = "block"; }
    variantes = normalizar(produto.variants);
    montarCores();
    if (cores.length === 1 && cores[0].total > 0) corSel = cores[0].nome;
    desenhar();
  }).catch(function(){
    $("nome").textContent = "Erro ao carregar o produto";
  });
}
</script>
</body>
</html>
