<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Destaques pagos · BBabilônia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>if(!/^(admin|administrator)\./i.test(location.hostname))document.write('<script src="atd-sessao.js?v=1"><\/script>');</script>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef2f7;color:#0f172a;line-height:1.45;color-scheme:light}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#ea580c,#FF6A00);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px}
.bar h1{font-size:17px;flex:1}.bar a{color:#fff;background:#ffffff2e;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px #0001;margin-bottom:12px}.box h2{font-size:16px;margin-bottom:4px}
.l{font-size:14px;color:#334155;margin:2px 0}.val{font-size:20px;font-weight:900;color:#c2410c;margin:6px 0}
.ref{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:8px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.fotos a img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid #e2e8f0}
.est{display:inline-block;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:20px;margin-top:6px}
.est.esp{background:#fef3c7;color:#92400e}.est.ok{background:#d1fae5;color:#065f46}.est.no{background:#ffe4e6;color:#9f1239}
.bs{display:flex;gap:8px;margin-top:12px}.bs button{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:800;color:#fff}.sim{background:#10b981}.nao{background:#ef4444}button:disabled{opacity:.5}
textarea,input{width:100%;padding:11px;border:2px solid #e2e8f0;border-radius:12px;font:inherit;font-size:16px;margin-top:8px}
label{display:block;font-size:13px;font-weight:700;margin-top:10px;color:#475569}
.msg{font-size:14px;margin-top:8px;color:#dc2626;white-space:pre-line}.msg.ok{color:#059669}.hide{display:none}.vz{text-align:center;color:#64748b;padding:24px 10px}
.bt{border:0;border-radius:12px;padding:12px;font:inherit;font-size:15px;font-weight:800;color:#fff;background:#2563eb;width:100%;margin-top:10px}
</style>
</head>
<body>
<script>(function(){var H=(/^(admin|administrator)\./i.test(location.hostname)?'/':'atendimento.html');try{var r=document.referrer?new URL(document.referrer):null;if(r&&r.host===location.host&&history.length>1)return}catch(e){}
var u=location.href;try{history.replaceState({bbBase:1},'',H);history.pushState({bbPag:1},'',u)}catch(e){return}
addEventListener('popstate',function(e){if(e.state&&e.state.bbBase)location.replace(H)});})();</script>
<div class="bar"><h1>⭐ Destaques pagos</h1><a id="painel" href="atendimento.html">← Painel</a></div>
<main>
 <section id="vEntrar" class="box hide"><h2>Entrar</h2>
  <input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Palavra-passe" autocomplete="current-password">
  <button class="bt" id="ent">Entrar</button><p class="msg" id="eMsg"></p></section>
 <section id="vApp" class="hide">
  <div class="box hide" id="cfg"><h2>💰 Preços (só o dono)</h2>
   <label>Preço por dia em Moçambique (MZN)</label><input id="cMzn" type="number" min="1" step="any" inputmode="decimal">
   <label>Preço por dia para estrangeiros (USD, mínimo 1)</label><input id="cUsd" type="number" min="1" step="any" inputmode="decimal">
   <label>Alcance estimado por dia (pessoas que veem)</label><input id="cAlc" type="number" min="1" step="1" inputmode="numeric">
   <label>Máximo de dias que se pode comprar</label><input id="cMax" type="number" min="1" max="365" step="1" inputmode="numeric">
   <label>Como os estrangeiros pagam (banco, USDT…) — o fornecedor vê este texto</label><textarea id="cIns" rows="4"></textarea>
   <button class="bt" id="cGrava">Guardar preços</button><p class="msg" id="cMsg"></p></div>
  <div id="lista"><div class="box vz">A carregar…</div></div>
 </section>
</main>
<script>
var ADM=/^(admin|administrator)\./i.test(location.hostname);
var sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0',ADM?{}:(window.ATD_AUTH||{}));
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function din(v,m){return Number(v||0).toLocaleString('pt-PT',{maximumFractionDigits:2})+' '+(m||'MZN')}
function dh(d){try{return d?new Date(d).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}catch(e){return''}}
if(ADM)$('painel').setAttribute('href','/');
function vista(v){['vEntrar','vApp'].forEach(function(x){$(x).classList.toggle('hide',x!==v)})}
async function iniciar(){var s=(await sb.auth.getSession()).data.session;if(!s){vista('vEntrar');return}vista('vApp');carregar();config()}
async function config(){
 var r=await sb.rpc('destaque_config_ler');if(r.error||!r.data)return;var c=r.data;
 $('cfg').classList.remove('hide');$('cMzn').value=c.preco_dia_mzn;$('cUsd').value=c.preco_dia_usd;$('cAlc').value=c.alcance_dia;$('cMax').value=c.max_dias;$('cIns').value=c.instrucoes_estrangeiro||'';
}
$('cGrava').onclick=async function(){
 var m=$('cMsg');m.className='msg';m.textContent='';
 var r=await sb.rpc('destaque_config_guardar',{p_mzn:Number($('cMzn').value),p_usd:Number($('cUsd').value),p_alcance:parseInt($('cAlc').value,10),p_max:parseInt($('cMax').value,10),p_instr:$('cIns').value});
 if(r.error){m.textContent=r.error.message;return}m.className='msg ok';m.textContent='✅ Preços guardados.';
};
async function carregar(){
 var r=await sb.rpc('destaque_lista');
 if(r.error){$('lista').innerHTML='<div class="box"><p class="msg">'+esc(/function|find|exist/i.test(r.error.message)?'Falta correr o SQL do destaque no Supabase.':r.error.message)+'</p></div>';return}
 var L=r.data||[];
 if(!L.length){$('lista').innerHTML='<div class="box vz">Ainda não há pedidos de destaque.</div>';return}
 $('lista').innerHTML=L.map(function(p){
  var est=p.estado==='pago'?'<span class="est ok">✅ Pago · '+esc(p.meio==='mpesa'?'M-Pesa automático':'confirmado por '+(p.decidido_por||''))+' · '+esc(dh(p.decidido_em))+'</span>':
   p.estado==='recusado'?'<span class="est no">❌ Recusado: '+esc(p.motivo)+'</span>':'<span class="est esp">⏳ Por confirmar</span>';
  return '<div class="box" data-o="'+esc(p.id)+'"><h2>'+esc(p.produto_nome||'Produto')+'</h2><div class="val">'+din(p.valor,p.moeda)+' · '+p.dias+' dias</div>'+
   '<p class="l">Alcance estimado: '+esc(p.alcance||'—')+' · Enviado '+esc(dh(p.criado_em))+'</p>'+(p.ref?'<div class="ref">'+esc(p.ref)+'</div>':'')+'<div class="fotos" data-f></div>'+est+
   (p.estado==='por_confirmar'?'<div class="bs"><button class="sim" data-ok="1">✅ O dinheiro entrou</button><button class="nao" data-ok="0">❌ Não entrou</button></div><textarea rows="2" class="hide" data-mot placeholder="Motivo (o fornecedor vai ver)"></textarea><p class="msg"></p>':'')+'</div>';
 }).join('');
 L.forEach(function(p){var c=document.querySelector('[data-o="'+p.id+'"] [data-f]');if(!c)return;
  (p.fotos||[]).forEach(async function(cam){try{var u=await sb.storage.from('provas-envio').createSignedUrl(cam,3600);if(u.data&&u.data.signedUrl)c.insertAdjacentHTML('beforeend','<a href="'+esc(u.data.signedUrl)+'" target="_blank"><img src="'+esc(u.data.signedUrl)+'" alt="Prova"></a>');else c.insertAdjacentHTML('beforeend','<span class="l">📷 foto não abriu</span>')}catch(e){}})});
}
$('lista').addEventListener('click',async function(ev){
 var b=ev.target.closest('[data-ok]');if(!b)return;
 var box=b.closest('[data-o]'),id=box.getAttribute('data-o'),ok=b.getAttribute('data-ok')==='1',m=box.querySelector('.msg'),mot=box.querySelector('[data-mot]');
 m.className='msg';m.textContent='';
 if(!ok&&mot.classList.contains('hide')){mot.classList.remove('hide');mot.focus();b.textContent='❌ Recusar com este motivo';return}
 if(ok&&!confirm('Confirmar que o dinheiro entrou?\nO produto fica em destaque.'))return;
 box.querySelectorAll('button').forEach(function(x){x.disabled=true});
 var r=await sb.rpc('destaque_decidir',{p_id:id,p_ok:ok,p_motivo:ok?'':mot.value});
 if(r.error){box.querySelectorAll('button').forEach(function(x){x.disabled=false});m.textContent=r.error.message;return}
 m.className='msg ok';m.textContent=ok?'✅ Confirmado. O produto está em destaque.':'Feito.';setTimeout(carregar,900);
});
$('ent').onclick=async function(){var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error){$('eMsg').textContent='Email ou palavra-passe errados.';return}iniciar()};
iniciar();
</script>
</body>
</html>
