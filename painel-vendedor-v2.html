<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel do vendedor · B-Babilônia</title>
<meta name="color-scheme" content="light">
<style>
:root{--r1:#1e1b4b;--r2:#5b21b6;--r3:#7c3aed;--cl:#f3f0ff;--fundo:#f1effb;--tx:#1b1740;--su:#6b7280;--li:#ece9f7;--ok:#047857;--okf:#d1fae5;--av:#b45309;--avf:#fef3c7;--er:#b91c1c;--erf:#fee2e2;--az:#1d4ed8;--azf:#dbeafe}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fundo);color:var(--tx);line-height:1.4}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
/* cabeçalho e cartões coloridos (aspeto do painel da Babilônia) */
.top{background:linear-gradient(135deg,#1e1b4b 0%,#5b21b6 55%,#9333ea 100%);color:#fff;padding:22px 16px 58px;border-radius:0 0 28px 28px}
.top .lg{font-size:13px;letter-spacing:2px;color:#fcd34d;font-weight:bold}
.top h1{margin:8px 0 4px;font-size:25px}.top p{font-size:14px;color:#e9d5ff}
.top .sair{float:right;background:#ffffff26;color:#fff;border:0;border-radius:999px;padding:6px 13px;font-size:13px}
.conteudo{padding:0 14px 40px;margin:-40px auto 0;max-width:1100px}
.voltar{display:inline-block;background:#fff;color:#5b21b6;font-weight:800;border-radius:999px;padding:8px 14px;margin-bottom:12px;box-shadow:0 4px 12px #4c1d9522;font-size:14px}
.aviso{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px #4c1d9533;border-left:6px solid #f59e0b;margin-bottom:14px;font-size:14px}.aviso b{color:#b45309}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
a.c{display:block;text-decoration:none;color:#fff;border-radius:18px;padding:18px 14px;min-height:128px;box-shadow:0 6px 16px #0003;position:relative;overflow:hidden}
a.c:active{transform:scale(.97)}
a.c .i{font-size:32px;display:block;margin-bottom:10px}
a.c b{display:block;font-size:16px;margin-bottom:4px}
a.c span{font-size:12.5px;opacity:.92;line-height:1.3;display:block}
a.c .nb{position:absolute;right:10px;top:10px;background:#ef4444;color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:2px 8px}
a.c.bloq{filter:grayscale(1);opacity:.6}a.c.bloq:after{content:"🔒";position:absolute;right:10px;top:10px;font-size:17px}
.c1{background:linear-gradient(135deg,#7c3aed,#4f46e5)}.c2{background:linear-gradient(135deg,#f59e0b,#ea580c)}.c3{background:linear-gradient(135deg,#0ea5e9,#2563eb)}
.c4{background:linear-gradient(135deg,#10b981,#047857)}.c5{background:linear-gradient(135deg,#ec4899,#be185d)}.c6{background:linear-gradient(135deg,#334155,#0f172a)}
.c7{background:linear-gradient(135deg,#10b981,#0ea5e9 60%,#2563eb)}.c8{background:linear-gradient(135deg,#06b6d4,#0e7490)}.c9{background:linear-gradient(135deg,#a855f7,#6d28d9)}
.c10{background:linear-gradient(135deg,#f97316,#c2410c)}.c11{background:linear-gradient(135deg,#e11d48,#9f1239)}.c12{background:linear-gradient(135deg,#64748b,#334155)}
.sec{margin:18px 4px 8px;font-size:13px;font-weight:800;color:#6b5fa8;text-transform:uppercase;letter-spacing:.5px}
.rodape{text-align:center;font-size:12px;color:#6b5fa8;margin-top:20px}.rodape a{color:#6b5fa8}
/* caixas */
.cx{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px #4c1d9514;margin-bottom:12px}
.cx h2{font-size:15.5px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cx h2 a{margin-left:auto;font-size:13px;color:var(--r3);font-weight:600}
.g2{display:grid;gap:12px}@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}}
.loja1{display:flex;gap:12px;align-items:center}
.loja1 .ic{flex:none;width:54px;height:54px;border-radius:12px;background:var(--r1);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.loja1 b{font-size:17px}.loja1 .m{font-size:12.5px;color:var(--su)}
.loja1 .lk{font-size:13px;color:var(--r3);font-weight:600;margin-right:12px}
.bdg{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;vertical-align:middle}
.b-ok{background:var(--okf);color:var(--ok)}.b-av{background:var(--avf);color:var(--av)}.b-er{background:var(--erf);color:var(--er)}.b-az{background:var(--azf);color:var(--az)}.b-cz{background:#e5e7eb;color:#374151}
/* números */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}@media(min-width:700px){.kpi{grid-template-columns:repeat(4,1fr)}}
.kpi a{background:#fff;border-radius:14px;padding:12px;box-shadow:0 4px 14px #4c1d9514;display:block}
.kpi .t{font-size:12.5px;color:var(--su);display:flex;align-items:center;gap:6px}
.kpi b{display:block;font-size:24px;margin:4px 0 2px}
.kpi .s{font-size:12px;color:var(--ok);font-weight:700}.kpi .s.neg{color:var(--er)}
.grande{font-size:26px;font-weight:800}.cres{font-size:13px;font-weight:800;color:var(--ok);margin-left:6px}.cres.neg{color:var(--er)}
.sub{font-size:12.5px;color:var(--su)}
svg.gr{width:100%;height:140px;display:block;margin-top:8px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.tres div{background:var(--cl);border-radius:10px;padding:8px}.tres b{display:block;font-size:17px}.tres span{font-size:12px;color:var(--su)}
/* listas */
.ln{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--li)}
.ln:first-of-type{border-top:0}
.ln img,.ln .sf{flex:none;width:46px;height:46px;border-radius:8px;object-fit:cover;background:#f3f3f3;display:grid;place-items:center;font-size:10px;color:#999}
.ln .t{flex:1;min-width:0}.ln .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .t span{font-size:12.5px;color:var(--su)}
.ln .ac{flex:none;display:flex;gap:6px;align-items:center}
.bt{border:0;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;background:var(--cl);color:var(--r2);display:inline-block}
.bt.p{background:var(--r3);color:#fff}.bt.g{width:100%;padding:12px;font-size:15px;border-radius:12px;text-align:center}
.av2{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.vazio{text-align:center;color:var(--su);font-size:13.5px;padding:14px 0}
.abas{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;border:1.5px solid var(--li);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.abas button.on{background:var(--r3);border-color:var(--r3);color:#fff}
input.cp,select.cp{width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;margin:4px 0 10px;background:#fff}
label.lb{font-size:13px;color:var(--su)}
.msg{font-size:13.5px;margin-top:6px;color:var(--er)}.msg.ok{color:var(--ok)}
/* passos */
.ps{display:flex;gap:12px;align-items:center;margin:8px 0}
.ps i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;background:#e5e7eb;color:#6b7280}
.ps.feito i{background:#10b981;color:#fff}.ps.agora i{background:#f59e0b;color:#fff}.ps.erro i{background:#ef4444;color:#fff}
.ps b{display:block;font-size:14px}.ps span{font-size:12.5px;color:var(--su)}.ps .bt{margin-left:auto}
.bloq{text-align:center;padding:26px 14px}.bloq .i{font-size:40px}.bloq p{color:var(--su);margin:8px 0 14px;font-size:14px}
details{border-top:1px solid var(--li);padding:10px 0}details:first-of-type{border-top:0}
summary{font-weight:700;font-size:14.5px;cursor:pointer}details p{font-size:13.5px;color:#444;margin-top:6px}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}
.modal .cx{width:100%;max-width:520px;border-radius:18px 18px 0 0;margin:0;max-height:90vh;overflow:auto}
.toast{position:fixed;left:12px;right:12px;bottom:18px;background:var(--r1);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:60;display:none;text-align:center}
.ent{max-width:420px;margin:30px auto}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top">
  <button class="sair hide" id="bSairTopo">Sair</button>
  <div class="lg">BBABILÔNIA</div>
  <h1>Painel do vendedor</h1>
  <p id="ola">Gira a sua loja, produtos, pedidos e mensagens num só lugar.</p>
</div>
<main class="conteudo">
  <!-- entrar / criar conta -->
  <section id="v-entrar" class="cx ent hide">
    <h2>Entrar na conta de vendedor</h2>
    <label class="lb" for="em">Email</label><input class="cp" id="em" type="email" autocomplete="email" placeholder="o.seu@email.com">
    <label class="lb" for="pw">Palavra-passe (mínimo 6)</label><input class="cp" id="pw" type="password" autocomplete="current-password">
    <button class="bt p g" id="bEntrar">Entrar</button>
    <button class="bt g" id="bCriar" style="margin-top:8px">Criar conta de vendedor</button>
    <p class="msg" id="entMsg"></p>
  </section>

  <section id="v-inicio" class="hide"></section>
  <section id="v-produtos" class="hide"></section>
  <section id="v-encomendas" class="hide"></section>
  <section id="v-mensagens" class="hide"></section>
  <section id="v-loja" class="hide"></section>
  <section id="v-marketing" class="hide"></section>
  <section id="v-estatisticas" class="hide"></section>
  <section id="v-conta" class="hide"></section>
  <section id="v-ajuda" class="hide"></section>
</main>

<div class="rodape">© BBabilônia.com · <a href="termos.html">Termos de uso</a> · <a href="privacidade.html">Privacidade</a></div>

<script src="sino-avisos.js"></script>
</body>
