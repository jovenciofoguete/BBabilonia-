<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produto - BBabilônia</title>
<style>
:root{--bg:#fff;--ink:#1d1d1f;--mut:#6e6e73;--line:#e4e4e7;--acc:#111;--red:#c8102e;--soft:#f5f5f7}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--ink:#f2f2f2;--mut:#a0a0a6;--line:#2c2c2e;--acc:#fff;--red:#ff5a6e;--soft:#1e1e20}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
header a{color:var(--ink);text-decoration:none;font-weight:700}
.cart{position:relative;padding:4px 8px}
.cart b{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.wrap{max-width:720px;margin:0 auto}
.gal{position:relative;background:var(--soft)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--soft)}
.slide img,.slide video{width:100%;height:100%;object-fit:contain}
.count{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:12px;padding:3px 10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 56px;height:56px;border:2px solid transparent;border-radius:6px;padding:0;background:var(--soft);overflow:hidden;cursor:pointer}
.thumbs button.on{border-color:var(--acc)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.vid{font-size:20px;color:var(--ink)}
.info{padding:8px 16px 16px}
h1{font-size:20px;line-height:1.3;font-weight:650}
.price{font-size:26px;font-weight:750;color:var(--red);margin:8px 0 4px}
.desc{color:var(--mut);font-size:14px;line-height:1.55;margin-top:8px;white-space:pre-line}
.sec{padding:14px 16px;border-top:1px solid var(--line)}
.lbl{font-size:14px;margin-bottom:10px}
.lbl span{color:var(--mut)}
.cores{display:flex;flex-wrap:wrap;gap:10px}
.cor{border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0;cursor:pointer;overflow:hidden;font-size:13px}
.cor.on{border-color:var(--acc)}
.cor.off{opacity:.45}
.cor img{width:60px;height:60px;object-fit:cover;display:block}
.cor.txt{padding:9px 14px}
.tams{display:flex;flex-wrap:wrap;gap:8px}
.tam{min-width:48px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:10px 14px;font-size:14px;cursor:pointer}
.tam.on{border-color:var(--acc);background:var(--acc);color:var(--bg)}
.tam.off{opacity:.4;text-decoration:line-through}
.stock{font-size:13px;margin-top:10px}
.stock.ok{color:#1a7f37}
.stock.no{color:var(--red)}
.qtd{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:8px;width:max-content}
.qtd button{width:42px;height:42px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
.qtd span{min-width:40px;text-align:center;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:650;cursor:pointer;background:var(--acc);color:var(--bg)}
.btn.sec2{background:none;border:1.5px solid var(--acc);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{padding:40px 16px;text-align:center;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:50}
</style>
</head>
<body>
<header>
  <a href="index.html">&larr; BBabilônia</a>
  <a class="cart" href="carrinho.html">Carrinho <b id="cc" hidden>0</b></a>
</header>
<div class="wrap" id="app"><div class="msg">A carregar…</div></div>
<div class="bar" id="bar" hidden>
  <div class="wrap">
    <button class="btn sec2" id="btnAdd">Adicionar ao carrinho</button>
    <button class="btn" id="btnBuy">Comprar agora</button>
  </div>
</div>

<script>
var SB_URL = "https://dsfoqoeawvjafypycldz.supabase.co";
var SB_KEY = "sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0";

var P = null, slides = [], variants = [], cor = "", tam = "", qtd = 1;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function parse(v){if(typeof v==="string"){v=v.trim();if(!v)return null;try{return JSON.parse(v)}catch(e){return v.split(/[\n,]+/).map(function(x){return x.trim()}).filter(Boolean)}}return v}
function urlOf(x){if(!x)return "";if(typeof x==="string")return x;return x.url||x.src||x.foto||x.image||x.image_url||x.imagem||""}
function colorOf(x){if(!x||typeof x==="string")return "";return x.cor||x.color||x.colour||""}
function norm(s){return String(s||"").trim().toLowerCase()}
function money(n,c){try{return Number(n).toLocaleString("pt-PT",{maximumFractionDigits:2})+" "+(c||"MZN")}catch(e){return n+" "+(c||"")}}

// fotos por cor (devolve {corNormalizada: url})
var colorPhotos = {};
function buildMedia(){
  var imgs = [];
  var raw = parse(P.images);
  if(raw && !Array.isArray(raw) && typeof raw==="object"){
    // formato {Cor: url}
    Object.keys(raw).forEach(function(k){var u=urlOf(raw[k])||(typeof raw[k]==="string"?raw[k]:"");if(u){colorPhotos[norm(k)]=u;imgs.push(u)}});
  } else if(Array.isArray(raw)){
    raw.forEach(function(it){var u=urlOf(it);if(!u)return;imgs.push(u);var c=colorOf(it);if(c)colorPhotos[norm(c)]=u});
  }
  ["color_images","cor_fotos","color_photos","fotos_cores","images_by_color"].forEach(function(k){
    var o=parse(P[k]);if(o&&typeof o==="object"&&!Array.isArray(o)){Object.keys(o).forEach(function(c){var u=urlOf(o[c])||(typeof o[c]==="string"?o[c]:"");if(u){colorPhotos[norm(c)]=u}})}
  });
  variants.forEach(function(v){if(v.foto&&v.cor&&!colorPhotos[norm(v.cor)])colorPhotos[norm(v.cor)]=v.foto});
  if(P.image_url)imgs.push(P.image_url);
  Object.keys(colorPhotos).forEach(function(c){imgs.push(colorPhotos[c])});
  var seen={};slides=[];
  imgs.forEach(function(u){if(u&&!seen[u]){seen[u]=1;slides.push({t:"img",u:u})}});
  if(P.video_url)slides.push({t:"vid",u:P.video_url});
}

function buildVariants(){
  var raw = parse(P.variants);
  variants = [];
  if(!Array.isArray(raw))return;
  raw.forEach(function(v){
    if(typeof v==="string"){variants.push({cor:"",tam:v,stock:null,foto:""});return}
    var st = v.stock!=null?v.stock:(v.quantity!=null?v.quantity:(v.qtd!=null?v.qtd:(v.quantidade!=null?v.quantidade:null)));
    variants.push({
      cor: v.cor||v.color||v.colour||"",
      tam: v.tamanho||v.size||v.tam||"",
      stock: st===null||st===""?null:Number(st),
      foto: urlOf({url:v.foto||v.image||v.image_url||v.img||v.photo||v.imagem||""})
    });
  });
}

function uniq(arr){var s={},o=[];arr.forEach(function(x){if(x&&!s[norm(x)]){s[norm(x)]=1;o.push(x)}});return o}
function match(c,t){return variants.filter(function(v){return (!c||norm(v.cor)===norm(c))&&(!t||norm(v.tam)===norm(t))})}
function stockOf(c,t){
  var m=match(c,t);if(!m.length)return null;
  var tot=0,unk=false;m.forEach(function(v){if(v.stock===null)unk=true;else tot+=v.stock});
  return unk?null:tot; // null = stock não definido (disponível)
}
function isOut(c,t){var s=stockOf(c,t);return s!==null&&s<=0}

function render(){
  var cores = uniq(variants.map(function(v){return v.cor}));
  var tams = uniq(variants.map(function(v){return v.tam}));
  var h = '';
  h += '<div class="gal"><div class="track" id="track">';
  if(!slides.length)h+='<div class="slide"><span style="color:var(--mut)">Sem foto</span></div>';
  slides.forEach(function(s){
    h += '<div class="slide">'+(s.t==="vid"?'<video src="'+esc(s.u)+'" controls playsinline preload="metadata"></video>':'<img src="'+esc(s.u)+'" alt="">')+'</div>';
  });
  h += '</div>'+(slides.length>1?'<div class="count" id="count">1/'+slides.length+'</div>':'')+'</div>';
  if(slides.length>1){
    h += '<div class="thumbs" id="thumbs">';
    slides.forEach(function(s,i){
      h += '<button data-i="'+i+'" class="'+(i===0?'on':'')+'">'+(s.t==="vid"?'<span class="vid">&#9658;</span>':'<img src="'+esc(s.u)+'" alt="">')+'</button>';
    });
    h += '</div>';
  }
  h += '<div class="info"><h1>'+esc(P.name||P.nome||P.title||"Produto")+'</h1>';
  h += '<div class="price">'+money(P.price!=null?P.price:P.preco,P.currency||P.moeda||"MZN")+'</div>';
  var d = P.description||P.descricao; if(d)h+='<div class="desc">'+esc(d)+'</div>';
  h += '</div>';
  if(cores.length){
    h += '<div class="sec"><div class="lbl">Cor: <span id="corNome">'+esc(cor||"escolha uma")+'</span></div><div class="cores">';
    cores.forEach(function(c){
      var u = colorPhotos[norm(c)]||"";
      var off = isOut(c,tam)?' off':'';
      h += '<button class="cor'+(u?'':' txt')+(norm(c)===norm(cor)?' on':'')+off+'" data-c="'+esc(c)+'" title="'+esc(c)+'">'+(u?'<img src="'+esc(u)+'" alt="'+esc(c)+'">':esc(c))+'</button>';
    });
    h += '</div></div>';
  }
  if(tams.length){
    h += '<div class="sec"><div class="lbl">Tamanho: <span>'+esc(tam||"escolha um")+'</span></div><div class="tams">';
    tams.forEach(function(t){
      h += '<button class="tam'+(norm(t)===norm(tam)?' on':'')+(isOut(cor,t)?' off':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>';
    });
    h += '</div></div>';
  }
  h += '<div class="sec"><div class="lbl">Quantidade</div><div class="qtd"><button id="mn">&minus;</button><span id="q">'+qtd+'</span><button id="pl">+</button></div><div class="stock" id="stock"></div></div>';
  document.getElementById("app").innerHTML = h;
  bind(cores,tams);
  upd();
}

function upd(){
  var cores = uniq(variants.map(function(v){return v.cor}));
  var tams = uniq(variants.map(function(v){return v.tam}));
  var need = (cores.length&&!cor)||(tams.length&&!tam);
  var el = document.getElementById("stock");
  var add = document.getElementById("btnAdd"), buy = document.getElementById("btnBuy");
  var s = stockOf(cor,tam), msg="", cls="stock";
  var out = false;
  if(need){msg="Escolha "+((cores.length&&!cor)?"a cor":"")+((cores.length&&!cor&&tams.length&&!tam)?" e ":"")+((tams.length&&!tam)?"o tamanho":"")+".";}
  else if(s===null){msg="Disponível";cls+=" ok"}
  else if(s<=0){msg="Esgotado";cls+=" no";out=true}
  else {msg="Em stock: "+s;cls+=" ok"; if(qtd>s){qtd=s;document.getElementById("q").textContent=qtd}}
  el.className=cls;el.textContent=msg;
  add.disabled=buy.disabled=need||out;
}

function goTo(i){
  var tr=document.getElementById("track");if(!tr)return;
  tr.scrollTo({left:tr.clientWidth*i,behavior:"smooth"});
}
function bind(cores,tams){
  var tr=document.getElementById("track");
  tr.addEventListener("scroll",function(){
    var i=Math.round(tr.scrollLeft/tr.clientWidth);
    var c=document.getElementById("count");if(c)c.textContent=(i+1)+"/"+slides.length;
    document.querySelectorAll("#thumbs button").forEach(function(b,k){b.classList.toggle("on",k===i)});
  });
  document.querySelectorAll("#thumbs button").forEach(function(b){b.onclick=function(){goTo(+b.dataset.i)}});
  document.querySelectorAll(".cor").forEach(function(b){b.onclick=function(){
    cor=b.dataset.c;
    var u=colorPhotos[norm(cor)];
    var i=slides.findIndex(function(s){return s.u===u});
    render(); if(i>=0)setTimeout(function(){goTo(i)},50);
  }});
  document.querySelectorAll(".tam").forEach(function(b){b.onclick=function(){tam=b.dataset.t;render()}});
  document.getElementById("mn").onclick=function(){if(qtd>1){qtd--;document.getElementById("q").textContent=qtd}};
  document.getElementById("pl").onclick=function(){
    var s=stockOf(cor,tam);
    if(s!==null&&qtd>=s)return;
    qtd++;document.getElementById("q").textContent=qtd;
  };
}

function getCart(){try{return JSON.parse(localStorage.getItem("carrinho")||"[]")}catch(e){return []}}
function setCount(){
  var n=getCart().reduce(function(a,i){return a+(+i.qtd||1)},0);
  var c=document.getElementById("cc");c.textContent=n;c.hidden=!n;
}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}
function addCart(){
  var foto = colorPhotos[norm(cor)] || (slides[0]&&slides[0].t==="img"?slides[0].u:"") || P.image_url || "";
  var item = {id:P.id,nome:P.name||P.nome||P.title||"Produto",cor:cor,tamanho:tam,qtd:qtd,preco:Number(P.price!=null?P.price:P.preco),moeda:P.currency||P.moeda||"MZN",foto:foto};
  var cart=getCart();
  var ex=cart.find(function(i){return i.id===item.id&&i.cor===item.cor&&i.tamanho===item.tamanho});
  if(ex)ex.qtd=(+ex.qtd||0)+item.qtd; else cart.push(item);
  try{localStorage.setItem("carrinho",JSON.stringify(cart))}catch(e){}
  setCount();
}

document.getElementById("btnAdd").onclick=function(){addCart();toast("Adicionado ao carrinho")};
document.getElementById("btnBuy").onclick=function(){addCart();location.href="carrinho.html"};

(function init(){
  setCount();
  var id=new URLSearchParams(location.search).get("id");
  var app=document.getElementById("app");
  if(!id){app.innerHTML='<div class="msg">Produto não indicado. <a href="index.html">Voltar à loja</a></div>';return}
  fetch(SB_URL+"/rest/v1/products?id=eq."+encodeURIComponent(id)+"&select=*",{headers:{apikey:SB_KEY}})
  .then(function(r){return r.json()})
  .then(function(rows){
    if(!Array.isArray(rows)||!rows.length){app.innerHTML='<div class="msg">Produto não encontrado. <a href="index.html">Voltar à loja</a></div>';return}
    P=rows[0];
    buildVariants();buildMedia();
    var cores=uniq(variants.map(function(v){return v.cor}));
    var tams=uniq(variants.map(function(v){return v.tam}));
    if(cores.length===1)cor=cores[0];
    if(tams.length===1)tam=tams[0];
    document.title=(P.name||P.nome||"Produto")+" - BBabilônia";
    render();
    document.getElementById("bar").hidden=false;
  })
  .catch(function(){app.innerHTML='<div class="msg">Não foi possível carregar o produto. Verifique a ligação e tente de novo.</div>'});
})();
</script>
</body>
</html>
