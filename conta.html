<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Babilônia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--fundo:#f3f0fb;--papel:#fff;--texto:#1b1740;--suave:#6b6590;--linha:#ebe7f6;--rosa:#0284c7;--laranja:#10b981}
@media (prefers-color-scheme:dark){:root{--fundo:#110e22;--papel:#1d1838;--texto:#f3f0ff;--suave:#a9a2cf;--linha:#2d2752}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);line-height:1.4}
a{color:inherit;text-decoration:none}
.capa{background:linear-gradient(135deg,#10b981 0%,#0ea5e9 55%,#2563eb 100%);color:#fff;padding:26px 18px 64px;border-radius:0 0 30px 30px}
.capa{position:relative}.apoio{position:absolute;top:18px;right:16px;border:0;background:#fff;color:#0284c7;font:inherit;font-size:13.5px;font-weight:800;padding:8px 13px;border-radius:20px;box-shadow:0 4px 12px #0003}
.capa .marca{font-size:12px;letter-spacing:2.5px;font-weight:800;color:#fde68a}
.topo{display:flex;align-items:center;gap:14px;margin-top:12px}
.av{width:60px;height:60px;border-radius:50%;background:#fff;color:#0ea5e9;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;flex:none;box-shadow:0 0 0 4px #ffffff55}
.topo b{display:block;font-size:18px;word-break:break-all}
.topo button{margin-top:6px;border:0;background:#ffffff33;color:#fff;font:inherit;font-size:13px;padding:6px 12px;border-radius:20px}
main{position:relative;z-index:1;max-width:640px;margin:-44px auto 0;padding:0 14px 30px}
.sec{background:var(--papel);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px #0ea5e91f}
.sec h2{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sec h2 a{font-size:13px;font-weight:600;color:var(--rosa)}
.ic{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px}
.ic button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;text-align:center;border:0;background:none;color:inherit;font-family:inherit;position:relative;padding:0}
.ic .e{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 14px #0002}
.g1{background:linear-gradient(135deg,#22d3ee,#0891b2)}.g2{background:linear-gradient(135deg,#34d399,#059669)}
.g3{background:linear-gradient(135deg,#4ade80,#16a34a)}.g4{background:linear-gradient(135deg,#38bdf8,#2563eb)}
.g5{background:linear-gradient(135deg,#a78bfa,#6d28d9)}.g6{background:linear-gradient(135deg,#60a5fa,#1d4ed8)}
.ic i{position:absolute;top:-6px;right:calc(50% - 34px);min-width:20px;height:20px;border-radius:10px;background:#ef4444;color:#fff;font-size:11px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--papel)}
.ic .on{color:var(--rosa)}.ic .on .e{outline:3px solid var(--rosa);outline-offset:2px}
.ped{border-top:1px dashed var(--linha);padding:14px 0}
.ped .l1{display:flex;justify-content:space-between;font-size:13px;color:var(--suave)}
.ped .tot{font-weight:900;font-size:18px;margin:4px 0 6px;background:linear-gradient(90deg,#10b981,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent}
.est{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;background:#fef3c7;color:#92400e;margin-right:4px}
.est.ok{background:#d1fae5;color:#065f46}.est.no{background:#ffe4e6;color:#9f1239}
.it{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13.5px}
.it img{width:48px;height:48px;object-fit:cover;border-radius:10px;background:var(--linha);flex:none}
.vazio{color:var(--suave);text-align:center;padding:18px 6px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{display:block;border:0;width:100%;text-align:left;font-family:inherit;color:#fff;border-radius:18px;padding:16px 14px;min-height:96px;box-shadow:0 6px 16px #0003}
.t:active{transform:scale(.97)}
.t .e2{font-size:26px;display:block;margin-bottom:6px}.t b{font-size:15px}
.t1{background:linear-gradient(135deg,#7c3aed,#4f46e5)}.t2{background:linear-gradient(135deg,#06b6d4,#0e7490)}
.t3{background:linear-gradient(135deg,#22c55e,#15803d)}.t4{background:linear-gradient(135deg,#0ea5e9,#2563eb)}
.t5{background:linear-gradient(135deg,#10b981,#047857)}.t6{background:linear-gradient(135deg,#475569,#0f172a)}
.entrar{position:relative;z-index:1;max-width:460px;margin:-44px auto 0;padding:0 14px}
label{display:block;font-size:14px;color:var(--suave);margin:12px 0 4px;font-weight:600}
input{width:100%;padding:13px;border:2px solid var(--linha);border-radius:12px;font:inherit;background:var(--fundo);color:var(--texto)}
input:focus{outline:none;border-color:var(--rosa)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,#10b981,#0ea5e9);color:#fff;font:inherit;font-weight:800;margin-top:16px;box-shadow:0 6px 16px #0ea5e955}
.btn.s2{background:transparent;border:2px solid var(--rosa);color:var(--rosa);box-shadow:none}
#msg{margin-top:10px;font-size:14px;color:#e11d48}
.hide{display:none}
.env{margin-top:10px;background:#ecfeff;border:1px solid #a5f3fc;border-radius:14px;padding:10px 12px;font-size:14px;color:#0f172a}
.env b{color:#0e7490}.env .fs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.env .fs div{width:88px;text-align:center}.env .fs img{width:88px;height:88px;object-fit:cover;border-radius:12px;display:block}
.env .fs a.bx{display:block;margin-top:4px;font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(90deg,#10b981,#0ea5e9);border-radius:10px;padding:6px 0;text-decoration:none}
.env button{margin-top:8px;border:0;border-radius:10px;padding:8px 12px;font-weight:800;background:#0e7490;color:#fff;font-size:13px}
.env small{display:block;color:#475569;margin-top:6px}
</style>
</head>
<body>
<div class="capa"><div class="marca">BBABILÔNIA</div><button class="apoio" id="apoio">🎧 Atendimento</button>
 <div class="topo" id="topoConta"><div class="av" id="av">B</div>
  <div><b id="nome">Meu Babilônia</b><button id="pref" class="hide">📍 Estou em: <span id="ondeEstou">—</span> · <span id="lm"></span></button></div></div>
</div>
<div id="login" class="hide entrar">
 <div class="sec">
  <h2>Entrar no Meu Babilônia</h2>
  <label>Email</label><input id="em" type="email" autocomplete="email">
  <label>Palavra-passe (mínimo 6)</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="ent">Entrar</button>
  <button class="btn s2" id="cri">Criar conta nova</button>
  <div id="msg"></div>
 </div>
</div>
<main id="painel" class="hide">
 <div class="sec">
  <h2>Os meus pedidos <a href="#" data-f="todos">Ver tudo ›</a></h2>
  <div class="ic" id="filtros">
   <button data-f="naopago"><span class="e g1">💳</span>Não pagos</button>
   <button data-f="pago"><span class="e g2">✅</span>Pagos</button>
   <button data-f="pendente"><span class="e g3">📦</span>Pendentes de envio</button>
   <button data-f="enviado"><span class="e g4">🚚</span>Enviados</button>
   <button data-f="recebido"><span class="e g5">🏠</span>Recebidos</button>
   <button data-f="avaliar"><span class="e g6">⭐</span>Para avaliar</button>
  </div>
  <div id="lista"></div>
 </div>
 <div class="grid">
  <a class="t t1" href="moradas-v3.html"><span class="e2">📍</span><b>Endereços de entrega</b></a>
  <a class="t t2" href="chat-novo2.html"><span class="e2">💬</span><b>Mensagens</b></a>
  <a class="t t3" href="carrinho.html"><span class="e2">🛒</span><b>Carrinho</b></a>
  <button class="t t4" id="pref2"><span class="e2">🌐</span><b>País, idioma e moeda</b></button>
  <button class="t t6" id="sair" style="grid-column:1/-1"><span class="e2">🚪</span><b>Terminar sessão</b></button>
 </div>
</main>
<script src="menu-babilonia.js"></script>
<script>
var sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0');
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function arr(x){if(typeof x==='string'){try{x=JSON.parse(x)}catch(e){x=[]}}return Array.isArray(x)?x:[]}
var pedidos=[],filtro='';
function k(x){return String(x||'').toLowerCase()}
function pago(p){return/pago|paid|succeeded|confirmado|retido|liberado/.test(k(p.payment_status))||/pago|paid/.test(k(p.status))}
function cancelado(p){return/cancel/.test(k(p.status))}
function enviado(p){return/enviad|shipped|transito/.test(k(p.status))}
function recebido(p){return/entregue|recebid|delivered|conclu/.test(k(p.status))||/liberado/.test(k(p.escrow_status))}
var REGRA={
 todos:function(){return true},
 naopago:function(p){return!pago(p)&&!cancelado(p)},
 pago:function(p){return pago(p)},
 pendente:function(p){return pago(p)&&!enviado(p)&&!recebido(p)&&!cancelado(p)},
 enviado:function(p){return enviado(p)&&!recebido(p)},
 recebido:function(p){return recebido(p)},
 avaliar:function(p){return recebido(p)&&!p.avaliado}
};
var ROT={todos:'Todos',naopago:'Não pagos',pago:'Pagos',pendente:'Pendentes de envio',enviado:'Enviados',recebido:'Recebidos',avaliar:'Para avaliar'};
function etiqueta(p){
 if(cancelado(p))return'<span class="est no">Cancelado</span>';
 if(recebido(p))return'<span class="est ok">Recebido</span>';
 if(enviado(p))return'<span class="est">Enviado</span>';
 if(pago(p))return'<span class="est ok">Pago</span><span class="est">A aguardar envio</span>';
 return'<span class="est no">Não pago</span>';
}
function fotosEnvio(p){var f=p.foto_pacote;if(!f)return[];if(typeof f==='string'&&f.charAt(0)!=='[')return[f];return arr(f)}
function envioHtml(p){
 if(!p.rastreio&&!p.foto_pacote)return'';
 var fs=fotosEnvio(p);
 return'<div class="env">🚚 Enviado por <b>'+esc(p.transportadora||'—')+'</b><br>Nº de rastreamento: <b>'+esc(p.rastreio||'—')+'</b>'+
  (p.rastreio?'<br><button data-copiar="'+esc(p.rastreio)+'">Copiar número</button>':'')+
  (fs.length?'<div class="fs">'+fs.map(function(u,n){return'<div><a href="'+esc(u)+'" target="_blank"><img src="'+esc(u)+'" alt="Foto do pacote"></a><a class="bx" href="'+esc(u)+(u.indexOf('?')<0?'?':'&')+'download=pacote-'+esc(String(p.id).slice(0,8))+'-'+(n+1)+'.jpg">⬇ Baixar</a></div>'}).join('')+'</div><small>Baixe as fotos do pacote para partilhar com a sua logística.</small>':'')+
 '</div>';
}
function desenhar(){
 document.querySelectorAll('#filtros button').forEach(function(b){
  var f=b.getAttribute('data-f'),n=pedidos.filter(REGRA[f]).length;
  b.classList.toggle('on',f===filtro);
  var i=b.querySelector('i');if(i)i.remove();
  if(n)b.insertAdjacentHTML('beforeend','<i>'+n+'</i>');
 });
 if(!filtro){$('lista').innerHTML='';return}
 var l=pedidos.filter(REGRA[filtro]);
 if(!l.length){$('lista').innerHTML='<div class="vazio">'+(filtro==='todos'?'Ainda não tem pedidos.':'Nenhum pedido em "'+ROT[filtro]+'".')+'</div>';return}
 $('lista').innerHTML=l.map(function(p){
  var d=p.created_at?new Date(p.created_at).toLocaleDateString():'';
  var its=arr(p.items).map(function(i){
   return'<div class="it">'+(i.foto?'<img src="'+esc(i.foto)+'" alt="">':'')+'<div>'+esc(i.nome||'Produto')+'<br><small>'+
   esc([i.cor,i.tamanho].filter(Boolean).join(' · '))+' × '+esc(i.qtd||1)+'</small></div></div>'}).join('');
  return'<div class="ped"><div class="l1"><span>Pedido '+esc(String(p.id).slice(0,8))+'</span><span>'+d+'</span></div>'+
   '<div class="tot">'+Number(p.total||0).toLocaleString()+' '+esc(p.currency||'')+'</div>'+etiqueta(p)+its+envioHtml(p)+'</div>';
 }).join('');
 document.querySelectorAll('[data-copiar]').forEach(function(b){b.onclick=function(){var t=b.getAttribute('data-copiar');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='Copiado ✓'}).catch(function(){prompt('Copie o número:',t)})}});
}
document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(e){e.preventDefault();var f=b.getAttribute('data-f');filtro=(filtro===f?'':f);desenhar()}});
function mostrarPref(){
 if(!window.BBPrefs)return;
 var p=BBPrefs.ler(),pais=p.pais,nomePais=pais;
 try{nomePais=new Intl.DisplayNames([p.idioma,'pt'],{type:'region'}).of(pais)}catch(e){}
 $('ondeEstou').textContent=nomePais||'escolher';$('lm').textContent=p.idioma+' · '+p.moeda;
}
$('pref').onclick=$('pref2').onclick=function(){if(window.BBPrefs)BBPrefs.abrir()};
window.addEventListener('bb-prefs',mostrarPref);
async function abrir(){
 var s=(await sb.auth.getSession()).data.session;
 $('login').classList.toggle('hide',!!s);$('painel').classList.toggle('hide',!s);
 if(!s){$('nome').textContent='Meu Babilônia';$('av').textContent='B';$('pref').classList.add('hide');return}
 var em=String(s.user.email||'');
 $('pref').classList.remove('hide');$('nome').textContent=em;$('av').textContent=(em[0]||'B').toUpperCase();mostrarPref();
 $('lista').innerHTML='<div class="vazio">A carregar…</div>';
 var r=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
 pedidos=(r.data||[]).filter(function(p){return String(p.customer_id||'')===s.user.id||k(p.customer_email)===em.toLowerCase()});
 desenhar();
}
$('ent').onclick=async function(){
 var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){$('msg').textContent='Email ou palavra-passe errados.';return}abrir();
};
$('cri').onclick=async function(){
 var r=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){$('msg').textContent=r.error.message;return}
 $('msg').textContent='Conta criada. Se pedir confirmação, abra o email; depois toque em Entrar.';abrir();
};
$('apoio').onclick=async function(){
 var b=this;b.disabled=true;
 var r=await sb.rpc('id_atendimento');
 b.disabled=false;
 if(r.error||!r.data){alert('O atendimento ainda não está disponível. Tente mais tarde.');return}
 location.href='chat-novo2.html?vendedor='+encodeURIComponent(r.data)+'&assunto='+encodeURIComponent('Atendimento ao cliente');
};
$('sair').onclick=async function(){await sb.auth.signOut();abrir()};
abrir();
</script>
</body>
                                                                                                                                                      </html>
