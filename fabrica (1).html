<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B-Babilônia</title>
<style>
html,body{margin:0;height:100%;background:#fff}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style></head><body>
<iframe id="f" title="B-Babilônia"></iframe>
<script>
/* fabrica.html — B-Babilônia
   Abre as páginas do fornecedor/fábrica no idioma do telemóvel e pede para escolher o idioma na 1.ª visita.
   ?p=criar    -> loja-criar.html
   ?p=importar -> importar-loja-v7.html
   Não altera esses ficheiros: carrega-os aqui dentro e junta a tradução (fornecedor-idioma.js).
   Quem já tem loja: aprovada -> vai direto ao painel; outro estado -> botões para o painel. */
(function () {
  var PAINEL = '/painel-vendedor-v2.html';
  var PAG = { criar: 'loja-criar.html', importar: 'importar-loja-v7.html' };
  var p = new URLSearchParams(location.search).get('p');
  var f = document.getElementById('f');
  f.src = PAG[p] || PAG.criar;

  function botoes(d, aprovada) {
    if (d.getElementById('bb-seguir')) return;
    var est = d.getElementById('estado'); if (!est) return;
    var w = d.createElement('div'); w.id = 'bb-seguir';
    var css = 'display:block;text-align:center;text-decoration:none;font-weight:700;font-size:16px;padding:14px;border-radius:10px;margin-top:12px;';
    var a1 = d.createElement('a'); a1.href = PAINEL; a1.target = '_top';
    a1.textContent = 'Ir para o painel do vendedor';
    a1.style.cssText = css + 'background:#ff4d6a;color:#fff';
    w.appendChild(a1);
    if (aprovada) {
      var a2 = d.createElement('a'); a2.href = 'fabrica.html?p=importar'; a2.target = '_top';
      a2.textContent = 'Importar produtos';
      a2.style.cssText = css + 'border:1px solid #2c2c30;color:#f3f3f3';
      w.appendChild(a2);
    }
    est.appendChild(w);
  }

  f.addEventListener('load', function () {
    var d; try { d = f.contentDocument; } catch (e) { return; }
    if (!d || !d.body) return;
    try { document.title = d.title || document.title; } catch (e) {}
    // nomes de produtos e ficheiros não são traduzidos
    ['lista', 'nf', 'en', 'nome', 'desc', 'outro'].forEach(function (id) { var el = d.getElementById(id); if (el) el.setAttribute('translate', 'no'); });
    // links abrem na janela inteira (não dentro desta página)
    d.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href]') : null;
      if (a && !a.target && !/^(mailto|tel|javascript):|^#/i.test(a.getAttribute('href'))) a.target = '_top';
    }, true);
    // tradução no idioma escolhido (se a página ainda não a tiver)
    if (!d.querySelector('script[src*="fornecedor-idioma.js"]')) {
      var s = d.createElement('script'); s.src = 'fornecedor-idioma.js?v=1'; d.head.appendChild(s);
    }
    // quem já tem loja não fica parado na página "Criar a minha loja"
    var vezes = 0;
    var t = setInterval(function () {
      vezes++;
      var est = d.getElementById('estado'), ee = d.getElementById('ee');
      if (est && !est.classList.contains('hide') && ee && ee.textContent) {
        clearInterval(t);
        var aprovada = /aprovada|✓/i.test(ee.textContent);
        botoes(d, aprovada);
        if (aprovada && (p || 'criar') === 'criar') location.replace(PAINEL);
      } else if (vezes > 60) clearInterval(t);
    }, 250);
  });
})();
</script>
<script src="idioma-primeiro.js?v=1"></script>
</body></html>
