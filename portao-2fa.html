<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBabilônia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eef2f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#cx{position:fixed;inset:0;z-index:9;background:#eef2f7;overflow:auto;padding:24px 16px 40px}
.bx{max-width:420px;margin:0 auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px #0f172a1f;text-align:center}
.lg{font-size:12px;letter-spacing:2px;font-weight:800;color:#16a34a}
.ic{font-size:64px;margin:10px 0 4px}
h2{font-size:21px;margin:6px 0}p{font-size:15px;color:#475569;line-height:1.5;margin:8px 0}
.bt{display:block;width:100%;margin-top:12px;padding:16px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(90deg,#16a34a,#2563eb);cursor:pointer}
.bt.l{background:#fff;color:#2563eb;border:2px solid #e2e8f0;font-size:15px;padding:13px}.bt:disabled{opacity:.55}
.er{color:#dc2626;font-size:14.5px;margin-top:10px;min-height:1em}.ok{color:#16a34a}
.pq{font-size:13px;color:#64748b;margin-top:14px}
.pin{display:block;width:100%;margin-top:10px;padding:14px;border:2px solid #e2e8f0;border-radius:14px;font-size:28px;letter-spacing:12px;text-align:center;font-family:monospace;color:#0f172a;background:#f8fafc}
.pin:focus{outline:none;border-color:#2563eb}
.lb{font-size:13.5px;color:#475569;margin-top:12px;text-align:left}
.hide{display:none!important}
#pinBtn{position:fixed;left:10px;bottom:10px;z-index:8;width:auto;margin:0;padding:9px 12px;border:0;border-radius:22px;font:inherit;font-size:13px;font-weight:700;color:#fff;background:#0f172acc;box-shadow:0 4px 12px #0f172a40}
</style></head><body>
<iframe id="f" title="BBabilônia"></iframe>
<button id="pinBtn" class="hide" type="button">🔢 Meu PIN</button>
<div id="cx" class="hide"><div class="bx" id="bx"></div></div>
<script>
(function(){
var URL_SB='https://dsfoqoeawvjafypycldz.supabase.co';
var PROT=/^\/(painel-vendedor|painel-vendedor-v2|fornecedor-v3|fornecedor-novo|fornecedor|registar-produto|detalhes-fornecedor|loja-criar|loja-editar|fornecedor-envios|fornecedor-saldo|conta-bancaria|fornecedor-disputas|painel-admin|admin-bbabilonia|admin-lojas|admin-disputas|admin-fotos|gerar-formas|admin-agentes|admin-pins|admin-pedidos|confirmar-produto|atd-verificacoes|atendimento|agentes|respostas|conversas)\.html$/;
var AGENTE=/^\/(atendimento|agentes|respostas|conversas)\.html$/;
/* 13/11/2026 — nos domínios da equipa (agentes, fornecedores e dono) TODAS as páginas pedem a impressão digital e o PIN; só o cliente (bbabilonia.com) entra sem 2FA */
var EQUIPA=/^(service|atendimento|suppliers|supplies|fornecedor|admin|administrator)\./i.test(location.hostname);
var NOATD=/^(service|atendimento)\./i.test(location.hostname);
var LIVRE=/^\/(portao-2fa|ir-lado|gongyingshang|fabrica)\.html$/;
function protegido(p){return EQUIPA?!LIVRE.test(p):PROT.test(p)}
var RAIZ={'fornecedor.bbabilonia.com':'/painel-vendedor-v2.html','suppliers.bbabilonia.com':'/painel-vendedor-v2.html','supplies.bbabilonia.com':'/painel-vendedor-v2.html',
 'admin.bbabilonia.com':'/painel-admin.html','administrator.bbabilonia.com':'/painel-admin.html','atendimento.bbabilonia.com':'/atendimento.html','service.bbabilonia.com':'/atendimento.html'};
var OKK='bb-2fa-ok-v2'; /* v2: com PIN BBabilônia (as confirmações antigas, sem PIN, já não contam) */
var f=document.getElementById('f'),cx=document.getElementById('cx'),bx=document.getElementById('bx');
var aberto=false,aVer='',faltaAntes=false;

function caminho(){var p='';try{p=f.contentWindow.location.pathname}catch(e){}if(!p||p==='blank')p=location.pathname;if(p==='/')p=RAIZ[location.hostname]||'/';return p}
function modo(){return(NOATD||AGENTE.test(caminho()))?'atd':'loja'}
function ler(m){try{var st=m==='atd'?sessionStorage:localStorage,k=m==='atd'?'bb-atd':'sb-dsfoqoeawvjafypycldz-auth-token';
  var v=JSON.parse(st.getItem(k)||'null');if(v&&v.currentSession)v=v.currentSession;return v&&v.access_token?v:null}catch(e){return null}}
function guardado(){var m=modo();return ler(m)||(EQUIPA?ler(m==='atd'?'loja':'atd'):null)}
function dados(tok){try{var b=tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(atob(b))}catch(e){return{}}}
function oks(){try{return JSON.parse(localStorage.getItem(OKK)||'[]')}catch(e){return[]}}
function marcarOk(sid){try{var l=oks().filter(function(x){return x!==sid});l.unshift(sid);localStorage.setItem(OKK,JSON.stringify(l.slice(0,20)))}catch(e){}}
function sessao(){var s=guardado();if(!s)return null;var d=dados(s.access_token);return{tok:s.access_token,sid:d.session_id||'',exp:d.exp||0}}
function falta(){if(!protegido(caminho()))return false;var s=sessao();if(!s||!s.sid)return false;return oks().indexOf(s.sid)<0}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* base64url <-> bytes */
function b2u(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function u2b(t){t=String(t).replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var s=atob(t),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b.buffer}

async function chamar(url,acao,extra){
 var s=sessao();if(!s)throw new Error('Entre primeiro na conta.');
 var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.tok},body:JSON.stringify(Object.assign({acao:acao},extra||{}))});
 var j={};try{j=await r.json()}catch(e){}
 if(!r.ok){var er=new Error(j.erro||('Erro '+r.status));er.dados=j;throw er}
 return j;
}
function api(acao,extra){return chamar('/api/passkey',acao,extra)}
function pinApi(acao,extra){return chamar('/api/pin-2fa',acao,extra)}
function aparelho(){var u=navigator.userAgent||'';return(/Android/i.test(u)?'Android':/iPhone|iPad/i.test(u)?'iPhone/iPad':/Windows/i.test(u)?'Windows':/Mac/i.test(u)?'Mac':/Linux/i.test(u)?'Linux':'Aparelho')}
function erroWebauthn(e){
 var n=e&&e.name;
 if(n==='NotAllowedError')return'Cancelado, ou o tempo acabou. Toque no botão de novo.';
 if(n==='InvalidStateError')return'Este aparelho já tem a chave. Toque em "Confirmar".';
 if(n==='NotSupportedError'||n==='SecurityError')return'Este navegador não aceita chaves de acesso. Use o Chrome, Edge ou Safari atualizado.';
 return(e&&e.message)||String(e);
}

var PAINEIS=/^\/(painel-vendedor|painel-vendedor-v2|painel-admin|atendimento)\.html$/;
var pinBtn=document.getElementById('pinBtn'),gerir=false;
function vigiar(){
 var x=falta();
 pinBtn.classList.toggle('hide',aberto||x||!sessao()||!PAINEIS.test(caminho()));
 if(x&&!aberto)abrir();
 if(!x&&aberto&&!gerir)fechar(faltaAntes);
 faltaAntes=x;
}
function fechar(recarregar){aberto=false;gerir=false;cx.classList.add('hide');f.style.visibility='visible';if(recarregar)try{f.contentWindow.location.reload()}catch(e){f.src=f.src}}
function ecra(ic,tit,txt,botoes){
 bx.innerHTML='<div class="lg">BBABILÔNIA · SEGURANÇA</div><div class="ic">'+ic+'</div><h2>'+tit+'</h2><p>'+txt+'</p>'+botoes+'<div class="er" id="er"></div>'+
  '<button class="bt l" id="sa">Sair da conta</button><p class="pq">Perdeu o aparelho ou esqueceu o PIN? Fale com a BBabilônia.</p>';
 document.getElementById('sa').onclick=sair;
}
function msg(t,bom){var e=document.getElementById('er');if(e){e.className='er'+(bom?' ok':'');e.textContent=t}}
function concluido(){marcarOk(aVer);faltaAntes=false;setTimeout(function(){fechar(true)},500)}

async function abrir(){
 aberto=true;f.style.visibility='hidden';cx.classList.remove('hide');
 var s=sessao();aVer=s&&s.sid;
 ecra('🔐','Verificação em 2 passos','A carregar…','');
 if(window.__bbTr){try{await window.__bbTr}catch(e){}window.__bbTr=null}
 if(!window.PublicKeyCredential){ecra('⚠️','Navegador sem suporte','Este navegador não aceita chaves de acesso. Abra o painel no Chrome, Edge ou Safari atualizado.','');return}
 try{
  var p=await pinApi('estado');
  if(p.verificado){marcarOk(aVer);faltaAntes=false;fechar(true);return}
  if(p.chave_ok){ecraPin(p);return}          // impressão digital já confirmada há pouco: falta o PIN
  var e=await api('estado');
  if(!e.tem)ecraAtivar();else ecraConfirmar();
 }catch(err){ecra('⚠️','Verificação em 2 passos','Não foi possível verificar.','<button class="bt" id="tn">Tentar de novo</button>');msg(err.message);document.getElementById('tn').onclick=abrir}
}
function ecraAtivar(){
 ecra('👆','Ativar a chave de acesso','Proteja a sua conta com a <b>impressão digital</b>, o <b>rosto</b> ou o <b>PIN</b> deste aparelho (telemóvel ou computador). Faz-se só uma vez.',
  '<button class="bt" id="go">👆 Ativar agora</button>');
 document.getElementById('go').onclick=ativar;
}
function ecraConfirmar(){
 ecra('👆','Confirme que é você','Passo 1 de 2: use a <b>impressão digital</b>, o <b>rosto</b> ou o <b>PIN</b> deste aparelho.',
  '<button class="bt" id="go">👆 Confirmar</button>');
 document.getElementById('go').onclick=confirmar;
}
async function depoisDaChave(){
 try{var p=await pinApi('estado');if(p.verificado){concluido();return}ecraPin(p)}
 catch(e){msg(e.message)}
}
async function ativar(){
 var b=document.getElementById('go');b.disabled=true;msg('');
 try{
  var o=(await api('registo-inicio')).publicKey;
  o.challenge=u2b(o.challenge);o.user.id=u2b(o.user.id);
  o.excludeCredentials=(o.excludeCredentials||[]).map(function(c){return{type:c.type,id:u2b(c.id)}});
  var c=await navigator.credentials.create({publicKey:o});
  await api('registo-fim',{id:c.id,clientDataJSON:b2u(c.response.clientDataJSON),attestationObject:b2u(c.response.attestationObject),aparelho:aparelho()});
  msg('✓ Chave ativada',true);setTimeout(depoisDaChave,500);
 }catch(e){b.disabled=false;msg(erroWebauthn(e))}
}
async function confirmar(){
 var b=document.getElementById('go');b.disabled=true;msg('');
 try{
  var o=(await api('login-inicio')).publicKey;
  o.challenge=u2b(o.challenge);o.allowCredentials=(o.allowCredentials||[]).map(function(c){return{type:c.type,id:u2b(c.id)}});
  var c=await navigator.credentials.get({publicKey:o});
  await api('login-fim',{id:c.id,clientDataJSON:b2u(c.response.clientDataJSON),authenticatorData:b2u(c.response.authenticatorData),signature:b2u(c.response.signature)});
  if(c.authenticatorAttachment==='cross-platform'){
   ecra('✅','Confirmado','Usou outro aparelho. Quer ativar também a chave <b>neste</b> aparelho, para a próxima vez ser mais rápido?',
    '<button class="bt" id="go">👆 Ativar neste aparelho</button><button class="bt l" id="nao">Agora não</button>');
   document.getElementById('go').onclick=ativar;document.getElementById('nao').onclick=depoisDaChave;
   return;
  }
  msg('✓ Confirmado',true);setTimeout(depoisDaChave,400);
 }catch(e){b.disabled=false;
  var t=erroWebauthn(e);
  if(e&&e.name==='NotAllowedError')t+=' Se este é um aparelho novo, na janela que abre escolha "Usar outro aparelho" / "Telemóvel" e confirme com o aparelho onde ativou.';
  msg(t)}
}

/* ---- passo 2: PIN BBabilônia (6 números, não é o PIN do telemóvel) ---- */
var CAMPO='<input class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" autocorrect="off" spellcheck="false"';
function soNumeros(el){el.addEventListener('input',function(){el.value=el.value.replace(/\D/g,'').slice(0,6)})}
function ecraPin(p){
 if(p.bloqueado==='sempre'){ecra('⛔','Conta bloqueada','O PIN BBabilônia foi errado muitas vezes. Por segurança a conta ficou bloqueada. Fale com a BBabilônia para desbloquear.','');return}
 if(!p.tem_pin){
  ecra('🔢','Crie o seu PIN BBabilônia','Passo 2 de 2: escolha <b>6 números</b> só seus. <b>Não use o PIN do telemóvel.</b> Vai ser pedido sempre que entrar no painel.',
   '<div class="lb">Novo PIN</div>'+CAMPO+' id="p1"><div class="lb">Repita o PIN</div>'+CAMPO+' id="p2"><button class="bt" id="go">Guardar PIN</button>');
  var a=document.getElementById('p1'),b2=document.getElementById('p2');soNumeros(a);soNumeros(b2);a.focus();
  a.addEventListener('input',function(){if(a.value.length===6)b2.focus()});
  document.getElementById('go').onclick=async function(){
   var b=this;msg('');
   if(!/^\d{6}$/.test(a.value))return msg('O PIN tem de ter 6 números.');
   if(a.value!==b2.value)return msg('Os dois PINs não são iguais.');
   b.disabled=true;
   try{await pinApi('criar',{pin:a.value});msg('✓ PIN guardado',true);concluido()}
   catch(e){b.disabled=false;if(e.dados&&e.dados.voltar_chave)return ecraConfirmar();msg(e.message)}
  };
  return;
 }
 ecra('🔢','PIN BBabilônia','Passo 2 de 2: escreva o seu <b>PIN BBabilônia</b> (6 números). <b>Não é o PIN do telemóvel.</b>'+(p.bloqueado?'<br><b style="color:#dc2626">Bloqueado por '+esc(p.bloqueado)+' min.</b>':''),
  CAMPO+' id="p1"><button class="bt" id="go">Entrar</button>');
 var c=document.getElementById('p1');soNumeros(c);c.focus();
 async function enviar(){
  var b=document.getElementById('go');msg('');
  if(!/^\d{6}$/.test(c.value))return msg('O PIN tem de ter 6 números.');
  b.disabled=true;
  try{await pinApi('confirmar',{pin:c.value});msg('✓ Confirmado',true);concluido()}
  catch(e){b.disabled=false;c.value='';c.focus();var d=e.dados||{};
   if(d.voltar_chave)return ecraConfirmar();
   if(d.criar)return ecraPin({tem_pin:false});
   if(d.bloqueado==='sempre')return ecraPin({tem_pin:true,bloqueado:'sempre'});
   msg(e.message)}
 }
 document.getElementById('go').onclick=enviar;
 c.addEventListener('input',function(){if(c.value.length===6)enviar()});
}

/* ---- dentro do painel: trocar ou eliminar o PIN BBabilônia ---- */
pinBtn.onclick=function(){aberto=true;gerir=true;f.style.visibility='hidden';cx.classList.remove('hide');pinBtn.classList.add('hide');ecraGerir()};
function voltarPainel(){aberto=false;gerir=false;cx.classList.add('hide');f.style.visibility='visible';vigiar()}
function ecraGerir(){
 ecra('🔢','O meu PIN BBabilônia','Troque o PIN ou elimine-o. Para isso escreva o PIN atual.',
  '<button class="bt" id="tr">🔁 Trocar PIN</button><button class="bt" id="el" style="background:#dc2626">🗑️ Eliminar PIN</button><button class="bt l" id="vt">← Voltar ao painel</button>');
 document.getElementById('tr').onclick=ecraTrocar;document.getElementById('el').onclick=ecraEliminar;document.getElementById('vt').onclick=voltarPainel;
}
function erroGerir(e){var d=e.dados||{};if(d.bloqueado==='sempre'){marcarSair();return ecraPin({tem_pin:true,bloqueado:'sempre'})}msg(e.message)}
function marcarSair(){try{localStorage.setItem(OKK,JSON.stringify(oks().filter(function(x){return x!==aVer})))}catch(e){}}
function ecraTrocar(){
 ecra('🔁','Trocar PIN','Escreva o PIN atual e depois o PIN novo (6 números, <b>não use o PIN do telemóvel</b>).',
  '<div class="lb">PIN atual</div>'+CAMPO+' id="pa"><div class="lb">PIN novo</div>'+CAMPO+' id="p1"><div class="lb">Repita o PIN novo</div>'+CAMPO+' id="p2"><button class="bt" id="go">Guardar PIN novo</button><button class="bt l" id="vt">← Voltar</button>');
 var pa=document.getElementById('pa'),a=document.getElementById('p1'),c=document.getElementById('p2');[pa,a,c].forEach(soNumeros);pa.focus();
 document.getElementById('vt').onclick=ecraGerir;
 document.getElementById('go').onclick=async function(){
  var b=this;msg('');
  if(!/^\d{6}$/.test(pa.value))return msg('Escreva o PIN atual (6 números).');
  if(!/^\d{6}$/.test(a.value))return msg('O PIN novo tem de ter 6 números.');
  if(a.value!==c.value)return msg('Os dois PINs novos não são iguais.');
  b.disabled=true;
  try{await pinApi('trocar',{atual:pa.value,novo:a.value});ecra('✅','PIN trocado','A partir de agora use o PIN novo.','<button class="bt" id="vt">← Voltar ao painel</button>');document.getElementById('vt').onclick=voltarPainel}
  catch(e){b.disabled=false;pa.value='';erroGerir(e)}
 };
}
function ecraEliminar(){
 ecra('🗑️','Eliminar PIN','O PIN é apagado e esta entrada fecha. Na próxima entrada confirma a impressão digital e <b>cria um PIN novo</b>. Escreva o PIN atual para confirmar.',
  '<div class="lb">PIN atual</div>'+CAMPO+' id="pa"><button class="bt" id="go" style="background:#dc2626">Eliminar o meu PIN</button><button class="bt l" id="vt">← Voltar</button>');
 var pa=document.getElementById('pa');soNumeros(pa);pa.focus();
 document.getElementById('vt').onclick=ecraGerir;
 document.getElementById('go').onclick=async function(){
  var b=this;msg('');
  if(!/^\d{6}$/.test(pa.value))return msg('Escreva o PIN atual (6 números).');
  b.disabled=true;
  try{await pinApi('eliminar',{atual:pa.value});marcarSair();gerir=false;aberto=false;abrir()}  /* pede logo impressão digital + PIN novo */
  catch(e){b.disabled=false;pa.value='';erroGerir(e)}
 };
}

async function sair(){
 try{var m=modo();var c=supabase.createClient(URL_SB,'sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0',{auth:m==='atd'?{storage:sessionStorage,storageKey:'bb-atd',autoRefreshToken:false}:{autoRefreshToken:false}});await c.auth.signOut()}catch(e){}
 try{if(modo()==='atd')sessionStorage.removeItem('bb-atd');else localStorage.removeItem('sb-dsfoqoeawvjafypycldz-auth-token')}catch(e){}
 aberto=false;faltaAntes=false;cx.classList.add('hide');f.style.visibility='visible';try{f.contentWindow.location.reload()}catch(e){f.src=f.src}}

f.addEventListener('load',function(){
 try{var w=f.contentWindow,u=w.location.pathname+w.location.search+w.location.hash;
  if(w.location.pathname!==location.pathname||w.location.search!==location.search)history.replaceState(null,'',u);
  if(w.document.title)document.title=w.document.title}catch(e){}
 vigiar();
});
/* 13/11/2026 — painel do DONO (administrator.bbabilonia.com): fecha-se sozinho ao sair dele.
   Voltar para outro site, fechar o separador, recarregar ou 15 minutos sem mexer: volta a pedir a impressão digital e o PIN
   (no aparelho e no servidor). Assim, ninguém vê o painel do dono só por tocar em "voltar" noutro domínio. */
if(/^(admin|administrator)\./i.test(location.hostname)){
 var TRK='bb-adm-trancar',LIM_ADM=15*60*1000,ultimo=Date.now();
 var tirarOk=function(sid){try{localStorage.setItem(OKK,JSON.stringify(oks().filter(function(x){return x!==sid})))}catch(e){}};
 var trancarServ=function(s,manter){return fetch('/api/pin-2fa',{method:'POST',keepalive:!!manter,headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.tok},body:'{"acao":"trancar"}'})
  .then(function(r){if(r.ok)try{if(localStorage.getItem(TRK)===s.sid)localStorage.removeItem(TRK)}catch(e){}})};
 var trancar=function(manter){var s=sessao();if(!s||!s.sid)return null;tirarOk(s.sid);try{localStorage.setItem(TRK,s.sid)}catch(e){}return trancarServ(s,manter).catch(function(){})};
 /* trancagem que ficou por confirmar no servidor (ex.: telemóvel sem rede ao sair): faz antes de abrir o painel */
 var pendente=function(){var s=sessao(),t='';try{t=localStorage.getItem(TRK)||''}catch(e){}if(s&&t&&t===s.sid){tirarOk(s.sid);window.__bbTr=trancarServ(s,false).catch(function(){})}};
 pendente();
 window.addEventListener('pagehide',function(){trancar(true)});
 window.addEventListener('pageshow',function(e){if(e.persisted){pendente();ultimo=Date.now();vigiar()}});
 var mexeu=function(){ultimo=Date.now()};
 var ouvir=function(d){['click','keydown','touchstart','scroll','input','mousemove'].forEach(function(n){try{d.addEventListener(n,mexeu,{passive:true,capture:true})}catch(e){}})};
 ouvir(document);
 f.addEventListener('load',function(){try{ouvir(f.contentWindow.document)}catch(e){}});
 setInterval(function(){
  if(aberto){ultimo=Date.now();return}
  if(Date.now()-ultimo>LIM_ADM&&sessao()&&!falta()){window.__bbTr=trancar(false);vigiar()}
 },5000);
}
if(falta()){faltaAntes=true;abrir()}
f.src=location.pathname+location.search+location.hash;

setInterval(function(){var s=sessao();if(aberto&&s&&s.sid!==aVer){aberto=false}vigiar()},1000);
})();
</script>
</body></html>
