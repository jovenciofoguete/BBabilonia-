<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisos do vendedor · B-Babilônia</title>
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--fundo:#f1effb;--papel:#fff;--texto:#1b1740;--suave:#6b7280;--linha:#ece9f7;--roxo:#7c3aed;--roxo2:#5b21b6}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto);line-height:1.4;padding-bottom:40px}
.capa{background:linear-gradient(135deg,#1e1b4b 0%,#5b21b6 55%,#9333ea 100%);color:#fff;padding:22px 16px 58px;border-radius:0 0 28px 28px}
.capa .lg{font-size:13px;letter-spacing:2px;color:#fcd34d;font-weight:bold}
.voltar{display:inline-block;background:#ffffff26;color:#fff;text-decoration:none;font-size:14px;font-weight:700;border-radius:999px;padding:7px 14px;margin-top:12px}
.capa h1{font-size:25px;margin-top:12px}.capa p{font-size:14px;color:#e9d5ff;margin-top:4px}
main{max-width:640px;margin:-40px auto 0;padding:0 14px}
.sec{background:var(--papel);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px #4c1d9522}
input{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:10px;background:#fff;color:var(--texto)}
button{border:0;border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.b1{width:100%;border-radius:12px;padding:13px;font-size:15px;background:var(--roxo);color:#fff}
.b2{background:#f3f0ff;color:var(--roxo2)}
.linha{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.av{display:flex;gap:12px;padding:14px 4px;border-top:1px solid var(--linha);cursor:pointer}
.av:first-child{border-top:0}
.pt{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:transparent}
.nl .pt{background:#ef4444}.nl b{color:var(--roxo2)}
.av b{display:block;font-size:15px}.av span{display:block;font-size:14px;color:var(--suave);word-break:break-word}
.av small{font-size:12px;color:var(--suave)}
.av>div{flex:1;min-width:0}
.lx{flex:none;align-self:center;background:#fee2e2;color:#b91c1c;border-radius:999px;width:38px;height:38px;padding:0;font-size:17px}
.b3{background:#fee2e2;color:#b91c1c}.b3.cf{background:#b91c1c;color:#fff}
.bts{display:flex;gap:6px;flex-wrap:wrap}
#amsg{font-size:13.5px;color:#b91c1c;margin-top:6px}
.vazio{text-align:center;color:var(--suave);padding:20px 4px;font-size:14px}
.msg{font-size:14px;margin-top:8px;color:var(--suave)}.er{color:#b91c1c}
.hide{display:none!important}
</style>
</head>
<body>
<div class="capa">
 <div class="lg">BBABILÔNIA</div>
 <a class="voltar" id="voltar" href="painel-vendedor-v2.html">← Voltar ao painel</a>
 <h1>🔔 Avisos do vendedor</h1>
 <p>Pedidos, pagamentos, mensagens e a sua loja.</p>
</div>
<main>
 <div class="sec hide" id="login">
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Palavra-passe" autocomplete="current-password">
  <button class="b1" id="ent">Entrar</button>
  <div class="msg" id="lmsg"></div>
 </div>
 <div class="hide" id="painel">
  <div class="sec" id="pbox">
   <div class="linha"><b>Notificações neste telemóvel</b><button class="b2" id="ativar">Ativar</button></div>
   <div class="msg" id="pmsg"></div>
  </div>
  <div class="sec">
   <div class="linha" style="margin-bottom:6px"><b id="cont">Avisos</b><div class="bts"><button class="b2" id="todas">Marcar todas como lidas</button><button class="b3" id="apagarTodas">🗑 Apagar todas</button></div></div>
   <div id="amsg" class="hide"></div>
   <div id="lista"><div class="vazio">A carregar…</div></div>
  </div>
 </div>
</main>
<script>
(function(){
var sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0');
var VAPID='BLyTwU0SftyBsBZ98vViwgQ_YkXDqh566s30LFc4llrVsW1VJB8K0ha_5ghHvlRCU9Qam_xfI6SE2ajipAXVWlM';
var $=function(i){return document.getElementById(i)},eu=null,avisos=[];

/* endereço do painel: no subdomínio suppliers é a raiz "/" */
var PAINEL=/^suppliers\./i.test(location.hostname)?'/':'painel-vendedor-v2.html';
$('voltar').href=PAINEL;

/* páginas do lado do vendedor que podem abrir diretamente */
var DO_VENDEDOR=/^(painel-vendedor|fornecedor|registar-produto|detalhes-fornecedor|loja-criar|avisos-vendedor|portao-2fa)/i;

/* qualquer link de aviso que leve ao lado do cliente é trocado pela secção certa do painel */
function destino(link){
 link=String(link||'').trim();
 if(!link)return '';
 var semDominio=link.replace(/^https?:\/\/[^\/]+/i,'').replace(/^\/+/,'');
 var pagina=semDominio.split(/[?#]/)[0].split('/').pop();
 if(pagina&&DO_VENDEDOR.test(pagina))return semDominio;
 var t=semDominio.toLowerCase();
 if(/chat|mensag|convers/.test(t))return PAINEL+'#mensagens';
 if(/pedido|encomend|saldo|pagament|envio|rastre|levant|checkout|carrinho/.test(t))return PAINEL+'#encomendas';
 if(/produto|stock/.test(t))return PAINEL+'#produtos';
 if(/loja|document|verific/.test(t))return PAINEL+'#loja';
 if(/avalia/.test(t))return PAINEL+'#estatisticas';
 return PAINEL+'#inicio';
}

function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function quando(d){var s=(Date.now()-new Date(d))/1000;if(s<60)return'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';return new Date(d).toLocaleDateString()}
function desenhar(){
 var n=avisos.filter(function(a){return!a.lido}).length;
 $('cont').textContent=n?('Avisos ('+n+' por ler)'):'Avisos';
 $('lista').innerHTML=avisos.length?avisos.map(function(a,i){
  return '<div class="av'+(a.lido?'':' nl')+'" data-i="'+i+'"><i class="pt"></i><div><b>'+esc(a.titulo)+'</b><span>'+esc(a.texto)+'</span><small>'+quando(a.created_at)+'</small></div><button class="lx" data-x="'+i+'" aria-label="Apagar aviso">🗑</button></div>'}).join('')
  :'<div class="vazio">Ainda não tem avisos.</div>';
 document.querySelectorAll('.lx').forEach(function(bt){bt.onclick=function(ev){ev.stopPropagation();apagarUm(+bt.getAttribute('data-x'),bt)}});
 document.querySelectorAll('.av').forEach(function(el){el.onclick=async function(){
  var a=avisos[+el.getAttribute('data-i')];
  if(!a.lido){a.lido=true;sb.from('avisos').update({lido:true}).eq('id',a.id).then(function(){},function(){});}
  var ir=destino(a.link);
  if(ir)location.href=ir;else desenhar();
 }});
}
async function carregar(){
 if(!eu)return;
 var r=await sb.from('avisos').select('*').eq('user_id',eu.id).order('created_at',{ascending:false}).limit(100);
 if(r.error){$('lista').innerHTML='<div class="vazio">Não foi possível carregar os avisos.</div>';return}
 avisos=r.data||[];desenhar();
}
function erroApagar(){var m=$('amsg');m.textContent='Não foi possível apagar. Tente de novo.';m.classList.remove('hide');setTimeout(function(){m.classList.add('hide')},4000)}
/* apagar um aviso (só se o servidor confirmar que apagou) */
async function apagarUm(i,bt){
 var a=avisos[i];if(!a)return;bt.disabled=true;
 var r=await sb.from('avisos').delete().eq('id',a.id).eq('user_id',eu.id).select('id');
 if(r.error||!r.data||!r.data.length){bt.disabled=false;erroApagar();return}
 avisos=avisos.filter(function(x){return x.id!==a.id});desenhar();
}
/* apagar todos: 1.º toque pede confirmação, 2.º toque (em 4 s) apaga */
var confTodas=null;
$('apagarTodas').onclick=async function(){
 var b=this;if(!eu||!avisos.length)return;
 if(!confTodas){b.classList.add('cf');b.textContent='Toque de novo para apagar';confTodas=setTimeout(function(){confTodas=null;b.classList.remove('cf');b.textContent='🗑 Apagar todas'},4000);return}
 clearTimeout(confTodas);confTodas=null;b.disabled=true;b.textContent='A apagar…';
 var r=await sb.from('avisos').delete().eq('user_id',eu.id).select('id');
 b.disabled=false;b.classList.remove('cf');b.textContent='🗑 Apagar todas';
 if(r.error||!r.data||!r.data.length){erroApagar();return}
 carregar();
};
/* ao abrir, os avisos ficam vistos (o número do sino desaparece), mas os pontos continuam visíveis nesta visita */
async function marcarVistos(){
 if(!eu)return;
 try{await sb.from('avisos').update({lido:true}).eq('user_id',eu.id).eq('lido',false)}catch(e){}
}
function chave(b){var p='='.repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,function(c){return c.charCodeAt(0)})}
function estadoPush(){
 if(!('serviceWorker' in navigator)||!('PushManager' in window)){$('pmsg').textContent='Este navegador não aceita notificações. Use o Chrome.';$('ativar').classList.add('hide');return}
 if(Notification.permission==='granted'){$('pbox').classList.add('hide');guardar().catch(function(){})}
 else if(Notification.permission==='denied'){$('pmsg').innerHTML='<span class="er">Bloqueadas. Toque no cadeado ao lado do endereço → Notificações → Permitir.</span>'}
 else $('pmsg').textContent='Toque em Ativar para receber os avisos no telemóvel.';
}
async function guardar(){
 var reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
 var sub=await reg.pushManager.getSubscription();
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:chave(VAPID)});
 var j=sub.toJSON();
 await sb.from('push_subscricoes').delete().eq('endpoint',j.endpoint);
 var r=await sb.from('push_subscricoes').insert({user_id:eu.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,aparelho:navigator.userAgent.slice(0,120)});
 if(r.error)throw r.error;
}
$('ativar').onclick=async function(){
 var b=this;b.disabled=true;$('pmsg').textContent='A ativar…';
 try{
  if(await Notification.requestPermission()!=='granted'){estadoPush();b.disabled=false;return}
  await guardar();
  $('pbox').classList.add('hide');
 }catch(e){$('pmsg').innerHTML='<span class="er">Não foi possível ativar: '+esc(e.message||e)+'</span>'}
 b.disabled=false;
};
$('todas').onclick=async function(){
 await sb.from('avisos').update({lido:true}).eq('user_id',eu.id).eq('lido',false);carregar();
};
$('ent').onclick=async function(){
 var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){$('lmsg').textContent='Email ou palavra-passe errados.';return}abrir();
};
async function abrir(){
 var s=(await sb.auth.getSession()).data.session;eu=s?s.user:null;
 $('login').classList.toggle('hide',!!eu);$('painel').classList.toggle('hide',!eu);
 if(eu){estadoPush();await carregar();setTimeout(marcarVistos,2500)}
}
setInterval(function(){if(eu&&!document.hidden)carregar()},20000);
abrir();
})();
</script>
</body>
</html>
