<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBabilônia.com – Compre com confiança</title>
<meta name="description" content="BBabilônia.com: moda, eletrónicos e muito mais, com entrega e vários métodos de pagamento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --lapis:#1B2F6B; --lapis2:#264190; --ouro:#D9A441; --tijolo:#B5472E;
  --fundo:#FBFBF9; --papel:#FFFFFF; --texto:#1A1D29; --suave:#6B7080; --linha:#E6E7EC;
}
@media (prefers-color-scheme: dark){
  :root{--fundo:#12141C; --papel:#1B1E29; --texto:#F1F2F6; --suave:#9AA0B3; --linha:#2B2F3D; --lapis:#0F1A3D;}
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:120px}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--fundo);color:var(--texto);line-height:1.45}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}

header{position:sticky;top:0;z-index:10;background:var(--lapis);color:#fff;padding:10px 14px 0}
.topo{display:flex;align-items:center;gap:10px;max-width:1100px;margin:auto}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.3px;white-space:nowrap}
.logo span{color:var(--ouro)}
.pesquisa{flex:1;display:flex;background:#fff;border-radius:999px;overflow:hidden;min-width:0}
.pesquisa input{flex:1;border:0;padding:10px 14px;font:inherit;font-size:15px;color:#1A1D29;background:transparent;min-width:0}
.pesquisa input:focus{outline:none}
.pesquisa:focus-within{box-shadow:0 0 0 3px var(--ouro)}
.carrinho{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12)}
.carrinho svg{width:22px;height:22px}
#nCarrinho{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--ouro);color:#1A1D29;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;max-width:1100px;margin:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro);color:#1A1D29}

main{max-width:1100px;margin:auto;padding:16px 14px 60px}
.faixa{display:flex;gap:10px;overflow-x:auto;margin-bottom:18px;scrollbar-width:none}
.faixa::-webkit-scrollbar{display:none}
.faixa div{flex:1 0 auto;background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.faixa b{color:var(--tijolo)}
.titulo{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}
.titulo h1{font-family:'Sora',sans-serif;font-size:20px;letter-spacing:-.3px}
.titulo p{color:var(--suave);font-size:13.5px}

.grelha{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grelha{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:900px){.grelha{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--papel);border-radius:12px;overflow:hidden;border:1px solid var(--linha);display:flex;flex-direction:column}
.card .foto{aspect-ratio:3/4;background:var(--linha);position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .sem{position:absolute;inset:0;display:grid;place-items:center;color:var(--suave);font-size:13px}
.tag{position:absolute;left:8px;top:8px;background:var(--tijolo);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px}
.card .info{padding:10px 11px 12px}
.card h2{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.preco{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:var(--lapis2);margin-top:6px}
@media (prefers-color-scheme: dark){.preco{color:var(--ouro)}}
.cores{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.cores i{font-style:normal;font-size:11.5px;color:var(--suave);border:1px solid var(--linha);border-radius:5px;padding:1px 6px}

.estado{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--suave)}
.estado button{margin-top:12px;border:0;background:var(--lapis2);color:#fff;font:inherit;font-weight:700;padding:10px 20px;border-radius:999px;cursor:pointer}
.skel{aspect-ratio:3/5;border-radius:12px;background:linear-gradient(90deg,var(--linha),var(--papel),var(--linha));background-size:200% 100%;animation:brilho 1.3s infinite}
@keyframes brilho{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}

footer{background:var(--lapis);color:#cfd5ea;padding:26px 14px;font-size:13.5px;text-align:center}
footer b{color:#fff}
</style>
</head>
<body>

<header>
  <div class="topo">
    <a class="logo" href="index.html" aria-label="BBabilônia.com">B-<span>Babilônia</span></a>
    <form class="pesquisa" role="search" onsubmit="return false">
      <input id="q" type="search" placeholder="Pesquisar produtos" aria-label="Pesquisar produtos" autocomplete="off">
    </form>
    <a class="carrinho" href="carrinho.html" aria-label="Ver carrinho">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <span id="nCarrinho"></span>
    </a>
  </div>
  <nav class="cats" id="cats" aria-label="Categorias"></nav>
</header>

<main>
  <div class="faixa">
    <div><b>Pagamento:</b> M-Pesa, e-Mola e cartões Visa</div>
    <div><b>Compra</b> sem criar conta</div>
    <div><b>Envio</b> para vários países</div>
  </div>

  <div class="titulo">
    <h1 id="tituloLista">Novidades</h1>
    <p id="contagem"></p>
  </div>

  <section class="grelha" id="grelha" aria-live="polite"></section>
</main>

<footer>
  <p><b>BBabilônia.com</b></p>
  <p>Produtos de fornecedores nacionais e internacionais, com pagamento seguro.</p>
</footer>

<script>
const SUPA = "https://dsfoqoeawvjafypycldz.supabase.co";
const KEY  = "sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0";
const H = { apikey: KEY, Authorization: "Bearer " + KEY };

let produtos = [], categorias = [], catAtual = null, termo = "";

const $ = id => document.getElementById(id);
const nomeDe = o => o.name || o.nome || o.title || o.titulo || "Produto";
const precoDe = o => Number(o.price ?? o.preco ?? 0);

function fmt(v, moeda){
  const n = Number(v||0).toLocaleString("pt-PT",{maximumFractionDigits:2});
  return n + " " + (moeda || "MZN");
}

function atualizarCarrinho(){
  let total = 0;
  try{ (JSON.parse(localStorage.getItem("carrinho")||"[]")).forEach(i=> total += Number(i.qtd||1)); }catch(e){}
  const b = $("nCarrinho");
  b.textContent = total; b.style.display = total ? "grid" : "none";
}

async function get(tabela, query){
  const r = await fetch(`${SUPA}/rest/v1/${tabela}?${query}`, {headers:H});
  if(!r.ok) throw new Error(tabela + " " + r.status);
  return r.json();
}

function desenharCategorias(){
  const nav = $("cats");
  const raiz = categorias.filter(c => c.parent_id == null);
  const lista = (raiz.length ? raiz : categorias).slice(0, 40);
  nav.innerHTML = "";
  const todas = document.createElement("button");
  todas.textContent = "Tudo"; todas.setAttribute("aria-pressed", catAtual===null);
  todas.onclick = () => escolher(null);
  nav.appendChild(todas);
  lista.forEach(c=>{
    const b = document.createElement("button");
    b.textContent = nomeDe(c);
    b.setAttribute("aria-pressed", catAtual===c.id);
    b.onclick = () => escolher(c.id);
    nav.appendChild(b);
  });
}

function idsDaCategoria(id){
  const ids = [id];
  categorias.forEach(c => { if(c.parent_id === id) ids.push(c.id); });
  return ids;
}

function escolher(id){
  catAtual = id;
  desenharCategorias();
  desenhar();
}

function coresDe(p){
  let v = p.variants;
  if(typeof v === "string"){ try{ v = JSON.parse(v); }catch(e){ v = []; } }
  if(!Array.isArray(v)) return [];
  return [...new Set(v.map(x => x.cor || x.color).filter(Boolean))].slice(0,4);
}

function desenhar(){
  const g = $("grelha");
  let lista = produtos;
  if(catAtual !== null){
    const ids = idsDaCategoria(catAtual);
    lista = lista.filter(p => ids.includes(p.category_id));
  }
  if(termo){
    const t = termo.toLowerCase();
    lista = lista.filter(p => nomeDe(p).toLowerCase().includes(t));
  }
  const cat = categorias.find(c => c.id === catAtual);
  $("tituloLista").textContent = termo ? `Resultados para "${termo}"` : (cat ? nomeDe(cat) : "Novidades");
  $("contagem").textContent = lista.length + (lista.length===1 ? " produto" : " produtos");

  if(!lista.length){
    g.innerHTML = `<div class="estado"><p>Não encontrámos produtos aqui.</p><button onclick="limpar()">Ver todos os produtos</button></div>`;
    return;
  }
  g.innerHTML = "";
  lista.forEach(p=>{
    const a = document.createElement("a");
    a.className = "card";
    a.href = "produto-bbabilonia.html?id=" + encodeURIComponent(p.id);
    const foto = p.image_url
      ? `<img src="${p.image_url}" alt="${nomeDe(p).replace(/"/g,"&quot;")}" loading="lazy">`
      : `<div class="sem">Sem foto</div>`;
    const cores = coresDe(p).map(c=>`<i>${c}</i>`).join("");
    a.innerHTML = `
      <div class="foto">${foto}${p.video_url ? '<span class="tag">Vídeo</span>' : ""}</div>
      <div class="info">
        <h2>${nomeDe(p)}</h2>
        <div class="preco">${fmt(precoDe(p), p.currency)}</div>
        ${cores ? `<div class="cores">${cores}</div>` : ""}
      </div>`;
    g.appendChild(a);
  });
}

function limpar(){ termo = ""; $("q").value = ""; escolher(null); }

async function iniciar(){
  atualizarCarrinho();
  $("grelha").innerHTML = '<div class="skel"></div>'.repeat(4);
  try{
    const [prods, cats] = await Promise.all([
      get("products", "select=*&order=created_at.desc&limit=200").catch(()=> get("products","select=*&limit=200")),
      get("categories", "select=*&limit=300").catch(()=> [])
    ]);
    produtos = prods; categorias = cats;
    desenharCategorias();
    desenhar();
  }catch(e){
    $("grelha").innerHTML = `<div class="estado"><p>Não foi possível carregar os produtos.</p><button onclick="iniciar()">Tentar de novo</button></div>`;
  }
}

$("q").addEventListener("input", e => { termo = e.target.value.trim(); desenhar(); });
window.addEventListener("pageshow", atualizarCarrinho);
iniciar();
</script>
<script src="menu-babilonia.js"></script></body>
</html>
<script src="camara-pesquisa.js"></script>
