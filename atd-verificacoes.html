<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Verificações dos pedidos · Atendimento BBabilônia</title>

<style>
:root{--fundo:#eef2f7;--papel:#fff;--texto:#0f172a;--suave:#64748b;--linha:#e2e8f0;--az:#2563eb}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);line-height:1.45;color-scheme:light}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px #0003}
.bar h1{font-size:17px;flex:1}.bar a{color:#fff;background:#ffffff2e;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;border:0;border-radius:12px;padding:11px 5px;font-size:13.5px;font:inherit;font-weight:800;background:#fff;color:#475569}
.tabs button.on{background:var(--az);color:#fff}
.box{background:var(--papel);border-radius:16px;padding:14px;box-shadow:0 4px 14px #0001;margin-bottom:12px}
.l1{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--suave)}
h3{font-size:15px;margin:10px 0 6px}
.it{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--linha)}.it:first-of-type{border-top:0}
.it img,.it .sf{width:58px;height:58px;border-radius:8px;object-fit:cover;background:#f1f5f9;flex:none}
.it b{display:block;font-size:14.5px}.it small{color:var(--suave)}
.md{display:flex;flex-wrap:wrap;gap:6px}.md img{width:92px;height:92px;object-fit:cover;border-radius:10px}.md video{width:100%;max-height:300px;border-radius:10px;background:#000}
.est{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px;margin:4px 4px 0 0;background:#fef3c7;color:#92400e}
.est.ok{background:#d1fae5;color:#065f46}.est.no{background:#fee2e2;color:#991b1b}.est.az{background:#dbeafe;color:#1e40af}
textarea{width:100%;padding:11px;border:2px solid var(--linha);border-radius:12px;font:inherit;font-size:15px;margin-top:8px}
.bts{display:flex;gap:8px;margin-top:10px}.bts button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-size:14px;font-weight:800;color:#fff}
.sim{background:#10b981}.nao{background:#dc2626}.bts button:disabled{opacity:.45}
.msg{font-size:14px;margin-top:8px;color:#dc2626;white-space:pre-line}.msg.ok{color:#059669}
.vz{text-align:center;color:var(--suave);padding:30px 10px}
.hide{display:none}
.tabs{flex-wrap:wrap}.tabs button{min-width:30%}
.loja{background:#ecfdf5;border-radius:12px;padding:10px;font-size:14px;margin-top:8px;line-height:1.5}.loja b{font-size:15px}.loja a{color:#065f46;font-weight:800}
.cli{background:#f8fafc;border-radius:12px;padding:10px;font-size:14px;margin-top:8px;line-height:1.5}.cli a{color:#1d4ed8;font-weight:700}
.rb{background:#f59e0b!important}.tarde{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:20px;background:#fee2e2;color:#991b1b;font-size:12.5px;font-weight:800}
.rsp{margin-top:8px;padding:9px 10px;border-radius:12px;font-size:14px;font-weight:700;background:#f1f5f9;color:#334155}.rsp.livre{background:#fff7ed;color:#9a3412}
</style>
</head>
<body>
<script>/* Botão voltar do telemóvel: volta sempre ao painel principal e nunca sai do site (BBabilônia, 13/11/2026) */
(function(){var H=(/^(admin|administrator)\./i.test(location.hostname)?'/':'atendimento.html');try{var r=document.referrer?new URL(document.referrer):null;if(r&&r.host===location.host&&history.length>1)return}catch(e){}
var u=location.href;try{history.replaceState({bbBase:1},'',H);history.pushState({bbPag:1},'',u)}catch(e){return}
addEventListener('popstate',function(e){if(e.state&&e.state.bbBase)location.replace(H)});})();</script>

<div class="bar"><h1>🛡️ Verificações dos pedidos</h1><a id="volta" href="atendimento.html">← Atendimento</a></div>
<main>
 <div class="tabs"><button id="tN">🆕 Novos pedidos</button><button id="tE" class="on">À espera de confirmação</button><button id="tT">Todas</button><button id="tA">🚚 Acompanhamento</button><button id="tR">💸 Reembolsos</button><button id="tD">⚠️ Disputas</button></div>
 <div id="lista"><div class="vz">A carregar…</div></div>
</main>
<script src="acompanhamento.js?v=1"></script>
<script>
var ADM=/^(admin|administrator)\./i.test(location.hostname);
var sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0',ADM?{}:window.ATD_AUTH);
if(ADM)document.getElementById('volta').href='/';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function arr(x){if(typeof x==='string'){try{x=JSON.parse(x)}catch(e){x=[]}}return Array.isArray(x)?x:[]}
function dt(t){var d=new Date(t);return t&&!isNaN(d)?d.toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
function din(v,m){return Number(v||0).toLocaleString('pt-PT',{maximumFractionDigits:2})+' '+(m||'')}
var TODAS=false,L=[];
var EST={por_confirmar:['⏳ Por confirmar',''],recusado_agente:['❌ Agente recusou','no'],iguais:['✅ Iguais · confirmado','ok'],diferentes:['❌ Diferentes','no'],recolhido:['📦 Recolhido pelo agente','az']};
var F0=new URLSearchParams(location.search).get('f'),ACOMP=F0==='acompanhamento',NOVOS=F0==='novos',REEMB=F0==='reembolsos',DISP=F0==='disputas',LOJ={},RSP={},RB={lista:[]};
function marca(id){['tN','tE','tT','tA','tR','tD'].forEach(function(x){$(x).classList.toggle('on',x===id)})}
function aba(n,a,r,t){NOVOS=n;ACOMP=a;REEMB=r;DISP=false;if(t!==undefined)TODAS=t}
$('tN').onclick=function(){aba(true,false,false);marca('tN');carregar()};
$('tE').onclick=function(){aba(false,false,false,false);marca('tE');carregar()};
$('tT').onclick=function(){aba(false,false,false,true);marca('tT');carregar()};
$('tA').onclick=function(){aba(false,true,false);marca('tA');carregar()};
$('tR').onclick=function(){aba(false,false,true);marca('tR');carregar()};
$('tD').onclick=function(){aba(false,false,false);DISP=true;marca('tD');carregar()};
if(ACOMP)marca('tA');if(NOVOS)marca('tN');if(REEMB)marca('tR');if(DISP)marca('tD');
var DEST={aberta:['📝 Aberta · à espera do fornecedor',''],negociacao:['🤝 Em negociação',''],em_analise:['🎧 Intervenção da BBabilônia','az'],fornecedor_aceitou:['⚖️ Fornecedor aceitou','ok'],acordo:['⚖️ Acordo','ok'],ganha_cliente:['⚖️ A favor do cliente','ok'],ganha_fornecedor:['⚖️ A favor do fornecedor','ok'],dividida:['⚖️ Valor dividido','ok'],cancelada:['Cancelada pelo cliente','']};
function dispHtml(x){var e=DEST[x.estado]||[x.estado,''];return'<div class="box"><div class="l1"><span>Pedido '+esc(String(x.order_id).slice(0,8).toUpperCase())+' · '+din(x.valor,x.moeda)+'</span><span>'+esc(dt(x.criado))+'</span></div>'+
 '<span class="est '+e[1]+'">'+e[0]+'</span><div class="cli">⚠️ <b>'+esc(x.motivo||'')+'</b><br>🙋 '+esc(x.cliente_nome||'Cliente')+'<br>🛡️ Agente de busca: '+esc(x.agente_busca||'—')+'<br>🎧 Atendimento: '+esc(x.atendente_email||'ainda ninguém')+'<br>💬 '+(x.mensagens||0)+' mensagem(ns)</div>'+
 '<div class="bts"><a class="sim" style="flex:1;text-align:center;border-radius:12px;padding:12px;color:#fff;font-weight:800;text-decoration:none;background:#2563eb" href="disputa.html?id='+encodeURIComponent(x.id)+'&como=admin">Abrir a disputa ›</a></div></div>'}
/* 💸 cancelar e reembolsar (antes de o dinheiro ser libertado ao fornecedor) */
async function cancelar(id,motivo,m){
 if(!motivo||motivo.length<5){m.className='msg';m.textContent='Escreva o motivo do cancelamento (o cliente vai ver).';return}
 if(!confirm('Cancelar o pedido '+String(id).slice(0,8).toUpperCase()+' e reembolsar o cliente?\nO dono recebe o aviso para fazer o reembolso.'))return;
 var r=await sb.rpc('verificacao_cancelar_reembolsar',{p_order:id,p_motivo:motivo});
 if(r.error){m.className='msg';m.textContent=r.error.message;return}
 m.className='msg ok';m.textContent='💸 Pedido cancelado. O cliente e o dono foram avisados do reembolso.';setTimeout(carregar,1800);
}
function apagarBt(id){return(RSP.dono||RB.dono)?'<div class="bts"><button class="nao" style="background:#475569" data-del="'+esc(id)+'">🗑️ Apagar pedido (só o dono)</button></div>':''}
function horas(t){return Math.floor((new Date()-new Date(t))/3600000)}
function reemb(x,i){
 return'<div class="box" data-rb="'+i+'"><div class="l1"><span>Pedido '+esc(String(x.order_id).slice(0,8).toUpperCase())+' · '+din(x.valor,x.moeda)+'</span><span>'+esc(dt(x.pedido_em))+'</span></div>'+
  (x.pago_em?'<span class="est ok">✅ Reembolsado '+esc(dt(x.pago_em))+(x.referencia?' · ref. '+esc(x.referencia):'')+'</span>':'<span class="est no">💸 Por reembolsar</span>')+
  '<div class="cli">🙋 '+esc(x.cliente_nome||'Cliente')+(x.cliente_telefone?' · 📞 '+tel(x.cliente_telefone):'')+'<br><b>Motivo:</b> '+esc(x.motivo||'')+'<br><span style="color:#64748b">Pedido por '+esc(x.pedido_por||'')+'</span></div>'+
  '<h3>🧾 Produtos</h3>'+itens(x.itens)+
  (!x.pago_em&&RB.dono?'<div class="bts"><button class="sim" data-pago="1">✅ Já reembolsei o cliente</button></div>':'')+apagarBt(x.order_id)+'<div class="msg"></div></div>';
}
/* loja (endereço e contacto só para agentes e dono), cliente e quem está com o pedido */
function tel(t){var n=String(t||'').replace(/[^\d+]/g,'');return n?'<a href="tel:'+esc(n)+'">'+esc(t)+'</a>':'não registado'}
function lojaHtml(x){x=x||{};return'<div class="loja">🏪 <b>'+esc(x.loja_nome||'Loja não identificada')+'</b>'+(x.loja_local?'<br>'+esc(x.loja_local):'')+
 '<br>📍 '+esc(x.loja_endereco||'Endereço não registado')+'<br>📞 '+tel(x.loja_telefone)+'<div style="font-size:12px;color:#64748b;margin-top:4px">🔒 Endereço e telemóvel só para agentes e administração.</div></div>'}
function rspHtml(id){var r=(RSP.pedidos||{})[String(id)];return r?'<div class="rsp">👤 Agente de busca: '+esc(r.nome||r.email)+'</div>':'<div class="rsp livre">🟠 Nenhum agente de busca pegou este pedido</div>'}
async function extras(ids){
 LOJ={};RSP={};if(!ids.length)return;
 try{var a=await sb.rpc('pedidos_lojas',{p_orders:ids});if(!a.error&&a.data)LOJ=a.data}catch(e){}
 try{var b=await sb.rpc('verificacao_responsaveis',{p_orders:ids});if(!b.error&&b.data)RSP=b.data}catch(e){}
}
function novo(p){
 return'<div class="box"><div class="l1"><span>Pedido '+esc(String(p.order_id).slice(0,8).toUpperCase())+' · '+din(p.total,p.moeda)+'</span><span>'+esc(dt(p.criado))+'</span></div>'+
  (p.estado==='diferentes'?'<span class="est no">↩️ Diferente · volta a verificar</span>':'<span class="est">🆕 Pago · por verificar na loja</span>')+
  (!(RSP.pedidos||{})[String(p.order_id)]&&horas(p.criado)>=2?'<div class="tarde">⏰ Há '+horas(p.criado)+' h sem agente</div>':'')+
  rspHtml(p.order_id)+lojaHtml(p)+
  '<div class="cli">🙋 Cliente: <b>'+esc(p.cliente_nome||'—')+'</b>'+(p.cliente_telefone?' · 📞 '+tel(p.cliente_telefone):'')+(p.cliente_endereco?'<br>📍 '+esc(p.cliente_endereco):'')+'</div>'+
  '<h3>🧾 O que o cliente pediu</h3>'+itens(p.itens)+
  '<textarea rows="2" maxlength="300" placeholder="Só se for cancelar: motivo (ex.: a loja não tem o produto)"></textarea>'+
  '<div class="bts"><button class="nao rb" data-cx="'+esc(p.order_id)+'">💸 Cancelar e reembolsar</button></div>'+apagarBt(p.order_id)+'<div class="msg"></div></div>';
}
function itens(l){
 return arr(l).map(function(i){var f=i.foto||i.image||i.imagem||'';
  return'<div class="it">'+(f?'<img src="'+esc(f)+'" alt="">':'<div class="sf"></div>')+'<div><b>'+esc(i.nome||i.descricao||i.name||'Produto')+'</b><small>'+
   esc([i.cor,i.tamanho].filter(Boolean).join(' · '))+' × '+esc(i.qtd||i.quantidade||1)+(i.extra?' · '+esc(i.extra):'')+'</small></div></div>'}).join('')||'<p class="vz" style="padding:6px">Sem itens</p>';
}
function caixa(v,i){
 var e=EST[v.estado]||[v.estado,''],aberta=v.estado==='por_confirmar'||v.estado==='recusado_agente';
 return'<div class="box" data-i="'+i+'"><div class="l1"><span>Pedido '+esc(String(v.order_id).slice(0,8))+' · '+din(v.total,v.moeda)+'</span><span>Verificado '+esc(dt(v.verificado_em))+'</span></div>'+
  '<span class="est '+e[1]+'">'+e[0]+'</span>'+rspHtml(v.order_id)+lojaHtml(LOJ[String(v.order_id)])+(v.libertado?'<span class="est ok">💰 Valor libertado ao fornecedor</span>':'')+(v.erro_libertar?'<span class="est no">Valor não libertado: '+esc(v.erro_libertar)+'</span>':'')+
  '<h3>🧾 O que o cliente pediu</h3>'+itens(v.itens)+
  '<h3>🛡️ Fotos e vídeos do agente'+(v.agente_nome?' ('+esc(v.agente_nome)+')':'')+'</h3>'+
  (v.motivo_agente?'<p style="font-size:14px;margin-bottom:6px">'+(v.estado==='recusado_agente'?'<b>Motivo da recusa:</b> ':'<b>Nota:</b> ')+esc(v.motivo_agente)+'</p>':'')+
  '<div class="md">'+arr(v.fotos).map(function(u){return'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(u)+'" alt=""></a>'}).join('')+'</div>'+
  '<div class="md" style="margin-top:6px">'+arr(v.videos).map(function(u){return'<video controls playsinline preload="metadata" src="'+esc(u)+'"></video>'}).join('')+'</div>'+
  (v.motivo_atendimento?'<p style="font-size:14px;margin-top:8px"><b>Atendimento:</b> '+esc(v.motivo_atendimento)+(v.atendente_email?' · '+esc(v.atendente_email):'')+'</p>':'')+
  (aberta?'<textarea rows="2" maxlength="500" placeholder="Se for diferente, escreva o que está diferente (cor, tamanho, quantidade, defeito…)"></textarea>'+
   '<div class="bts"><button class="sim" data-a="1"'+(v.estado==='recusado_agente'?' disabled title="O agente recusou estes produtos"':'')+'>✅ Iguais ao pedido · libertar o dinheiro</button><button class="nao" data-a="0">❌ Diferentes</button></div><div class="bts"><button class="nao rb" data-cx="'+esc(v.order_id)+'">💸 Cancelar e reembolsar</button></div><div class="msg"></div>':'')+(aberta?'':apagarBt(v.order_id)+'<div class="msg"></div>')+(aberta&&(RSP.dono)?apagarBt(v.order_id):'')+
 '</div>';
}
async function carregar(){
 $('lista').innerHTML='<div class="vz">A carregar…</div>';
 var s=(await sb.auth.getSession()).data.session;
 if(!s){$('lista').innerHTML=ADM?'<div class="box vz">Entre primeiro no <a href="/">painel do dono</a> (neste mesmo navegador).</div>':'<div class="box vz">Entre primeiro no <a href="atendimento.html">Atendimento</a>.</div>';return}
 try{sb.rpc('bb_alerta_sem_agente')}catch(e){}
 if(ACOMP){window.Acomp.carregar(sb,$('lista'),'atendimento');return}
 if(DISP){
  var dd=await sb.rpc('disputas_equipa_lista');
  if(dd.error){$('lista').innerHTML='<div class="box vz">'+esc(/function|exist|find/i.test(dd.error.message)?'Falta correr o SQL novo no Supabase.':dd.error.message)+'</div>';return}
  var DL=dd.data||[];$('lista').innerHTML=DL.length?DL.map(dispHtml).join(''):'<div class="box vz">Não há disputas. 👍</div>';return;
 }
 if(REEMB){
  var rr=await sb.rpc('reembolsos_lista');
  if(rr.error){$('lista').innerHTML='<div class="box vz">'+esc(/function|exist|find/i.test(rr.error.message)?'Falta correr o SQL novo no Supabase.':rr.error.message)+'</div>';return}
  RB=rr.data||{lista:[]};RSP={dono:RB.dono};
  $('lista').innerHTML=RB.lista.length?RB.lista.map(reemb).join(''):'<div class="box vz">Não há reembolsos. 👍</div>';return;
 }
 if(NOVOS){
  var n=await sb.rpc('atendimento_novos_pedidos');
  if(n.error){$('lista').innerHTML='<div class="box vz">'+esc(/function|exist|find/i.test(n.error.message)?'Falta correr o SQL novo no Supabase.':n.error.message)+'</div>';return}
  var N=n.data||[];await extras(N.map(function(p){return p.order_id}));
  $('lista').innerHTML=N.length?N.map(novo).join(''):'<div class="box vz">Não há compras novas por verificar. 👍</div>';return;
 }
 var r=await sb.rpc('verificacoes_atendimento',{p_todas:TODAS});
 if(r.error){$('lista').innerHTML='<div class="box vz">'+esc(/relation|function|exist/i.test(r.error.message)&&!/agentes/i.test(r.error.message)?'Falta correr o SQL novo no Supabase.':r.error.message)+'</div>';return}
 L=r.data||[];
 await extras(L.map(function(v){return v.order_id}));
 $('lista').innerHTML=L.length?L.map(caixa).join(''):'<div class="box vz">'+(TODAS?'Ainda não há verificações.':'Não há verificações à espera. 👍')+'</div>';
}
$('lista').addEventListener('click',async function(e){
 var dl=e.target.closest('[data-del]');
 if(dl){var bd=dl.closest('.box'),md=bd.querySelector('.msg'),idd=dl.getAttribute('data-del');
  if(!confirm('APAGAR o pedido '+idd.slice(0,8).toUpperCase()+' e tudo o que está ligado a ele?\nNão dá para desfazer.'))return;
  dl.disabled=true;var qd=await sb.rpc('dono_apagar_pedido',{p_order:idd});
  if(qd.error){dl.disabled=false;md.className='msg';md.textContent=qd.error.message;return}
  bd.remove();return}
 var cx=e.target.closest('[data-cx]');
 if(cx){var bx=cx.closest('.box');await cancelar(cx.getAttribute('data-cx'),(bx.querySelector('textarea')||{value:''}).value.trim(),bx.querySelector('.msg'));return}
 var pg=e.target.closest('[data-pago]');
 if(pg){var bb=pg.closest('[data-rb]'),x=RB.lista[+bb.getAttribute('data-rb')],mm=bb.querySelector('.msg');
  var ref=prompt('Referência da transferência do reembolso (opcional):','');if(ref===null)return;
  pg.disabled=true;var q=await sb.rpc('reembolso_pago',{p_order:x.order_id,p_referencia:ref});
  if(q.error){pg.disabled=false;mm.className='msg';mm.textContent=q.error.message;return}
  mm.className='msg ok';mm.textContent='✅ Reembolso marcado como feito. O cliente foi avisado.';setTimeout(carregar,1500);return}
 var b=e.target.closest('[data-a]');if(!b)return;
 var c=b.closest('[data-i]'),v=L[+c.getAttribute('data-i')],sim=b.getAttribute('data-a')==='1',mot=c.querySelector('textarea').value.trim(),m=c.querySelector('.msg');
 m.className='msg';m.textContent='';
 if(!sim&&mot.length<5)return m.textContent='Escreva o que está diferente.';
 if(!confirm(sim?'Confirmar que os produtos são IGUAIS ao pedido?\nO valor é libertado ao fornecedor e o agente pode recolher os produtos.':'Marcar como DIFERENTES? O pedido volta para nova verificação.'))return;
 c.querySelectorAll('[data-a]').forEach(function(x){x.disabled=true});
 var r=await sb.rpc('verificacao_atendimento_decidir',{p_order:v.order_id,p_iguais:sim,p_motivo:mot||null});
 if(r.error){m.textContent=r.error.message;c.querySelectorAll('[data-a]').forEach(function(x){x.disabled=false});return}
 m.className='msg ok';m.textContent=sim?(r.data==='libertado'?'✅ Confirmado. Valor libertado ao fornecedor.':'✅ Confirmado. O valor não foi libertado automaticamente ('+String(r.data).replace('nao_libertado: ','')+') — o administrador liberta no painel.'):'Marcado como diferente. Volta para nova verificação.';
 setTimeout(carregar,1800);
});
