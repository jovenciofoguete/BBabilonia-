<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verificações dos pedidos · Atendimento BBabilônia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>if(!/^(admin|administrator)\./i.test(location.hostname))document.write('<script src="atd-sessao.js?v=1"><\/script>');</script>
<style>
:root{--fundo:#eef2f7;--papel:#fff;--texto:#0f172a;--suave:#64748b;--linha:#e2e8f0;--az:#2563eb}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);line-height:1.45;color-scheme:light}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px #0003}
.bar h1{font-size:17px;flex:1}.bar a{color:#fff;background:#ffffff2e;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;border:0;border-radius:12px;padding:11px;font:inherit;font-weight:800;background:#fff;color:#475569}
.tabs button.on{background:var(--az);color:#fff}
.box{background:var(--papel);border-radius:16px;padding:14px;box-shadow:0 4px 14px #0001;margin-bottom:12px}
.l1{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--suave)}
h3{font-size:15px;margin:10px 0 6px}
.it{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--linha)}.it:first-of-type{border-top:0}
.it img,.it .sf{width:58px;height:58px;border-radius:8px;object-fit:cover;background:#f1f5f9;flex:none}
.it b{display:block;font-size:14.5px}.it small{color:var(--suave)}
.md{display:flex;flex-wrap:wrap;gap:6px}.md img{width:92px;height:92px;object-fit:cover;border-radius:10px}.md video{width:100%;max-height:300px;border-radius:10px;background:#000}
.est{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px;margin:4px 4px 0 0;background:#fef3c7;color:#92400e}
.est.ok{background:#d1fae5;color:#065f46}.est.no{background:#fee2e2;color:#991b1b}.est.az{background:#dbeafe;color:#1e40af}
textarea{width:100%;padding:11px;border:2px solid var(--linha);border-radius:12px;font:inherit;font-size:15px;margin-top:8px}
.bts{display:flex;gap:8px;margin-top:10px}.bts button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-size:14px;font-weight:800;color:#fff}
.sim{background:#10b981}.nao{background:#dc2626}.bts button:disabled{opacity:.45}
.msg{font-size:14px;margin-top:8px;color:#dc2626;white-space:pre-line}.msg.ok{color:#059669}
.vz{text-align:center;color:var(--suave);padding:30px 10px}
.hide{display:none}
</style>
</head>
<body>
<div class="bar"><h1>🛡️ Verificações dos pedidos</h1><a id="volta" href="atendimento.html">← Atendimento</a></div>
<main>
 <div class="tabs"><button id="tE" class="on">À espera de confirmação</button><button id="tT">Todas</button></div>
 <div id="lista"><div class="vz">A carregar…</div></div>
</main>
<script>
var ADM=/^(admin|administrator)\./i.test(location.hostname);
var sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0',ADM?{}:window.ATD_AUTH);
if(ADM)document.getElementById('volta').href='/';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function arr(x){if(typeof x==='string'){try{x=JSON.parse(x)}catch(e){x=[]}}return Array.isArray(x)?x:[]}
function dt(t){var d=new Date(t);return t&&!isNaN(d)?d.toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
function din(v,m){return Number(v||0).toLocaleString('pt-PT',{maximumFractionDigits:2})+' '+(m||'')}
var TODAS=false,L=[];
var EST={por_confirmar:['⏳ Por confirmar',''],recusado_agente:['❌ Agente recusou','no'],iguais:['✅ Iguais · confirmado','ok'],diferentes:['❌ Diferentes','no'],recolhido:['📦 Recolhido pelo agente','az']};
$('tE').onclick=function(){TODAS=false;$('tE').classList.add('on');$('tT').classList.remove('on');carregar()};
$('tT').onclick=function(){TODAS=true;$('tT').classList.add('on');$('tE').classList.remove('on');carregar()};
function itens(l){
 return arr(l).map(function(i){var f=i.foto||i.image||i.imagem||'';
  return'<div class="it">'+(f?'<img src="'+esc(f)+'" alt="">':'<div class="sf"></div>')+'<div><b>'+esc(i.nome||i.descricao||i.name||'Produto')+'</b><small>'+
   esc([i.cor,i.tamanho].filter(Boolean).join(' · '))+' × '+esc(i.qtd||i.quantidade||1)+(i.extra?' · '+esc(i.extra):'')+'</small></div></div>'}).join('')||'<p class="vz" style="padding:6px">Sem itens</p>';
}
function caixa(v,i){
 var e=EST[v.estado]||[v.estado,''],aberta=v.estado==='por_confirmar'||v.estado==='recusado_agente';
 return'<div class="box" data-i="'+i+'"><div class="l1"><span>Pedido '+esc(String(v.order_id).slice(0,8))+' · '+din(v.total,v.moeda)+'</span><span>Verificado '+esc(dt(v.verificado_em))+'</span></div>'+
  '<span class="est '+e[1]+'">'+e[0]+'</span>'+(v.libertado?'<span class="est ok">💰 Valor libertado ao fornecedor</span>':'')+(v.erro_libertar?'<span class="est no">Valor não libertado: '+esc(v.erro_libertar)+'</span>':'')+
  '<h3>🧾 O que o cliente pediu</h3>'+itens(v.itens)+
  '<h3>🛡️ Fotos e vídeos do agente'+(v.agente_nome?' ('+esc(v.agente_nome)+')':'')+'</h3>'+
  (v.motivo_agente?'<p style="font-size:14px;margin-bottom:6px">'+(v.estado==='recusado_agente'?'<b>Motivo da recusa:</b> ':'<b>Nota:</b> ')+esc(v.motivo_agente)+'</p>':'')+
  '<div class="md">'+arr(v.fotos).map(function(u){return'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(u)+'" alt=""></a>'}).join('')+'</div>'+
  '<div class="md" style="margin-top:6px">'+arr(v.videos).map(function(u){return'<video controls playsinline preload="metadata" src="'+esc(u)+'"></video>'}).join('')+'</div>'+
  (v.motivo_atendimento?'<p style="font-size:14px;margin-top:8px"><b>Atendimento:</b> '+esc(v.motivo_atendimento)+(v.atendente_email?' · '+esc(v.atendente_email):'')+'</p>':'')+
  (aberta?'<textarea rows="2" maxlength="500" placeholder="Se for diferente, escreva o que está diferente (cor, tamanho, quantidade, defeito…)"></textarea>'+
   '<div class="bts"><button class="sim" data-a="1"'+(v.estado==='recusado_agente'?' disabled title="O agente recusou estes produtos"':'')+'>✅ Iguais ao pedido · libertar o dinheiro</button><button class="nao" data-a="0">❌ Diferentes</button></div><div class="msg"></div>':'')+
 '</div>';
}
async function carregar(){
 $('lista').innerHTML='<div class="vz">A carregar…</div>';
 var s=(await sb.auth.getSession()).data.session;
 if(!s){$('lista').innerHTML='<div class="box vz">Entre primeiro no <a href="atendimento.html">Atendimento</a>.</div>';return}
 var r=await sb.rpc('verificacoes_atendimento',{p_todas:TODAS});
 if(r.error){$('lista').innerHTML='<div class="box vz">'+esc(/relation|function|exist/i.test(r.error.message)&&!/agentes/i.test(r.error.message)?'Falta correr o SQL novo no Supabase.':r.error.message)+'</div>';return}
 L=r.data||[];
 $('lista').innerHTML=L.length?L.map(caixa).join(''):'<div class="box vz">'+(TODAS?'Ainda não há verificações.':'Não há verificações à espera. 👍')+'</div>';
}
$('lista').addEventListener('click',async function(e){
 var b=e.target.closest('[data-a]');if(!b)return;
 var c=b.closest('[data-i]'),v=L[+c.getAttribute('data-i')],sim=b.getAttribute('data-a')==='1',mot=c.querySelector('textarea').value.trim(),m=c.querySelector('.msg');
 m.className='msg';m.textContent='';
 if(!sim&&mot.length<5)return m.textContent='Escreva o que está diferente.';
 if(!confirm(sim?'Confirmar que os produtos são IGUAIS ao pedido?\nO valor é libertado ao fornecedor e o agente pode recolher os produtos.':'Marcar como DIFERENTES? O pedido volta para nova verificação.'))return;
 c.querySelectorAll('[data-a]').forEach(function(x){x.disabled=true});
 var r=await sb.rpc('verificacao_atendimento_decidir',{p_order:v.order_id,p_iguais:sim,p_motivo:mot||null});
 if(r.error){m.textContent=r.error.message;c.querySelectorAll('[data-a]').forEach(function(x){x.disabled=false});return}
 m.className='msg ok';m.textContent=sim?(r.data==='libertado'?'✅ Confirmado. Valor libertado ao fornecedor.':'✅ Confirmado. O valor não foi libertado automaticamente ('+String(r.data).replace('nao_libertado: ','')+') — o administrador liberta no painel.'):'Marcado como diferente. Volta para nova verificação.';
 setTimeout(carregar,1800);
});
carregar();
</script>
</body>
</html>
