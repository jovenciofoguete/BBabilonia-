<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas moradas - BBabilônia</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:14px 16px;font-weight:bold}
.box{background:#fff;margin:12px;padding:14px;border-radius:10px}
label{display:block;font-size:13px;margin:10px 0 4px;font-weight:bold}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:12px;font-size:16px;border:0;border-radius:8px;background:#e8590c;color:#fff;margin-top:14px}
button.sec{background:#555}
.end{border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.tag{display:inline-block;background:#eee;border-radius:6px;padding:2px 8px;font-size:12px;margin-bottom:6px}
.msg{color:#c00;font-size:14px;margin-top:8px}
.ok{color:#080}
.hide{display:none}
small{color:#666}
</style>
</head>
<body>
<header>BBabilônia · Minhas moradas</header>

<div id="login" class="box">
  <b>Entre na sua conta para ver as moradas</b>
  <label>Email</label><input id="le" type="email">
  <label>Palavra-passe</label><input id="lp" type="password">
  <button onclick="entrar()">Entrar</button>
  <button class="sec" onclick="registar()">Criar conta</button>
  <div id="lm" class="msg"></div>
</div>

<div id="app" class="hide">
  <div class="box">
    <b>Moradas guardadas</b>
    <div id="lista"><small>A carregar...</small></div>
  </div>
  <div class="box">
    <b>Nova morada</b>
    <label>Tipo</label>
    <select id="tipo">
      <option value="entrega">Morada de entrega</option>
      <option value="internacional">Endereço internacional de recebimento final</option>
    </select>
    <label>Nome do destinatário</label><input id="nome">
    <label>Telemóvel</label><input id="telefone" type="tel">
    <label>País</label><select id="pais" onchange="provs()"></select>
    <label>Província / Região (escolha na lista)</label><select id="provincia"></select>
    <label>Cidade / Distrito</label><input id="cidade">
    <label>Código postal</label><input id="codigo_postal">
    <label>Morada detalhada (rua, bairro, andar, número)</label><textarea id="detalhe" rows="3"></textarea>
    <label>Marca de envio</label>
    <input id="marca_envio" placeholder="A sua marca (a logística identifica o seu produto)">
    <small>Obrigatória quando o fornecedor está noutro país.</small>
    <button onclick="guardar()">Guardar morada</button>
    <button class="sec" onclick="sair()">Sair da conta</button>
    <div id="m" class="msg"></div>
  </div>
</div>

<script>
var URL_="https://dsfoqoeawvjafypycldz.supabase.co";
var KEY="sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0";
var P={
"Moçambique":["Maputo Cidade","Maputo Província","Gaza","Inhambane","Sofala","Manica","Tete","Zambézia","Nampula","Cabo Delgado","Niassa"],
"Angola":["Luanda","Bengo","Benguela","Bié","Cabinda","Cuando Cubango","Cuanza Norte","Cuanza Sul","Cunene","Huambo","Huíla","Lunda Norte","Lunda Sul","Malanje","Moxico","Namibe","Uíge","Zaire"],
"África do Sul":["Gauteng","Western Cape","Eastern Cape","KwaZulu-Natal","Limpopo","Mpumalanga","North West","Northern Cape","Free State"],
"Portugal":["Aveiro","Beja","Braga","Bragança","Castelo Branco","Coimbra","Évora","Faro","Guarda","Leiria","Lisboa","Portalegre","Porto","Santarém","Setúbal","Viana do Castelo","Vila Real","Viseu","Açores","Madeira"],
"Brasil":["Acre","Alagoas","Amapá","Amazonas","Bahia","Ceará","Distrito Federal","Espírito Santo","Goiás","Maranhão","Mato Grosso","Mato Grosso do Sul","Minas Gerais","Pará","Paraíba","Paraná","Pernambuco","Piauí","Rio de Janeiro","Rio Grande do Norte","Rio Grande do Sul","Rondônia","Roraima","Santa Catarina","São Paulo","Sergipe","Tocantins"],
"China":["Guangdong","Zhejiang","Jiangsu","Shanghai","Beijing","Fujian","Shandong","Henan","Hebei","Hubei","Hunan","Sichuan","Chongqing","Tianjin","Anhui","Jiangxi","Shaanxi","Liaoning","Guangxi","Yunnan","Hainan","Outra"],
"Tanzânia":["Dar es Salaam","Arusha","Dodoma","Mwanza","Zanzibar","Mbeya","Outra"],
"Zimbábue":["Harare","Bulawayo","Manicaland","Mashonaland Central","Mashonaland East","Mashonaland West","Masvingo","Matabeleland North","Matabeleland South","Midlands"],
"Malawi":["Região Norte","Região Central","Região Sul"],
"Zâmbia":["Lusaka","Copperbelt","Central","Eastern","Luapula","Muchinga","Northern","North-Western","Southern","Western"],
"Outro país":["Outra região"]
};
var tok=null,uid=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function paises(){var h="";Object.keys(P).forEach(function(k){h+="<option>"+k+"</option>"});$("pais").innerHTML=h;provs()}
function provs(){var h="";P[$("pais").value].forEach(function(k){h+="<option>"+k+"</option>"});$("provincia").innerHTML=h}
function H(extra){var h={"apikey":KEY,"Content-Type":"application/json"};if(tok)h["Authorization"]="Bearer "+tok;for(var k in (extra||{}))h[k]=extra[k];return h}
function guardarSessao(d){tok=d.access_token;uid=d.user.id;try{localStorage.setItem("bb_tok",tok);localStorage.setItem("bb_uid",uid)}catch(e){}}
async function auth(rota){
  var corpo=JSON.stringify({email:$("le").value.trim(),password:$("lp").value});
  var r=await fetch(URL_+"/auth/v1/"+rota,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:corpo});
  var d=await r.json();
  return {ok:r.ok,d:d};
}
async function entrar(){
  try{
    var x=await auth("token?grant_type=password");
    if(!x.ok){$("lm").textContent="Erro: "+(x.d.msg||x.d.error_description||"email ou palavra-passe errados");return}
    guardarSessao(x.d);mostrar();
  }catch(e){$("lm").textContent="Sem ligação à internet."}
}
async function registar(){
  try{
    var x=await auth("signup");
    if(!x.ok){$("lm").textContent="Erro: "+(x.d.msg||x.d.error_description||"não foi possível criar");return}
    if(x.d.access_token){guardarSessao(x.d);mostrar()}
    else{$("lm").className="msg ok";$("lm").textContent="Conta criada. Confirme no seu email e depois toque em Entrar."}
  }catch(e){$("lm").textContent="Sem ligação à internet."}
}
function sair(){try{localStorage.removeItem("bb_tok");localStorage.removeItem("bb_uid")}catch(e){}tok=null;uid=null;$("app").classList.add("hide");$("login").classList.remove("hide")}
function mostrar(){$("login").classList.add("hide");$("app").classList.remove("hide");carregar()}
async function carregar(){
  try{
    var r=await fetch(URL_+"/rest/v1/moradas?select=*&order=created_at.desc",{headers:H()});
    if(r.status==401){sair();$("lm").textContent="Sessão expirada. Entre outra vez.";return}
    var d=await r.json();
    if(!r.ok){$("lista").innerHTML='<div class="msg">Erro: '+esc(d.message)+'</div>';return}
    if(!d.length){$("lista").innerHTML="<small>Ainda não tem moradas.</small>";return}
    $("lista").innerHTML=d.map(function(m){
      return '<div class="end"><span class="tag">'+(m.tipo==="internacional"?"Internacional":"Entrega")+'</span><br><b>'+esc(m.nome)+'</b> · '+esc(m.telefone)+'<br>'+esc(m.detalhe)+', '+esc(m.cidade)+', '+esc(m.provincia)+', '+esc(m.pais)+' '+esc(m.codigo_postal)+(m.marca_envio?'<br>Marca: '+esc(m.marca_envio):'')+'<button class="sec" onclick="apagar(\''+m.id+'\')">Apagar</button></div>';
    }).join("");
  }catch(e){$("lista").innerHTML='<div class="msg">Sem ligação à internet.</div>'}
}
async function guardar(){
  var d={user_id:uid,tipo:$("tipo").value,nome:$("nome").value.trim(),telefone:$("telefone").value.trim(),pais:$("pais").value,provincia:$("provincia").value,cidade:$("cidade").value.trim(),codigo_postal:$("codigo_postal").value.trim(),detalhe:$("detalhe").value.trim(),marca_envio:$("marca_envio").value.trim()};
  if(!d.nome||!d.telefone||!d.cidade||!d.detalhe){$("m").className="msg";$("m").textContent="Preencha nome, telemóvel, cidade e morada detalhada.";return}
  try{
    var r=await fetch(URL_+"/rest/v1/moradas",{method:"POST",headers:H({"Prefer":"return=minimal"}),body:JSON.stringify(d)});
    if(!r.ok){var e=await r.json();$("m").className="msg";$("m").textContent="Erro: "+(e.message||"não guardou");return}
    $("m").className="msg ok";$("m").textContent="Morada guardada.";
    ["nome","telefone","cidade","codigo_postal","detalhe","marca_envio"].forEach(function(i){$(i).value=""});
    carregar();
  }catch(e){$("m").className="msg";$("m").textContent="Sem ligação à internet."}
}
async function apagar(id){
  if(!confirm("Apagar esta morada?"))return;
  await fetch(URL_+"/rest/v1/moradas?id=eq."+id,{method:"DELETE",headers:H()});
  carregar();
}
paises();
try{tok=localStorage.getItem("bb_tok");uid=localStorage.getItem("bb_uid")}catch(e){}
if(tok&&uid)mostrar();
</script>
</body>
</html>
