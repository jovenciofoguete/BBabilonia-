<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ver produto · Painel do vendedor · B-Babilônia</title>
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<style>
:root{--fundo:#f1effb;--texto:#1b1740;--suave:#6b7280;--linha:#ece9f7;--roxo:#7c3aed;--roxo2:#5b21b6}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto);line-height:1.4;padding-bottom:40px}
.topo{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1e1b4b,#5b21b6 60%,#9333ea);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px}
.topo a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:#ffffff26;border-radius:999px;padding:7px 13px;white-space:nowrap}
.topo b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aviso{background:#fef3c7;color:#92400e;font-size:13px;padding:9px 12px}
.fotos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#fff;scrollbar-width:none}
.fotos::-webkit-scrollbar{display:none}
.fotos img,.fotos video{flex:none;width:100%;max-height:70vh;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:start;background:#fafafa}
.nf{font-size:12px;color:var(--suave);text-align:center;padding:4px;background:#fff}
main{max-width:720px;margin:0 auto;padding:0 12px}
.cx{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 4px 14px #4c1d9514}
h1{font-size:18px;font-weight:700}
.pv{font-size:22px;font-weight:800;margin-top:4px}
.mt{font-size:13px;color:var(--suave);margin-top:4px}
.bdg{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;margin-right:6px}
.ok{background:#d1fae5;color:#047857}.oc{background:#e5e7eb;color:#374151}.er{background:#fee2e2;color:#b91c1c}
h2{font-size:15px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-top:1px solid var(--linha);padding:7px 4px;text-align:left;vertical-align:top}
th{color:var(--suave);font-weight:600;width:40%}
.cor{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--linha)}
.cor:first-of-type{border-top:0}
.cor img,.cor .sf{flex:none;width:52px;height:52px;border-radius:8px;object-fit:cover;background:#f3f3f3;display:grid;place-items:center;font-size:10px;color:#999}
.cor b{display:block;font-size:14px}
.tm{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tm span{border:1px solid var(--linha);border-radius:7px;padding:3px 8px;font-size:12.5px}
.tm span.z{color:#b91c1c;border-color:#fecaca}
.ds{white-space:pre-wrap;font-size:14px}
.bts{display:grid;gap:8px;margin-top:12px}
.bts a{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:12px;font-weight:700;font-size:15px;background:#f3f0ff;color:var(--roxo2)}
.bts a.p{background:var(--roxo);color:#fff}
.estado{text-align:center;color:var(--suave);padding:40px 16px}
</style>
</head>
<body>
<div class="topo"><a id="voltar" href="painel-vendedor-v2.html">← Painel</a><b id="tit">Ver produto</b></div>
<div class="aviso">Modo de visualização do vendedor: comprar, carrinho e chat são só para clientes.</div>
<div id="conteudo"><div class="estado">A carregar…</div></div>
<script>
(function(){
var SB="https://dsfoqoeawvjafypycldz.supabase.co",KEY="sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0",SK="sb-dsfoqoeawvjafypycldz-auth-token";
var $=function(i){return document.getElementById(i)};
var PAINEL=/^suppliers\./i.test(location.hostname)?"/":"painel-vendedor-v2.html";
$("voltar").href=PAINEL;
var id=new URLSearchParams(location.search).get("id")||"";
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function sessao(){try{var s=JSON.parse(localStorage.getItem(SK)||"null");return s&&s.access_token?s:null}catch(e){return null}}
function arr(x){if(typeof x==="string"){try{x=JSON.parse(x)}catch(e){return x?[x]:[]}}return Array.isArray(x)?x:[]}
function obj(x){if(typeof x==="string"){try{x=JSON.parse(x)}catch(e){return null}}return x&&typeof x==="object"?x:null}
function url(a){return typeof a==="string"?a:(a&&(a.url||a.src||a.image_url||a.foto))||""}
function num(v){return Number(v||0).toLocaleString("pt-PT",{maximumFractionDigits:2})}
async function get(caminho,token){
 var r=await fetch(SB+"/rest/v1/"+caminho,{headers:{apikey:KEY,Authorization:"Bearer "+(token||KEY)}});
 if(!r.ok)throw new Error(String(r.status));return r.json();
}
function fotos(p){
 var out=[];function add(u){if(u&&out.indexOf(u)<0)out.push(u)}
 arr(p.images).forEach(function(a){add(url(a))});add(p.image_url);return out;
}
function variantes(p){
 return arr(p.variants).map(function(v){return{cor:String(v.cor||v.color||v.colour||"").trim(),tam:String(v.tamanho||v.size||"").trim(),st:(v.stock!=null?v.stock:(v.quantity!=null?v.quantity:v.qtd)),foto:url(v.foto||v.image||v.imagem||v.image_url||v.img)}});
}
function fotoCor(p,cor,vs){
 for(var i=0;i<vs.length;i++)if(vs[i].cor===cor&&vs[i].foto)return vs[i].foto;
 var cs=arr(p.colors);for(var j=0;j<cs.length;j++){var c=cs[j];if(c&&typeof c==="object"&&String(c.nome||c.name||c.cor||"").trim()===cor)return url(c.foto||c.image||c.url)}
 return "";
}
function stockTotal(p,vs){
 if(vs.length)return vs.reduce(function(s,v){return s+(Number(v.st)||0)},0);
 return Number(p.stock||p.quantity||p.qtd||0);
}
function tabela(o){
 var o2=obj(o);if(!o2)return "";
 var linhas=Object.keys(o2).filter(function(k){var v=o2[k];return v!=null&&v!==""&&!(Array.isArray(v)&&!v.length)}).map(function(k){var v=o2[k];return"<tr><th>"+esc(k)+"</th><td>"+esc(Array.isArray(v)?v.join(", "):(typeof v==="object"?JSON.stringify(v):v))+"</td></tr>"});
 return linhas.length?"<table>"+linhas.join("")+"</table>":"";
}
async function iniciar(){
 var s=sessao();
 if(!s){location.replace("https://bbabilonia.com/produto-bbabilonia.html"+location.search);return}
 if(!id){$("conteudo").innerHTML='<div class="estado">Falta o produto no link.</div>';return}
 var p=null,cats=[];
 try{var r=await get("products?id=eq."+encodeURIComponent(id)+"&select=*",s.access_token);p=r[0]||null}catch(e){}
 if(!p){try{var r2=await get("products?id=eq."+encodeURIComponent(id)+"&select=*");p=r2[0]||null}catch(e){}}
 if(!p){$("conteudo").innerHTML='<div class="estado">Produto não encontrado.</div>';return}
 try{cats=await get("categories?select=id,name,parent_id&limit=5000")}catch(e){cats=[]}
 var caminho=[],c=cats.filter(function(x){return x.id===p.category_id})[0],n=0;
 while(c&&n<8){caminho.unshift(c.name);c=cats.filter(function(x){return x.id===c.parent_id})[0];n++}
 var meu=s.user&&String(p.supplier_id)===String(s.user.id);
 var fs=fotos(p),vs=variantes(p),st=stockTotal(p,vs),pub=p.active!==false,m=Number(p.pedido_minimo||p.min_order||1);
 document.title=(p.name||"Produto")+" · Ver produto";$("tit").textContent=p.name||"Produto";
 var porCor={},ordem=[];
 vs.forEach(function(v){var k=v.cor||"—";if(!porCor[k]){porCor[k]=[];ordem.push(k)}porCor[k].push(v)});
 var h="";
 if(fs.length||p.video_url){
  h+='<div class="fotos">'+fs.map(function(u){return'<img alt="'+esc(p.name)+'" src="'+esc(u)+'">'}).join("")+(p.video_url?'<video controls playsinline preload="metadata" src="'+esc(p.video_url)+'"></video>':"")+"</div>";
  h+='<div class="nf">'+fs.length+(fs.length===1?" foto":" fotos")+(p.video_url?" · 1 vídeo":"")+(fs.length+(p.video_url?1:0)>1?" · deslize para o lado":"")+"</div>";
 }
 h+="<main>";
 h+='<div class="cx"><h1>'+esc(p.name||"Produto")+'</h1><div class="pv">'+num(p.price)+" "+esc(p.currency||"MZN")+'</div>'+
  '<div class="mt"><span class="bdg '+(pub?"ok":"oc")+'">'+(pub?"Publicado":"Oculto")+'</span><span class="bdg '+(st>0?"ok":"er")+'">'+(st>0?"Stock "+num(st):"Sem stock")+"</span></div>"+
  '<div class="mt">Pedido mínimo: '+m+(m===1?" peça":" peças")+(caminho.length?" · "+esc(caminho.join(" › ")):"")+"</div>"+
  (meu?"":'<div class="mt" style="color:#b45309">Este produto não é da sua loja (só para ver).</div>')+"</div>";
 if(ordem.length){
  h+='<div class="cx"><h2>Cores, tamanhos e stock</h2>'+ordem.map(function(cor){
   var f=fotoCor(p,cor,vs);
   return '<div class="cor">'+(f?'<img loading="lazy" alt="" src="'+esc(f)+'">':'<div class="sf">Sem foto</div>')+"<div><b>"+esc(cor)+'</b><div class="tm">'+porCor[cor].map(function(v){var z=v.st!=null&&Number(v.st)<=0;return'<span'+(z?' class="z"':"")+">"+esc(v.tam||"Único")+(v.st!=null?" · "+num(v.st):"")+"</span>"}).join("")+"</div></div></div>";
  }).join("")+"</div>";
 }
 var sp=tabela(p.specs),op=tabela(p.opcoes);
 if(sp)h+='<div class="cx"><h2>Especificações</h2>'+sp+"</div>";
 if(op)h+='<div class="cx"><h2>Opções para o cliente escolher</h2>'+op+"</div>";
 if(p.description||p.descricao)h+='<div class="cx"><h2>Descrição</h2><p class="ds">'+esc(p.description||p.descricao)+"</p></div>";
 h+='<div class="bts">'+(meu?'<a class="p" href="'+PAINEL+'#produtos">✏️ Editar nome, preço ou ocultar</a><a href="detalhes-fornecedor.html">📝 Detalhes e opções obrigatórias</a>':"")+'<a href="'+PAINEL+'">← Voltar ao painel</a></div>';
 h+="</main>";
 $("conteudo").innerHTML=h;
}
iniciar();
})();
</script>
</body>
</html>
