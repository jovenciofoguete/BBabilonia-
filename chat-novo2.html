<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat - BBabilônia</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style></head>
<body><iframe id="cn2"></iframe>
<script>document.getElementById("cn2").src="chat-novo.html"+location.search+location.hash;</script>
<script>
var vistos=new WeakMap();
function vermelho(c){var m=c.match(/\d+/g);return m&&+m[0]>150&&+m[1]<90&&+m[2]<90}
function varre(doc){
 try{
  var els=doc.body.getElementsByTagName('*');
  for(var i=0;i<els.length;i++){var e=els[i];
   if(e.tagName=='IFRAME'){if(e.contentDocument)varre(e.contentDocument);continue}
   if(e.children.length||!e.textContent.trim())continue;
   if(e.closest('button,a,input,textarea,select,label'))continue;
   if(!/recusad|bloquead|não pode|nao pode|contacto|link|rede/i.test(e.textContent))continue;
   if(!vermelho(doc.defaultView.getComputedStyle(e).color))continue;
   var v=vistos.get(e);
   if(!v||v.t!==e.textContent){vistos.set(e,{t:e.textContent,h:Date.now()})}
   else if(Date.now()-v.h>4000){e.textContent='';vistos.delete(e)}
  }
 }catch(x){}
}
setInterval(function(){varre(document)},700);
</script></body></html>
