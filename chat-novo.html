<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat - BBabilônia</title>
<style>html,body{margin:0;height:100%;background:#fff}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="c"></iframe>
<script>
var f=document.getElementById("c");
f.addEventListener("load",function(){
  try{
    var d=f.contentDocument;
    if(d.getElementById("bb-filtro"))return;
    var l=["filtro-contactos-v2.js?v=3","filtro-local-africa.js?v=1","chat-privado.js?v=1","imagem-rapida-v2.js?v=1","chat-extra.js?v=1","chat-pagamento.js?v=1","chat-pagamento-fotos.js?v=1","chat-traducao.js?v=1","chat-perguntas.js?v=1","chat-melhorias.js?v=1","chat-fotos.js?v=1","chat-media.js?v=1","chat-sessao.js?v=1","pais-cliente.js?v=1","chat-mocambique.js?v=1"];
    /* (07/11/2026) o modo funcionário (responder em nome da loja) só no domínio do fornecedor; em bbabilonia.com todos são clientes comuns */
    /* (14/11/2026) filtro-local-africa.js: com fornecedores de África não passa localização, endereço, ruas nem encontros. chat-mocambique.js: fornecedor e cliente em Moçambique — sem link de pagamento e sem partilha do endereço de entrega. pais-cliente.js: sem o país do cliente escolhido, "Compartilhar endereço de entrega" fica inativo */
    if(/^(suppliers|fornecedor|supplies)\./i.test(location.hostname))l.splice(3,0,"chat-funcionario.js?v=1");
    for(var i=0;i<l.length;i++){
      var s=d.createElement("script");
      if(i===0)s.id="bb-filtro";
      s.async=false;
      s.src=l[i];
      d.body.appendChild(s);
    }
  }catch(e){}
});
f.src="chat.html"+location.search+location.hash;
</script>
</body>
</html>
<script>document.getElementById("c").addEventListener("load",function(){var d=this.contentDocument;if(d&&!d.getElementById("bb-cc")){var s=d.createElement("script");s.id="bb-cc";s.async=false;s.src="chat-compacto.js?v=1";d.body.appendChild(s)}})</script>
