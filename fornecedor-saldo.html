<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saldo e notificações | B-Babilônia</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1219;color:#e9ecf2;font-family:system-ui,sans-serif}header{background:#0f1a3d;padding:16px;font-weight:700;font-size:22px}header b{color:#d9a93f}main{max-width:520px;margin:auto;padding:16px}label{display:block;margin:12px 0 4px;font-size:14px;color:#aab}input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #2b3350;background:#161b27;color:#fff;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:8px;background:#d9a93f;color:#111;font-weight:700;font-size:17px}.box{background:#161b27;border-radius:10px;padding:14px;margin:12px 0}.ok{color:#2e9d62}.err{color:#ff7a7a}small{color:#99a}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script></head><body>
<header><b style="color:#fff">B-</b><b>Babilônia</b> <small>Fornecedor</small></header>
<main>
<div id="login"><label>Email</label><input id="e" type="email"><label>Palavra-passe</label><input id="s" type="password"><button id="entrar">Entrar</button><p id="m" class="err"></p></div>
<div id="app" hidden>
<div class="box"><b>Saldo retido</b> <small>(pago, aguarda entrega)</small><div id="ret" style="font-size:24px;margin-top:6px"></div></div>
<div class="box"><b>Entregue</b> <small>(a aguardar libertação)</small><div id="ent" style="font-size:20px;margin-top:6px"></div></div>
<h3>Notificações</h3><div id="nots"></div>
<h3>Pedidos pagos</h3><div id="peds"></div>
</div></main>
<script>
const sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0');
const $=i=>document.getElementById(i);
const val=o=>Number(o.supplier_amount||o.subtotal||o.total);const soma=(l,st)=>{const t={};l.filter(o=>o.escrow_status===st).forEach(o=>t[o.currency]=(t[o.currency]||0)+val(o));return Object.entries(t).map(([c,v])=>v+' '+c).join(' · ')||'0';};
async function carregar(){
  $('login').hidden=true;$('app').hidden=false;
  const {data:o}=await sb.from('orders').select('*').in('payment_status',['pago']).order('paid_at',{ascending:false});
  const L=o||[];$('ret').textContent=soma(L,'retido');$('ent').textContent=soma(L,'entregue');
  $('peds').innerHTML=L.map(x=>`<div class="box"><b>${x.customer_name}</b> — ${val(x)} ${x.currency}<br><small>${x.delivery_address||''}</small><br>Estado: ${x.escrow_status}${x.escrow_status==='retido'?`<button onclick="entregar('${x.id}')">Marcar como entregue</button>`:''}</div>`).join('')||'<small>Sem pedidos pagos.</small>';
  const {data:n}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(20);
  $('nots').innerHTML=(n||[]).map(x=>`<div class="box"><b>${x.title}</b><br>${x.message}<br><small>${new Date(x.created_at).toLocaleString()}</small></div>`).join('')||'<small>Sem notificações.</small>';
}
async function entregar(id){if(!confirm('Confirma que os produtos foram entregues?'))return;await sb.rpc('marcar_entregue',{p_id:id});carregar();}
$('entrar').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('e').value,password:$('s').value});if(error)$('m').textContent='Email ou palavra-passe errados.';else carregar();};
sb.auth.getSession().then(({data})=>{if(data.session)carregar();});
setInterval(()=>{if(!$('app').hidden)carregar();},30000);
</script></body></html>
