<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos dos clientes • BBabilônia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--fundo:#eef6f4;--papel:#fff;--texto:#14233a;--suave:#5d6b7c;--linha:#dde8ec;--verde:#0f9d58;--azul:#1565c0;--erro:#c62828}
@media (prefers-color-scheme:dark){:root{--fundo:#0e1620;--papel:#17222e;--texto:#eef3f8;--suave:#9fb0c2;--linha:#26384a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);padding-bottom:90px}
.capa{background:linear-gradient(135deg,var(--verde),var(--azul));color:#fff;padding:22px 16px 18px}
.capa h1{margin:0 0 4px;font-size:21px}.capa p{margin:0 0 14px;font-size:13.5px;opacity:.9}
.busca{display:flex;gap:8px}
.busca input{flex:1;padding:12px;border:0;border-radius:12px;font:inherit;font-size:15px}
.abas{display:flex;gap:8px;padding:12px 16px 0;max-width:640px;margin:auto}
.abas button{flex:1;padding:10px;border:1px solid var(--linha);border-radius:20px;background:var(--papel);color:var(--texto);font:inherit;font-weight:600}
.abas button.on{background:var(--azul);border-color:var(--azul);color:#fff}
main{max-width:640px;margin:auto;padding:12px 16px}
.novo{width:100%;padding:14px;border:0;border-radius:14px;color:#fff;font:inherit;font-size:16px;font-weight:700;background:linear-gradient(90deg,var(--verde),var(--azul));margin-bottom:12px}
.cx{background:var(--papel);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #0001}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--linha);border-radius:10px;font:inherit;font-size:15px;background:var(--papel);color:var(--texto)}
textarea{min-height:90px;resize:vertical}
.btn{padding:12px 16px;border:0;border-radius:10px;font:inherit;font-weight:700;background:var(--azul);color:#fff}
.btn.v{background:var(--verde)}.btn.s{background:none;color:var(--suave);border:1px solid var(--linha)}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.msg{font-size:13.5px;margin-top:8px;color:var(--suave)}.msg.e{color:var(--erro)}
.fotos{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.fotos img{height:150px;max-width:70vw;border-radius:10px;object-fit:cover;flex:none}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.prev div{position:relative}.prev img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.prev button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:#000a;color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;font-size:12.5px}
.meta span{background:var(--fundo);border-radius:20px;padding:4px 10px;color:var(--suave)}
.meta .fechada{background:#fdecea;color:var(--erro)}
.texto{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.45}
.coms{border-top:1px solid var(--linha);margin-top:10px;padding-top:8px}
.com{padding:8px 0;border-bottom:1px solid var(--linha);font-size:14px}
.com b{color:var(--azul)}.com small{color:var(--suave);margin-left:6px}
.com .txt{white-space:pre-wrap;word-break:break-word;margin:3px 0 6px}
.chat{display:inline-block;padding:7px 12px;border-radius:20px;background:var(--verde);color:#fff;text-decoration:none;font-size:13px;font-weight:700}
.vazio{text-align:center;color:var(--suave);padding:30px 10px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="capa">
  <h1>Pedidos dos clientes</h1>
  <p>Publique o que procura e os fornecedores aprovados respondem aqui.</p>
  <div class="busca"><input id="q" placeholder="🔍 Pesquisar pedidos (ex.: congelador, vestido)"></div>
</div>
<div class="abas"><button data-a="todas" class="on">Todos os pedidos</button><button data-a="minhas">Os meus pedidos</button></div>
<main>
  <button class="novo" id="abrirNovo">+ Publicar o que procuro</button>

  <div class="cx hide" id="login">
    <b>Entre na sua conta</b>
    <label>Email</label><input id="em" type="email" autocomplete="email">
    <label>Palavra-passe</label><input id="pw" type="password" autocomplete="current-password">
    <div class="linha"><button class="btn" id="entrar">Entrar</button><button class="btn s" id="criar">Criar conta</button></div>
    <div class="msg" id="lmsg"></div>
  </div>

  <div class="cx hide" id="form">
    <b>Publicar o que procuro</b>
    <label>O que procura? *</label>
    <textarea id="ptexto" placeholder="Escreva o que procura: produto, cor, tamanho, modelo…"></textarea>
    <label>Quantidade</label><input id="pqtd" placeholder="Ex.: 10 unidades, 2 caixas">
    <label>Categoria (opcional)</label><input id="pcat" list="cats" placeholder="Toque e escreva para pesquisar"><datalist id="cats"></datalist>
    <label>País onde está</label><input id="ppais" placeholder="Ex.: Moçambique">
    <label>Fotos (até 6)</label>
    <button class="btn s" id="addFoto" type="button">+ Adicionar fotos</button>
    <input type="file" id="ficheiros" accept="image/jpeg,image/png,image/webp" multiple hidden>
    <div class="prev" id="prev"></div>
    <div class="linha"><button class="btn v" id="publicar">Enviar</button><button class="btn s" id="cancelar" type="button">Cancelar</button></div>
    <div class="msg" id="pmsg"></div>
  </div>

  <div id="lista"><div class="vazio">A carregar…</div></div>
</main>

<script src="filtro-contactos.js"></script>
<script src="imagem-filtro.js"></script>
<script>
var sb = supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co', 'sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0');
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var user=null, loja=null, pubs=[], coms={}, aba='todas', fotos=[], abertos={}, aVerificar=0;

/* Filtro de contactos: usa o filtro mais forte (v2) e, se falhar, o normal */
var proibido = function(t){ try{ return window.FiltroContactos ? !window.FiltroContactos.verificar(t).ok : false }catch(e){ return false } };
fetch('filtro-contactos-v2.js').then(function(r){return r.ok?r.text():''}).then(function(src){
  if(!src||src.indexOf('function proibido(txt){')<0)return;
  (0,eval)(src.replace('function proibido(txt){','window.__bbProibido=proibido;function proibido(txt){'));
  if(typeof window.__bbProibido==='function'){var v1=proibido;proibido=function(t){return window.__bbProibido(t)||v1(t)}}
}).catch(function(){});
var AVISO='Não é permitido enviar contactos, links, redes sociais ou convites para fora da BBabilônia.';

function quando(d){
  var s=(Date.now()-new Date(d).getTime())/1000;
  if(s<60)return 'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';
  if(s<604800)return Math.floor(s/86400)+' dias';return new Date(d).toLocaleDateString('pt-PT');
}

async function sessao(){
  var r=await sb.auth.getSession(); user=r.data.session?r.data.session.user:null; loja=null;
  if(user){var l=await sb.from('lojas').select('nome,estado').eq('dono_id',user.id).maybeSingle(); if(l.data&&l.data.estado==='aprovada')loja=l.data;}
}

async function carregar(){
  var r=await sb.from('publicacoes').select('*').order('created_at',{ascending:false}).limit(100);
  if(r.error){$('lista').innerHTML='<div class="vazio">Não foi possível carregar: '+esc(r.error.message)+'</div>';return}
  pubs=r.data||[]; coms={};
  if(pubs.length){
    var c=await sb.from('publicacao_comentarios').select('*').in('publicacao_id',pubs.map(function(p){return p.id})).order('created_at');
    (c.data||[]).forEach(function(x){(coms[x.publicacao_id]=coms[x.publicacao_id]||[]).push(x)});
  }
  desenhar();
}

function desenhar(){
  var q=($('q').value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  var l=pubs.filter(function(p){
    if(aba==='minhas'&&(!user||p.user_id!==user.id))return false;
    if(!q)return true;
    return (p.texto+' '+(p.categoria||'')+' '+(p.pais||'')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').indexOf(q)>-1;
  });
  if(!l.length){$('lista').innerHTML='<div class="vazio">'+(aba==='minhas'?(user?'Ainda não publicou nenhum pedido.':'Entre na sua conta para ver os seus pedidos.'):'Nenhum pedido encontrado.')+'</div>';return}
  $('lista').innerHTML=l.map(cartao).join('');
}

function cartao(p){
  var meu=user&&p.user_id===user.id, cs=coms[p.id]||[], h='<div class="cx" data-p="'+p.id+'">';
  if(p.fotos&&p.fotos.length)h+='<div class="fotos">'+p.fotos.map(function(u){return '<img src="'+esc(u)+'" alt="" loading="lazy">'}).join('')+'</div>';
  h+='<div class="texto">'+esc(p.texto)+'</div><div class="meta">';
  if(p.quantidade)h+='<span>📦 '+esc(p.quantidade)+'</span>';
  if(p.categoria)h+='<span>🏷️ '+esc(p.categoria)+'</span>';
  if(p.pais)h+='<span>📍 '+esc(p.pais)+'</span>';
  h+='<span>🕒 '+quando(p.created_at)+'</span>';
  if(p.estado==='fechada')h+='<span class="fechada">Fechado</span>';
  h+='</div><div class="linha"><button class="btn s" data-acao="coms">💬 '+cs.length+' resposta'+(cs.length===1?'':'s')+'</button>';
  if(meu)h+='<button class="btn s" data-acao="estado">'+(p.estado==='fechada'?'Reabrir':'Fechar pedido')+'</button><button class="btn s" data-acao="apagar">Apagar</button>';
  h+='</div>';
  if(abertos[p.id]){
    h+='<div class="coms">';
    if(!cs.length)h+='<div class="msg">Ainda sem respostas.</div>';
    cs.forEach(function(c){
      var forn=c.user_id!==p.user_id;
      h+='<div class="com"><b>'+esc(forn?(c.loja_nome||'Fornecedor'):'Cliente')+'</b><small>'+quando(c.created_at)+'</small><div class="txt">'+esc(c.texto)+'</div>';
      if(meu&&forn)h+='<a class="chat" target="_top" href="chat-novo2.html?vendedor='+encodeURIComponent(c.user_id)+'&assunto='+encodeURIComponent('Pedido: '+p.texto.slice(0,50))+'">💬 Conversar com este fornecedor</a>';
      if(user&&c.user_id===user.id)h+=' <button class="btn s" style="padding:6px 10px" data-acao="apagarCom" data-c="'+c.id+'">Apagar</button>';
      h+='</div>';
    });
    if(p.estado!=='fechada'&&user&&(loja||meu))h+='<div class="linha"><input data-com="'+p.id+'" placeholder="Escreva a sua resposta…" maxlength="1000" style="flex:1"><button class="btn" data-acao="comentar">Enviar</button></div><div class="msg" data-cm="'+p.id+'"></div>';
    else if(p.estado!=='fechada'&&!meu)h+='<div class="msg">'+(user?'Só fornecedores com loja aprovada podem responder.':'Entre como fornecedor aprovado para responder.')+'</div>';
    h+='</div>';
  }
  return h+'</div>';
}

$('lista').addEventListener('click',async function(e){
  var b=e.target.closest('[data-acao]');if(!b)return;
  var card=b.closest('[data-p]'),id=card.getAttribute('data-p'),p=pubs.filter(function(x){return x.id===id})[0],a=b.getAttribute('data-acao');
  if(a==='coms'){abertos[id]=!abertos[id];desenhar();return}
  if(a==='estado'){var n=p.estado==='fechada'?'aberta':'fechada';var r=await sb.from('publicacoes').update({estado:n}).eq('id',id);if(r.error)return alert(r.error.message);p.estado=n;desenhar();return}
  if(a==='apagar'){if(!confirm('Apagar este pedido e as respostas?'))return;var r2=await sb.from('publicacoes').delete().eq('id',id);if(r2.error)return alert(r2.error.message);pubs=pubs.filter(function(x){return x.id!==id});desenhar();return}
  if(a==='apagarCom'){var cid=b.getAttribute('data-c');var r3=await sb.from('publicacao_comentarios').delete().eq('id',cid);if(r3.error)return alert(r3.error.message);coms[id]=(coms[id]||[]).filter(function(x){return x.id!==cid});desenhar();return}
  if(a==='comentar'){
    var inp=card.querySelector('[data-com]'),m=card.querySelector('[data-cm]'),t=(inp.value||'').trim();
    if(!t)return;
    if(proibido(t)){m.className='msg e';m.textContent=AVISO;return}
    b.disabled=true;
    var r4=await sb.from('publicacao_comentarios').insert({publicacao_id:id,texto:t,loja_nome:loja?loja.nome:null}).select().single();
    b.disabled=false;
    if(r4.error){m.className='msg e';m.textContent='Não foi possível enviar: '+r4.error.message;return}
    (coms[id]=coms[id]||[]).push(r4.data);desenhar();
  }
});

/* ---------- publicar ---------- */
function mostrarForm(){
  $('login').classList.toggle('hide',!!user);$('form').classList.toggle('hide',!user);
  if(user&&!$('cats').children.length)carregarCategorias();
  if(user&&!$('ppais').value){try{var pr=JSON.parse(localStorage.getItem('bb_prefs')||'{}');if(pr.pais){$('ppais').value=new Intl.DisplayNames(['pt'],{type:'region'}).of(pr.pais)}}catch(e){}}
}
$('abrirNovo').onclick=function(){mostrarForm();window.scrollTo({top:$('abrirNovo').offsetTop-10,behavior:'smooth'})};
$('cancelar').onclick=function(){$('form').classList.add('hide')};
async function carregarCategorias(){
  var r=await sb.from('categories').select('id,name,parent_id').limit(5000);var d=r.data||[],m={},filhos={};
  d.forEach(function(c){m[c.id]=c;filhos[c.parent_id]=1});
  $('cats').innerHTML=d.filter(function(c){return !filhos[c.id]}).map(function(c){var o=[],n=0,x=c;while(x&&n++<6){o.unshift(x.name);x=m[x.parent_id]}return o.join(' › ')}).sort().map(function(t){return '<option value="'+esc(t)+'">'}).join('');
}
$('entrar').onclick=async function(){
  var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(r.error){$('lmsg').className='msg e';$('lmsg').textContent='Email ou palavra-passe errados.';return}
  await sessao();mostrarForm();desenhar();
};
$('criar').onclick=async function(){
  var r=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value});
  $('lmsg').className='msg'+(r.error?' e':'');$('lmsg').textContent=r.error?r.error.message:'Conta criada. Toque em Entrar.';
};
$('addFoto').onclick=function(){$('ficheiros').click()};
$('ficheiros').onchange=async function(e){
  var fs=[].slice.call(e.target.files);e.target.value='';
  for(var i=0;i<fs.length;i++){
    if(fotos.length>=6){aviso('Pode adicionar até 6 fotos.',1);break}
    aVerificar++;aviso('A verificar a foto '+(i+1)+' de '+fs.length+'…');
    var v=window.FiltroImagem?await window.FiltroImagem.verificar(fs[i],function(t){aviso(t)}):{ok:true};
    aVerificar--;
    if(!v.ok){aviso(v.motivo,1);continue}
    fotos.push({file:fs[i],prev:URL.createObjectURL(fs[i])});prevs();aviso('');
  }
};
function prevs(){$('prev').innerHTML=fotos.map(function(f,i){return '<div><img src="'+f.prev+'" alt=""><button type="button" data-i="'+i+'">×</button></div>'}).join('')}
$('prev').onclick=function(e){var b=e.target.closest('button');if(!b)return;fotos.splice(+b.getAttribute('data-i'),1);prevs()};
function aviso(t,erro){$('pmsg').className='msg'+(erro?' e':'');$('pmsg').textContent=t}
$('publicar').onclick=async function(){
  var t=$('ptexto').value.trim(),extra=[$('pqtd').value,$('pcat').value,$('ppais').value].join(' ');
  if(t.length<5)return aviso('Escreva o que procura (pelo menos 5 letras).',1);
  if(proibido(t)||proibido(extra))return aviso(AVISO,1);
  if(aVerificar)return aviso('Espere: ainda estamos a verificar as fotos.',1);
  var b=$('publicar');b.disabled=true;
  try{
    var urls=[];
    for(var i=0;i<fotos.length;i++){
      aviso('A enviar foto '+(i+1)+' de '+fotos.length+'…');
      var f=fotos[i].file,c=user.id+'/pedido-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'-'+f.name.replace(/[^\w.]/g,'_');
      var up=await sb.storage.from('produtos').upload(c,f);if(up.error)throw new Error('foto '+(i+1)+': '+up.error.message);
      urls.push(sb.storage.from('produtos').getPublicUrl(c).data.publicUrl);
    }
    aviso('A publicar…');
    var r=await sb.from('publicacoes').insert({texto:t,fotos:urls,quantidade:$('pqtd').value.trim()||null,categoria:$('pcat').value.trim()||null,pais:$('ppais').value.trim()||null}).select().single();
    if(r.error)throw new Error(r.error.message);
    pubs.unshift(r.data);fotos=[];prevs();$('ptexto').value='';$('pqtd').value='';$('pcat').value='';
    aviso('Pedido publicado ✓');setTimeout(function(){$('form').classList.add('hide');aviso('')},1500);desenhar();
  }catch(e){aviso('Não foi possível publicar: '+(e.message||e),1)}
  b.disabled=false;
};

/* ---------- abas e pesquisa ---------- */
[].forEach.call(document.querySelectorAll('.abas button'),function(b){b.onclick=function(){
  [].forEach.call(document.querySelectorAll('.abas button'),function(x){x.classList.toggle('on',x===b)});aba=b.getAttribute('data-a');desenhar();
}});
$('q').addEventListener('input',desenhar);

sessao().then(carregar).catch(function(e){$('lista').innerHTML='<div class="vazio">Erro: '+esc(e.message)+'</div>'});
setInterval(function(){if(!document.hidden&&!document.querySelector('[data-com]:focus')&&$('form').classList.contains('hide'))carregar().catch(function(){})},30000);
</script>
<script src="menu-babilonia.js"></script>
</body>
                                 </html>
