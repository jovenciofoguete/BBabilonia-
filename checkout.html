<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizar compra | BBabilônia</title>
<style>
  :root{--bg:#ffffff;--text:#1a1a1a;--muted:#6b6b6b;--line:#dcdcdc;--brand:#111;--danger:#b3261e;--ok:#1b6e3c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
  main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  a.voltar{color:var(--muted);font-size:.95rem}
  h1{font-size:1.5rem;margin:12px 0 16px}
  h2{font-size:1.15rem;margin:24px 0 8px}
  .resumo{border:1px solid var(--line);border-radius:14px;padding:12px 16px}
  .res-linha{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .res-linha small{display:block;color:var(--muted)}
  .res-total{display:flex;justify-content:space-between;font-weight:700;padding-top:12px;font-size:1.05rem}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input[type=text],input[type=tel],input[type=email],textarea{width:100%;padding:12px;font-size:1rem;border:1px solid var(--line);border-radius:10px;font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  .pag{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;font-weight:600}
  .pag input{width:20px;height:20px}
  .pag.sel{border:2px solid var(--brand);background:#f6f6f6}
  .nota{color:var(--muted);font-size:.95rem;margin:4px 0 12px}
  .erro{color:var(--danger);margin:12px 0}
  .erro small{display:block;color:var(--muted);margin-top:4px;word-break:break-word}
  button.enviar{width:100%;padding:16px;font-size:1.05rem;font-weight:700;color:#fff;background:var(--brand);border:0;border-radius:12px;cursor:pointer}
  button.enviar:disabled{opacity:.6}
  .sucesso{text-align:center;padding:40px 8px}
  .sucesso h1{color:var(--ok)}
  .sucesso a{display:inline-block;margin-top:16px;color:var(--brand);font-weight:700}
  button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #2a6df4;outline-offset:2px}
</style>
</head>
<body>
<main id="app">
  <a class="voltar" href="carrinho.html">← Voltar ao carrinho</a>
  <h1>Finalizar compra</h1>

  <div class="resumo" id="resumo"></div>

  <h2>Os seus dados</h2>
  <label for="nome">Nome completo</label>
  <input type="text" id="nome" autocomplete="name">
  <label for="tel">Telefone</label>
  <input type="tel" id="tel" autocomplete="tel">
  <label for="email">Email (opcional)</label>
  <input type="email" id="email" autocomplete="email">
  <label for="pais">País</label>
  <input type="text" id="pais" value="Moçambique" autocomplete="country-name">
  <label for="morada">Morada de entrega</label>
  <textarea id="morada" autocomplete="street-address"></textarea>

  <h2>Forma de pagamento</h2>
  <label class="pag" id="p-mpesa"><input type="radio" name="pag" value="mpesa"> M-Pesa</label>
  <label class="pag" id="p-emola"><input type="radio" name="pag" value="emola"> e-Mola</label>
  <label class="pag" id="p-cartao"><input type="radio" name="pag" value="cartao"> Cartão Visa / Mastercard</label>
  <p class="nota">Depois de enviar o pedido, entramos em contacto para confirmar o pagamento e a entrega.</p>

  <div class="erro" id="erro" hidden></div>
  <button class="enviar" id="btn">Enviar pedido</button>
</main>

<script>
var SUPABASE_URL = "https://dsfoqoeawvjafypycldz.supabase.co";
var SUPABASE_KEY = "sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0";

function ler(){
  try{ return JSON.parse(localStorage.getItem("carrinho")) || []; }catch(e){ return []; }
}
function esc(t){
  return String(t==null?"":t).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function dinheiro(v,m){
  return (Number(v)||0).toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2}) + " " + m;
}

var itens = ler();
var totais = {};
itens.forEach(function(it){
  var m = it.moeda || "MZN";
  totais[m] = (totais[m]||0) + (Number(it.preco)||0)*(Number(it.qtd)||1);
});
var moedas = Object.keys(totais);

function desenharResumo(){
  var r = document.getElementById("resumo");
  if(!itens.length){
    r.innerHTML = '<p>O carrinho está vazio. <a href="/">Ver produtos</a></p>';
    document.getElementById("btn").disabled = true;
    return;
  }
  r.innerHTML = itens.map(function(it){
    var q = Number(it.qtd)||1, m = it.moeda||"MZN";
    var det = [it.cor,it.tamanho].filter(Boolean).join(" · ");
    return '<div class="res-linha"><div>'+esc(it.nome)+' × '+q+(det?'<small>'+esc(det)+'</small>':'')+'</div><div>'+dinheiro((Number(it.preco)||0)*q,m)+'</div></div>';
  }).join("") + moedas.map(function(m){
    return '<div class="res-total"><span>Total</span><span>'+dinheiro(totais[m],m)+'</span></div>';
  }).join("");
}
desenharResumo();

document.querySelectorAll('input[name="pag"]').forEach(function(r){
  r.addEventListener("change",function(){
    document.querySelectorAll(".pag").forEach(function(l){ l.classList.remove("sel"); });
    r.closest(".pag").classList.add("sel");
  });
});

function mostrarErro(msg,detalhe){
  var e = document.getElementById("erro");
  e.innerHTML = esc(msg) + (detalhe ? '<small>'+esc(detalhe)+'</small>' : '');
  e.hidden = false;
}

document.getElementById("btn").addEventListener("click", async function(){
  var btn = this;
  document.getElementById("erro").hidden = true;

  var nome = document.getElementById("nome").value.trim();
  var tel = document.getElementById("tel").value.trim();
  var email = document.getElementById("email").value.trim();
  var pais = document.getElementById("pais").value.trim();
  var morada = document.getElementById("morada").value.trim();
  var pagEl = document.querySelector('input[name="pag"]:checked');

  if(!itens.length) return mostrarErro("O carrinho está vazio.");
  if(moedas.length > 1) return mostrarErro("O carrinho tem produtos em moedas diferentes. Faça um pedido para cada moeda.");
  if(!nome) return mostrarErro("Escreva o seu nome completo.");
  if(!tel) return mostrarErro("Escreva o seu telefone.");
  if(!morada) return mostrarErro("Escreva a morada de entrega.");
  if(!pagEl) return mostrarErro("Escolha a forma de pagamento.");

  var moeda = moedas[0];
  var total = totais[moeda];

  var pedido = {
    customer_name: nome,
    customer_phone: tel,
    customer_email: email || null,
    delivery_address: morada,
    country: pais || null,
    payment_method: pagEl.value,
    currency: moeda,
    subtotal: total,
    total: total,
    items: itens
  };

  btn.disabled = true;
  btn.textContent = "A enviar...";
  try{
    var resp = await fetch(SUPABASE_URL + "/rest/v1/orders", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(pedido)
    });
    if(!resp.ok){
      var detalhe = "";
      try{ var j = await resp.json(); detalhe = (j.message || "") + (j.details ? " – " + j.details : "") + (j.hint ? " – " + j.hint : ""); }catch(e){ detalhe = "Erro " + resp.status; }
      mostrarErro("Não foi possível enviar o pedido.", detalhe);
      btn.disabled = false; btn.textContent = "Enviar pedido";
      return;
    }
    try{ localStorage.removeItem("carrinho"); }catch(e){}
    document.getElementById("app").innerHTML =
      '<div class="sucesso"><h1>Pedido enviado</h1>'
      + '<p>Obrigado, '+esc(nome)+'. Vamos entrar em contacto pelo telefone '+esc(tel)+' para confirmar o pagamento e a entrega.</p>'
      + '<a href="/">Voltar à loja</a></div>';
  }catch(e){
    mostrarErro("Não foi possível enviar o pedido. Verifique a ligação à internet e tente outra vez.", String(e && e.message || e));
    btn.disabled = false; btn.textContent = "Enviar pedido";
  }
});
</script>
</body>
</html>
