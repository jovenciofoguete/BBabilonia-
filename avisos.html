<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisos | B-Babilônia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--fundo:#eef6fb;--papel:#fff;--texto:#0f2240;--suave:#5d6f8a;--linha:#dfe9f3;--azul:#0284c7;--verde:#10b981}
@media (prefers-color-scheme:dark){:root{--fundo:#0b1424;--papel:#132036;--texto:#eaf2ff;--suave:#97a8c4;--linha:#22324d}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);line-height:1.4;padding-bottom:90px}
.capa{background:linear-gradient(135deg,#10b981,#0ea5e9 55%,#2563eb);color:#fff;padding:22px 16px 56px;border-radius:0 0 28px 28px}
.capa a{color:#fff;text-decoration:none;font-size:14px;opacity:.9}
.capa h1{font-size:24px;margin-top:10px}.capa p{font-size:14px;opacity:.9;margin-top:4px}
main{max-width:640px;margin:-38px auto 0;padding:0 14px}
.sec{background:var(--papel);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px #0ea5e91f}
input{width:100%;padding:13px;border:1px solid var(--linha);border-radius:12px;font-size:16px;margin-bottom:10px;background:var(--papel);color:var(--texto)}
button{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.b1{width:100%;background:linear-gradient(90deg,#10b981,#0ea5e9);color:#fff}
.b2{background:#e0f2fe;color:#0369a1}
.linha{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.av{display:flex;gap:12px;padding:14px 4px;border-top:1px solid var(--linha);cursor:pointer}
.av:first-child{border-top:0}
.pt{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:transparent}
.nl .pt{background:var(--verde)}.nl b{color:var(--azul)}
.av b{display:block;font-size:15px}.av span{display:block;font-size:14px;color:var(--suave);word-break:break-word}
.av small{font-size:12px;color:var(--suave)}
.vazio{text-align:center;color:var(--suave);padding:20px 4px;font-size:14px}
.msg{font-size:14px;margin-top:8px;color:var(--suave)}.ok{color:#059669}.er{color:#dc2626}
.hide{display:none}
</style>
</head>
<body>
<div class="capa">
 <a href="conta.html">‹ Meu Babilônia</a>
 <h1>🔔 Avisos</h1>
 <p>Pedidos, pagamentos, mensagens e a sua loja.</p>
</div>
<main>
 <div class="sec hide" id="login">
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Palavra-passe" autocomplete="current-password">
  <button class="b1" id="ent">Entrar</button>
  <div class="msg" id="lmsg"></div>
 </div>
 <div class="hide" id="painel">
  <div class="sec">
   <div class="linha"><b>Notificações neste telemóvel</b><button class="b2" id="ativar">Ativar</button></div>
   <div class="msg" id="pmsg"></div>
  </div>
  <div class="sec">
   <div class="linha" style="margin-bottom:6px"><b id="cont">Avisos</b><button class="b2" id="todas">Marcar todas como lidas</button></div>
   <div id="lista"><div class="vazio">A carregar…</div></div>
  </div>
 </div>
</main>
<script>
var sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0');
var VAPID='BLyTwU0SftyBsBZ98vViwgQ_YkXDqh566s30LFc4llrVsW1VJB8K0ha_5ghHvlRCU9Qam_xfI6SE2ajipAXVWlM';
var $=function(i){return document.getElementById(i)},eu=null,avisos=[];
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function quando(d){var s=(Date.now()-new Date(d))/1000;if(s<60)return'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';return new Date(d).toLocaleDateString()}
function desenhar(){
 var n=avisos.filter(function(a){return!a.lido}).length;
 $('cont').textContent=n?('Avisos ('+n+' por ler)'):'Avisos';
 $('lista').innerHTML=avisos.length?avisos.map(function(a,i){
  return '<div class="av'+(a.lido?'':' nl')+'" data-i="'+i+'"><i class="pt"></i><div><b>'+esc(a.titulo)+'</b><span>'+esc(a.texto)+'</span><small>'+quando(a.created_at)+'</small></div></div>'}).join('')
  :'<div class="vazio">Ainda não tem avisos.</div>';
 document.querySelectorAll('.av').forEach(function(el){el.onclick=async function(){
  var a=avisos[+el.getAttribute('data-i')];
  if(!a.lido)await sb.from('avisos').update({lido:true}).eq('id',a.id);
  if(a.link)location.href=a.link;else carregar();
 }});
}
async function carregar(){
 if(!eu)return;
 var r=await sb.from('avisos').select('*').eq('user_id',eu.id).order('created_at',{ascending:false}).limit(100);
 if(r.error){$('lista').innerHTML='<div class="vazio">Não foi possível carregar os avisos.</div>';return}
 avisos=r.data||[];desenhar();
}
function chave(b){var p='='.repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,function(c){return c.charCodeAt(0)})}
function estadoPush(){
 if(!('serviceWorker' in navigator)||!('PushManager' in window)){$('pmsg').textContent='Este navegador não aceita notificações. Use o Chrome.';$('ativar').classList.add('hide');return}
 if(Notification.permission==='granted'){$('pmsg').innerHTML='<span class="ok">✅ Ativadas. Recebe os avisos mesmo com a loja fechada.</span>';$('ativar').textContent='Reativar'}
 else if(Notification.permission==='denied'){$('pmsg').innerHTML='<span class="er">Bloqueadas. Toque no cadeado ao lado do endereço → Notificações → Permitir.</span>'}
 else $('pmsg').textContent='Toque em Ativar para receber os avisos no telemóvel.';
}
$('ativar').onclick=async function(){
 var b=this;b.disabled=true;$('pmsg').textContent='A ativar…';
 try{
  var reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  if(await Notification.requestPermission()!=='granted'){estadoPush();b.disabled=false;return}
  var sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:chave(VAPID)});
  var j=sub.toJSON();
  await sb.from('push_subscricoes').delete().eq('endpoint',j.endpoint);
  var r=await sb.from('push_subscricoes').insert({user_id:eu.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,aparelho:navigator.userAgent.slice(0,120)});
  if(r.error)throw r.error;
  estadoPush();
 }catch(e){$('pmsg').innerHTML='<span class="er">Não foi possível ativar: '+esc(e.message||e)+'</span>'}
 b.disabled=false;
};
$('todas').onclick=async function(){
 await sb.from('avisos').update({lido:true}).eq('user_id',eu.id).eq('lido',false);carregar();
};
$('ent').onclick=async function(){
 var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){$('lmsg').textContent='Email ou palavra-passe errados.';return}abrir();
};
async function abrir(){
 var s=(await sb.auth.getSession()).data.session;eu=s?s.user:null;
 $('login').classList.toggle('hide',!!eu);$('painel').classList.toggle('hide',!eu);
 if(eu){estadoPush();carregar()}
}
setInterval(function(){if(eu&&!document.hidden)carregar()},20000);
abrir();
</script>
<script src="menu-babilonia.js"></script>
</body>
</html>
