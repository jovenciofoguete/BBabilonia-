<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagar - BBabilônia</title>
<style>html,body{margin:0;height:100%;background:#fff}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="f" title="BBabilônia"></iframe>
<script>
/* Abre a página de pagamento (pagar-link.html / pagar-link-v2.html) sem a alterar
   e liga o chat-imagens-privadas.js, para as fotos do link aparecerem com a pasta privada. */
var f = document.getElementById("f");
f.addEventListener("load", function () {
  try {
    var d = f.contentDocument;
    if (d.title) document.title = d.title;
    if (d.getElementById("bb-cip")) return;
    var s = d.createElement("script");
    s.id = "bb-cip";
    s.src = "chat-imagens-privadas.js?v=1";
    d.body.appendChild(s);
  } catch (e) {}
});
f.src = location.pathname + location.search + location.hash;
</script>
</body>
</html>
