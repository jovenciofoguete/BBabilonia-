<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pesquisa por imagem · B-Babilônia</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#222;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:5}
  .logo{border:2px solid #ff6a00;color:#ff6a00;border-radius:8px;padding:3px 8px;font-weight:700;font-size:14px;text-decoration:none}
  h1{font-size:16px;margin:0}
  main{padding:14px;max-width:900px;margin:0 auto}
  .caixa{border:2px dashed #ff6a00;border-radius:14px;padding:18px;text-align:center}
  .caixa p{margin:6px 0;color:#555;font-size:14px}
  .bts{display:flex;gap:18px;justify-content:center;margin-top:10px}
  .ic{width:64px;height:64px;border-radius:50%;background:#fff;border:1px solid #ddd;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:#333;cursor:pointer}
  .ic svg{width:30px;height:30px}
  #objs{display:none;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
  #objs p{margin:0 0 4px;font-size:13px;color:#555;text-align:left;width:100%}
  #objs canvas{flex:none;width:68px;height:68px;border-radius:10px;border:2px solid #ddd;background:#fff;cursor:pointer}
  #objs canvas.on{border-color:#ff6a00}
  #estado{margin:14px 0;font-size:14px;color:#555;text-align:center}
  .grelha{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  @media(min-width:640px){.grelha{grid-template-columns:repeat(4,1fr)}}
  .card{border:1px solid #eee;border-radius:10px;overflow:hidden;text-decoration:none;color:#222;background:#fff}
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f6f6f6}
  .card .t{padding:6px 8px;font-size:13px;line-height:1.3;height:38px;overflow:hidden}
  .card .p{padding:0 8px 4px;font-weight:700;color:#ff6a00;font-size:14px}
  .card .s{padding:0 8px 8px;font-size:11px;color:#2e7d32}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">B-Babilônia</a>
  <h1>Pesquisa por imagem</h1>
</header>
<main>
  <div id="objs"></div>
  <div class="caixa">
    <p>Tire uma foto ou escolha uma imagem do produto.</p>
    <p style="font-size:12px">Compara a forma e o modelo do objeto — não a cor nem o fundo.</p>
    <div class="bts">
      <label class="ic" aria-label="Tirar foto" title="Tirar foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><input class="fich" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="ic" aria-label="Escolher da galeria" title="Escolher da galeria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg><input class="fich" type="file" accept="image/*" hidden></label>
    </div>
  </div>
  <div id="estado"></div>
  <div class="grelha" id="grelha"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="forma-comum.js"></script>
<script>
const F = window.FormaBB;
const estado = document.getElementById("estado");
const grelha = document.getElementById("grelha");
let indice = [];          // [{p, foto, v}]  — vetores já prontos, vindos do Supabase
let semForma = 0;

function msg(t){ estado.textContent = t; }

async function lerProdutos(){
  const h = {apikey:F.SUPA_KEY, Authorization:"Bearer "+F.SUPA_KEY};
  let r = await fetch(F.SUPA_URL+"/rest/v1/products?select=id,name,price,currency,image_url,images,forma&limit=5000",{headers:h});
  if(!r.ok) throw new Error("Falta correr o SQL da coluna forma no Supabase ("+r.status+")");
  const lista = await r.json();
  for(const p of lista){
    let f = p.forma;
    if(typeof f === "string"){ try{ f = JSON.parse(f); }catch(e){ f = null; } }
    const fotos = F.fotosDe(p);
    if(!Array.isArray(f) || !f.length){ if(fotos.length) semForma++; continue; }
    f.forEach((txt,i) => { try{ indice.push({p, foto:fotos[i]||fotos[0], v:F.descodificar(txt)}); }catch(e){} });
  }
}

/* prepara tudo ao abrir a página; os botões funcionam logo e a foto espera se preciso */
let pronto = false;
const preparar = Promise.all([F.carregarModelo(), lerProdutos()]).then(()=>{ pronto = true; });
preparar.catch(()=>{});

function mostrar(lista, ms){
  grelha.innerHTML = "";
  if(!lista.length){ msg("Não encontrámos produtos com esta forma. Tente outra foto com o objeto inteiro."); return; }
  msg(lista.length + " produtos parecidos · " + ms + " ms");
  for(const it of lista){
    const a = document.createElement("a");
    a.className = "card";
    a.href = "produto-bbabilonia.html?id=" + encodeURIComponent(it.p.id);
    const img = document.createElement("img"); img.loading = "lazy"; img.src = it.foto; img.alt = "";
    const t = document.createElement("div"); t.className = "t"; t.textContent = it.p.name || "Produto";
    const pr = document.createElement("div"); pr.className = "p";
    pr.textContent = Number(it.p.price||0).toLocaleString("pt-PT") + " " + (it.p.currency || "MZN");
    const s = document.createElement("div"); s.className = "s"; s.textContent = Math.round(it.nota*100) + "% parecido";
    a.append(img, t, pr, s); grelha.appendChild(a);
  }
}

let vez = 0, urlAnt = null;   // só mostra o resultado da última foto escolhida
const objs = document.getElementById("objs");

/* caixas dos objetos dentro de uma zona: contornos ligados → caixas */
function caixasDe(base, R, juntar){
  const gw = 120, gh = Math.max(1, Math.round(120*R.h/R.w));
  const g = document.createElement("canvas"); g.width = gw; g.height = gh;
  const gx = g.getContext("2d", {willReadFrequently:true}); gx.drawImage(base, R.x, R.y, R.w, R.h, 0, 0, gw, gh);
  const px = gx.getImageData(0, 0, gw, gh).data, cz = new Float32Array(gw*gh);
  for(let i=0;i<gw*gh;i++) cz[i] = 0.299*px[i*4] + 0.587*px[i*4+1] + 0.114*px[i*4+2];
  let borda = new Uint8Array(gw*gh);
  for(let y=1;y<gh-1;y++) for(let x=1;x<gw-1;x++){
    const i = y*gw+x;
    if(Math.abs(cz[i+1]-cz[i-1]) + Math.abs(cz[i+gw]-cz[i-gw]) > 28) borda[i] = 1;
  }
  for(let r=0;r<juntar;r++){               // junta os contornos do mesmo objeto
    const n = new Uint8Array(gw*gh);
    for(let y=0;y<gh;y++) for(let x=0;x<gw;x++){
      let v = 0;
      for(let dy=-1;dy<=1&&!v;dy++) for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy; if(xx>=0&&yy>=0&&xx<gw&&yy<gh&&borda[yy*gw+xx]){ v=1; break; } }
      n[y*gw+x] = v;
    }
    borda = n;
  }
  const visto = new Uint8Array(gw*gh), caixas = [], fila = new Int32Array(gw*gh);
  for(let i=0;i<gw*gh;i++){
    if(!borda[i] || visto[i]) continue;
    let ini=0, fim=0, x0=gw, y0=gh, x1=0, y1=0; fila[fim++] = i; visto[i] = 1;
    while(ini<fim){
      const k = fila[ini++], x = k%gw, y = (k-x)/gw;
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      for(const j of [k-1,k+1,k-gw,k+gw]){ if(j<0||j>=gw*gh||visto[j]||!borda[j]) continue; if((j===k-1&&x===0)||(j===k+1&&x===gw-1)) continue; visto[j]=1; fila[fim++]=j; }
    }
    const bw = x1-x0+1, bh = y1-y0+1;
    if(bw < 8 || bh < 8 || bw*bh < gw*gh*0.02) continue;          // texto e riscos pequenos ficam de fora
    if(bw*bh > gw*gh*0.85) continue;                                // é a zona toda
    const pad = Math.round(Math.max(bw, bh)*0.06);
    const X0 = Math.max(0, x0-pad), Y0 = Math.max(0, y0-pad), X1 = Math.min(gw-1, x1+pad), Y1 = Math.min(gh-1, y1+pad);
    caixas.push({x:R.x+Math.round(X0/gw*R.w), y:R.y+Math.round(Y0/gh*R.h), w:Math.round((X1-X0+1)/gw*R.w), h:Math.round((Y1-Y0+1)/gh*R.h), objeto:true});
  }
  return caixas;
}

/* zonas onde pode estar um objeto (como no Alibaba): foto inteira, objetos, objetos dentro de objetos
   (ex.: a foto dentro de uma captura do ecrã) e quadrados de vários tamanhos */
function zonas(base){
  const W = base.width, H = base.height, A = W*H, toda = {x:0, y:0, w:W, h:H, inteira:true};
  let obj = caixasDe(base, toda, 2);
  for(const c of obj.slice()){
    if(c.w*c.h < A*0.1) continue;
    for(const d of caixasDe(base, c, 0)) if(d.w*d.h < c.w*c.h*0.8) obj.push(d);
  }
  obj.sort((a,b)=>b.w*b.h-a.w*a.h); obj = obj.slice(0, 16);
  const R = (obj[0] && obj[0].w*obj[0].h >= A*0.1) ? obj[0] : toda;   // quadrados dentro da maior zona com conteúdo
  const g = document.createElement("canvas"), gw = 48, gh = Math.max(1, Math.round(48*H/W));
  g.width = gw; g.height = gh; const gx = g.getContext("2d", {willReadFrequently:true}); gx.drawImage(base, 0, 0, gw, gh);
  const px = gx.getImageData(0, 0, gw, gh).data;
  function variedade(z){                    // zonas lisas/vazias ficam de fora
    const x0 = Math.floor(z.x/W*gw), y0 = Math.floor(z.y/H*gh), x1 = Math.ceil((z.x+z.w)/W*gw), y1 = Math.ceil((z.y+z.h)/H*gh);
    let s=0, s2=0, n=0;
    for(let y=y0;y<y1&&y<gh;y++) for(let x=x0;x<x1&&x<gw;x++){ const k=(y*gw+x)*4, v=0.299*px[k]+0.587*px[k+1]+0.114*px[k+2]; s+=v; s2+=v*v; n++; }
    return n ? Math.sqrt(Math.max(0, s2/n-(s/n)*(s/n))) : 0;
  }
  const grelha = [], m = Math.min(R.w, R.h);
  for(const f of [0.9, 0.7, 0.5]){
    const t = Math.max(1, Math.round(m*f)), passo = Math.max(1, Math.round(t/2)), xs = [], ys = [];
    for(let x=R.x; x+t<=R.x+R.w; x+=passo) xs.push(x); if(xs[xs.length-1] + t < R.x+R.w) xs.push(R.x+R.w-t);
    for(let y=R.y; y+t<=R.y+R.h; y+=passo) ys.push(y); if(ys[ys.length-1] + t < R.y+R.h) ys.push(R.y+R.h-t);
    for(const y of ys) for(const x of xs){ const z = {x, y, w:t, h:t, grelha:true}; z.v = variedade(z); if(z.v >= 20) grelha.push(z); }
  }
  grelha.sort((a,b)=>b.v-a.v);
  return [toda].concat(obj, grelha.slice(0, 12));
}

function recorte(base, z, lado){
  const c = document.createElement("canvas"), e = lado ? lado/Math.max(z.w, z.h) : 1;
  c.width = Math.max(1, Math.round(z.w*e)); c.height = Math.max(1, Math.round(z.h*e));
  c.getContext("2d").drawImage(base, z.x, z.y, z.w, z.h, 0, 0, c.width, c.height);
  return c;
}

/* vetores de todas as zonas de uma vez (mesmo cálculo de F.vetor: forma + espelho, normalizado) */
async function vetores(base, lista){
  const m = await F.carregarModelo(), L = F.LADO, out = [];
  try{
    if(!F.prepararForma) throw 0;
    for(let i=0;i<lista.length;i+=8){
      const parte = lista.slice(i, i+8), cvs = [];
      for(const z of parte){
        const cv = F.prepararForma(recorte(base, z, 320));
        const esp = document.createElement("canvas"); esp.width = esp.height = L;
        const e = esp.getContext("2d"); e.translate(L,0); e.scale(-1,1); e.drawImage(cv,0,0);
        cvs.push(cv, esp);
      }
      const lote = tf.tidy(() => tf.stack(cvs.map(c => tf.browser.fromPixels(c))));
      const r = m.infer(lote, true); lote.dispose();
      const d = await r.data(), n = d.length/cvs.length; r.dispose();
      for(let k=0;k<parte.length;k++){
        const v = new Float32Array(n); let s = 0;
        for(let j=0;j<n;j++){ v[j] = (d[(2*k)*n+j] + d[(2*k+1)*n+j])/2; s += v[j]*v[j]; }
        s = Math.sqrt(s)||1; for(let j=0;j<n;j++) v[j] /= s;
        out.push(v);
      }
    }
  }catch(e){                          // se o telemóvel não aguentar o lote, faz uma a uma
    out.length = 0;
    for(const z of lista) out.push(await F.vetor(recorte(base, z, 320)));
  }
  return out;
}

function comparar(q){
  const melhor = new Map();                         // um resultado por produto (a foto mais parecida)
  for(const it of indice){
    let s = 0; const v = it.v;
    for(let i=0;i<v.length;i++) s += q[i]*v[i];
    const ant = melhor.get(it.p.id);
    if(!ant || s > ant.nota) melhor.set(it.p.id, {p:it.p, foto:it.foto, nota:s});
  }
  const ord = [...melhor.values()].sort((a,b)=>b.nota-a.nota);
  const topo = ord.length ? ord[0].nota : 0;
  return {topo, res: ord.filter(x=>x.nota>=0.6 && x.nota>=topo-0.12).slice(0,40)};
}

function sobrepoe(a, b){              // a mesma coisa vista em zonas diferentes
  const ix = Math.max(0, Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x));
  const iy = Math.max(0, Math.min(a.y+a.h, b.y+b.h) - Math.max(a.y, b.y));
  return ix*iy / Math.min(a.w*a.h, b.w*b.h) > 0.5;
}

function mostrarObjetos(base, achados, ms){
  objs.innerHTML = "";
  if(!achados.length){ objs.style.display = "none"; return; }
  if(achados.length > 1){ const t = document.createElement("p"); t.textContent = achados.length + " objetos na foto · toque para escolher"; objs.appendChild(t); }
  const melhor = achados[0];
  achados = achados.slice().sort((a,b) => (Math.abs(a.z.y-b.z.y) > Math.min(a.z.h,b.z.h)/2 ? a.z.y-b.z.y : a.z.x-b.z.x));   // pela ordem na foto
  achados.forEach(a => {
    const c = recorte(base, a.z, 136); 
    const q = document.createElement("canvas"); q.width = q.height = 136;
    const qx = q.getContext("2d"); qx.fillStyle = "#fff"; qx.fillRect(0,0,136,136);
    qx.drawImage(c, (136-c.width)/2, (136-c.height)/2);
    if(a === melhor) q.className = "on";
    q.onclick = () => { objs.querySelectorAll("canvas").forEach(x => x.className = ""); q.className = "on"; mostrar(a.res, ms); };
    objs.appendChild(q);
  });
  objs.style.display = "flex"; objs.style.flexWrap = "wrap";
}

async function procurar(ev){
  const input = ev.target;
  const f = input.files && input.files[0];
  input.value = "";
  if(!f) return;
  const minha = ++vez;
  grelha.innerHTML = ""; objs.style.display = "none";
  if(urlAnt) URL.revokeObjectURL(urlAnt);
  const url = urlAnt = URL.createObjectURL(f);
  try{
    if(!pronto){ msg("A preparar o analisador… a sua foto é analisada já a seguir."); await preparar; }
    if(minha !== vez) return;
    msg("A procurar…");
    const t0 = performance.now();
    const im = await F.carregarImg(url);
    const e = Math.min(1, 720/Math.max(im.width, im.height));
    const base = document.createElement("canvas"); base.width = Math.max(1, Math.round(im.width*e)); base.height = Math.max(1, Math.round(im.height*e));
    base.getContext("2d").drawImage(im, 0, 0, base.width, base.height);
    const lista = zonas(base), vs = await vetores(base, lista);
    if(minha !== vez) return;
    const todas = lista.map((z, i) => Object.assign({z}, comparar(vs[i]))).filter(a => a.res.length);
    todas.sort((a,b) => b.topo - a.topo);
    const dentro = (p, g) => {                                      // p está dentro de g
      const ix = Math.max(0, Math.min(p.x+p.w, g.x+g.w) - Math.max(p.x, g.x)), iy = Math.max(0, Math.min(p.y+p.h, g.y+g.h) - Math.max(p.y, g.y));
      return p !== g && p.w*p.h < g.w*g.h && ix*iy > p.w*p.h*0.8;
    };
    const objetos = todas.filter(a => a.z.objeto);
    const caixaDeVarios = a => objetos.filter(b => dentro(b.z, a.z)).length >= 2;   // ex.: o cartão que tem vários produtos dentro
    let achados = [];
    for(const a of todas){                                          // objetos recortados, para a linha de escolha
      if(!a.z.objeto || caixaDeVarios(a)) continue;
      if(achados.length && a.topo < 0.65) continue;                 // outros objetos só se forem bem parecidos
      if(!achados.some(b => sobrepoe(a.z, b.z))) achados.push(a);
      if(achados.length >= 6) break;
    }
    if(achados.length < 2) achados = todas.length ? [todas[0]] : [];   // um só objeto: a zona mais parecida
    const ms = Math.round(performance.now()-t0);
    mostrarObjetos(base, achados, ms);
    mostrar(achados.length ? achados[0].res : [], ms);
  }catch(e){ if(minha === vez) msg("Erro: " + e.message); }
}
document.querySelectorAll(".fich").forEach(i => i.addEventListener("change", procurar));
</script>
</body>
</html>
