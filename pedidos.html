<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Os meus pedidos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--fundo:#f3f0fb;--papel:#fff;--texto:#1b1740;--suave:#6b6590;--linha:#ebe7f6;--azul:#0284c7}
@media (prefers-color-scheme:dark){:root{--fundo:#110e22;--papel:#1d1838;--texto:#f3f0ff;--suave:#a9a2cf;--linha:#2d2752}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);line-height:1.4}
a{color:inherit;text-decoration:none}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#10b981,#0ea5e9 55%,#2563eb);color:#fff;box-shadow:0 4px 14px #0003}
.bar .l{display:flex;align-items:center;gap:6px;padding:10px 8px 6px}
.bar .vt{border:0;background:none;color:#fff;font-size:26px;line-height:1;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.bar .vt:active{background:#ffffff33}
.bar h1{font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;border-radius:20px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:700;background:#ffffff2e;color:#fff;position:relative}
.tabs button.on{background:#fff;color:#0369a1}
.tabs i{font-style:normal;background:#ef4444;color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:5px}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.ped{background:var(--papel);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px #0ea5e91a;display:block;width:100%;border:0;text-align:left;font:inherit;color:inherit}
.ped:active{transform:scale(.99)}
.l1{display:flex;justify-content:space-between;font-size:13px;color:var(--suave)}
.tot{font-weight:900;font-size:18px;margin:4px 0 6px;color:#059669}
.est{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;background:#fef3c7;color:#92400e;margin-right:4px}
.est.ok{background:#d1fae5;color:#065f46}.est.no{background:#ffe4e6;color:#9f1239}
.it{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13.5px}
.it img,.it .sf{width:52px;height:52px;object-fit:cover;border-radius:10px;background:var(--linha);flex:none}
.it small{color:var(--suave)}
.ver{display:block;margin-top:10px;font-size:13px;font-weight:700;color:var(--azul);text-align:right}
.vazio{color:var(--suave);text-align:center;padding:40px 10px;font-size:14.5px;background:var(--papel);border-radius:18px}
.box{background:var(--papel);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px #0ea5e91a}
.box h3{font-size:15px;margin-bottom:8px}
.linha{display:flex;align-items:flex-start;gap:0;margin:6px 0 2px}
.passo{flex:1;text-align:center;font-size:11.5px;color:var(--suave);position:relative}
.passo b{display:flex;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;align-items:center;justify-content:center;background:var(--linha);color:var(--suave);font-size:13px;position:relative;z-index:1}
.passo.on{color:var(--texto);font-weight:700}.passo.on b{background:linear-gradient(135deg,#10b981,#0ea5e9);color:#fff}
.passo:not(:first-child)::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:3px;background:var(--linha)}
.passo.on:not(:first-child)::before{background:#10b981}
.dl{font-size:14px;line-height:1.55}.dl span{color:var(--suave)}
.fs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.fs div{width:92px;text-align:center}
.fs img{width:92px;height:92px;object-fit:cover;border-radius:12px;display:block}
.fs a.bx{display:block;margin-top:4px;font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(90deg,#10b981,#0ea5e9);border-radius:10px;padding:6px 0}
.bt{display:inline-block;margin-top:8px;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:800;background:#0e7490;color:#fff;font-size:13.5px}
.avb{display:block;text-align:center;margin-top:4px;padding:13px;border-radius:14px;background:linear-gradient(90deg,#f59e0b,#f97316);color:#fff;font-weight:800}
.pag{display:block;text-align:center;margin-top:4px;padding:13px;border-radius:14px;background:linear-gradient(90deg,#10b981,#0ea5e9);color:#fff;font-weight:800}
.avd{font-size:14px;color:#059669;font-weight:700}
.tt{display:flex;justify-content:space-between;font-size:14px;margin:3px 0}.tt.g{font-weight:900;font-size:16px;border-top:1px dashed var(--linha);padding-top:6px;margin-top:6px}
.hide{display:none}
#login .box input{width:100%;padding:13px;border:2px solid var(--linha);border-radius:12px;font:inherit;background:var(--fundo);color:var(--texto);margin:6px 0}
#login .btn{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,#10b981,#0ea5e9);color:#fff;font:inherit;font-weight:800;margin-top:8px}
#lmsg{color:#e11d48;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="bar">
 <div class="l"><button class="vt" id="voltar" aria-label="Voltar">&#8592;</button><h1 id="tit">Os meus pedidos</h1></div>
 <div class="tabs" id="tabs"></div>
</div>
<main>
 <div id="login" class="hide"><div class="box"><h3>Entre na sua conta</h3>
  <input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Palavra-passe" autocomplete="current-password">
  <button class="btn" id="ent">Entrar</button><div id="lmsg"></div></div></div>
 <div id="lista"><div class="vazio">A carregar…</div></div>
 <div id="det" class="hide"></div>
</main>
<script>
var sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0');
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function arr(x){if(typeof x==='string'){try{x=JSON.parse(x)}catch(e){x=[]}}return Array.isArray(x)?x:[]}
function k(x){return String(x||'').toLowerCase()}
function din(v,m){return Number(v||0).toLocaleString('pt-PT',{maximumFractionDigits:2})+' '+(m||'')}
function pago(p){return/pago|paid|succeeded|confirmado|retido|liberado/.test(k(p.payment_status))||/pago|paid/.test(k(p.status))}
function cancelado(p){return/cancel/.test(k(p.status))}
function enviado(p){return/enviad|shipped|transito/.test(k(p.status))}
function recebido(p){return/entregue|recebid|delivered|conclu/.test(k(p.status))||/entregue|liberado/.test(k(p.escrow_status))}
var REGRA={
 todos:function(){return true},
 naopago:function(p){return!pago(p)&&!cancelado(p)},
 pago:function(p){return pago(p)},
 pendente:function(p){return pago(p)&&!enviado(p)&&!recebido(p)&&!cancelado(p)},
 enviado:function(p){return enviado(p)&&!recebido(p)},
 recebido:function(p){return recebido(p)},
 avaliar:function(p){return recebido(p)&&!p.avaliado}
};
var ORDEM=['todos','naopago','pago','pendente','enviado','recebido','avaliar'];
var ROT={todos:'Todos',naopago:'Não pagos',pago:'Pagos',pendente:'Pendentes de envio',enviado:'Enviados',recebido:'Recebidos',avaliar:'Para avaliar'};
var COM_NUM={naopago:1,pendente:1,enviado:1,avaliar:1};
var pedidos=[],filtro='todos',aberto=null;
var q=new URLSearchParams(location.search);if(REGRA[q.get('f')])filtro=q.get('f');

var DISP={aberta:'⚠️ Disputa aberta',negociacao:'🤝 Disputa em negociação',acordo:'⚖️ Acordo na disputa',em_analise:'🎧 Intervenção da BBabilônia',fornecedor_aceitou:'💸 Reembolso aceite',ganha_cliente:'💸 Reembolso a seu favor',ganha_fornecedor:'Disputa fechada',dividida:'⚖️ Reembolso parcial'};
function etiqueta(p){
 if(p.disputa_estado&&DISP[p.disputa_estado])return'<span class="est no">'+DISP[p.disputa_estado]+'</span>';
 if(cancelado(p))return'<span class="est no">Cancelado</span>';
 if(recebido(p))return'<span class="est ok">Recebido</span>';
 if(enviado(p))return'<span class="est">Enviado</span>';
 if(pago(p))return'<span class="est ok">Pago</span><span class="est">A aguardar envio</span>';
 return'<span class="est no">Não pago</span>';
}
function itens(p,todos){
 var l=arr(p.items),m=todos?l:l.slice(0,2);
 return m.map(function(i){
  var op=i.opcoes&&typeof i.opcoes==='object'?Object.keys(i.opcoes).map(function(c){return c+': '+i.opcoes[c]}).join(' · '):'';
  return'<div class="it">'+(i.foto?'<img src="'+esc(i.foto)+'" alt="">':'<div class="sf"></div>')+'<div>'+esc(i.nome||'Produto')+'<br><small>'+
   esc([i.cor,i.tamanho].filter(Boolean).join(' · '))+' × '+esc(i.qtd||1)+(i.preco?' · '+din(i.preco,i.moeda||p.currency):'')+(todos&&op?'<br>'+esc(op):'')+'</small></div></div>'}).join('')+
  (!todos&&l.length>2?'<div class="it"><small>+ '+(l.length-2)+' produto(s)</small></div>':'');
}
function abas(){
 $('tabs').innerHTML=ORDEM.map(function(f){
  var n=pedidos.filter(REGRA[f]).length;
  return'<button data-f="'+f+'" class="'+(f===filtro?'on':'')+'">'+ROT[f]+(COM_NUM[f]&&n?'<i>'+n+'</i>':'')+'</button>'}).join('');
 $('tabs').querySelectorAll('button').forEach(function(b){b.onclick=function(){
  filtro=b.getAttribute('data-f');history.replaceState({},'','pedidos.html?f='+filtro);lista();
 }});
 var on=$('tabs').querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
}
function lista(){
 aberto=null;$('det').classList.add('hide');$('lista').classList.remove('hide');$('tabs').classList.remove('hide');$('tit').textContent='Os meus pedidos';
 abas();
 var l=pedidos.filter(REGRA[filtro]);
 if(!l.length){$('lista').innerHTML='<div class="vazio">'+(filtro==='todos'?'Ainda não tem pedidos.':'Nenhum pedido em "'+ROT[filtro]+'".')+'</div>';return}
 $('lista').innerHTML=l.map(function(p){
  var d=p.created_at?new Date(p.created_at).toLocaleDateString():'';
  return'<button class="ped" data-id="'+esc(p.id)+'"><div class="l1"><span>Pedido '+esc(String(p.id).slice(0,8))+'</span><span>'+d+'</span></div>'+
   '<div class="tot">'+din(p.total,p.currency)+'</div>'+etiqueta(p)+itens(p,false)+'<span class="ver">Ver detalhes ›</span></button>';
 }).join('');
 $('lista').querySelectorAll('.ped').forEach(function(b){b.onclick=function(){abrirDet(b.getAttribute('data-id'),true)}});
 window.scrollTo(0,0);
}
function fotosEnvio(p){var f=p.foto_pacote;if(!f)return[];if(typeof f==='string'&&f.charAt(0)!=='[')return[f];return arr(f)}
function abrirDet(id,novo){
 var p=pedidos.filter(function(x){return String(x.id)===String(id)})[0];if(!p){lista();return}
 aberto=id;
 if(novo)history.pushState({det:id},'','pedidos.html?f='+filtro+'&pedido='+encodeURIComponent(id));
 $('lista').classList.add('hide');$('tabs').classList.add('hide');$('det').classList.remove('hide');$('tit').textContent='Detalhe do pedido';
 var passos=[['💳','Pago',pago(p)],['🚚','Enviado',enviado(p)||recebido(p)],['🏠','Recebido',recebido(p)],['⭐','Avaliado',!!p.avaliado]];
 var fs=fotosEnvio(p);
 var h='<div class="box"><div class="l1"><span>Pedido '+esc(String(p.id).slice(0,8))+'</span><span>'+(p.created_at?new Date(p.created_at).toLocaleString():'')+'</span></div>'+
  '<div style="margin-top:6px">'+etiqueta(p)+'</div>'+
  (cancelado(p)?'':'<div class="linha" style="margin-top:14px">'+passos.map(function(s){return'<div class="passo'+(s[2]?' on':'')+'"><b>'+(s[2]?'✓':s[0])+'</b>'+s[1]+'</div>'}).join('')+'</div>')+'</div>';
 var ds=p.disputa_estado,dentro=!p.recebido_em||(new Date()-new Date(p.recebido_em))<15*864e5;
 if(ds)h+='<div class="box"><a class="avb" style="background:linear-gradient(90deg,#f59e0b,#ea580c)" href="disputa.html?pedido='+encodeURIComponent(p.id)+'">⚠️ Ver a disputa</a></div>';
 else if(pago(p)&&enviado(p)&&!recebido(p))h+='<div class="box"><button class="pag" style="width:100%;border:0;font:inherit;font-weight:800" id="conf">✅ Confirmei a receção</button>'+
  '<a class="avb" style="margin-top:8px;background:linear-gradient(90deg,#f59e0b,#ea580c)" href="disputa.html?pedido='+encodeURIComponent(p.id)+'">⚠️ Não recebi ou tenho um problema</a>'+
  '<div class="dl" style="margin-top:8px"><span>Só confirme depois de ter o produto na mão. Se não fizer nada, a receção confirma-se sozinha 30 dias depois do envio.</span></div><div id="cmsg" style="color:#e11d48;font-size:14px"></div></div>';
 else if(pago(p)&&recebido(p)&&dentro&&!cancelado(p))h+='<div class="box"><a class="avb" style="background:linear-gradient(90deg,#f59e0b,#ea580c)" href="disputa.html?pedido='+encodeURIComponent(p.id)+'">⚠️ Tenho um problema com este pedido</a><div class="dl" style="margin-top:8px"><span>Pode abrir disputa até 15 dias depois da receção.</span></div></div>';
 h+='<div class="box"><a class="avb" style="background:linear-gradient(90deg,#10b981,#0ea5e9)" href="ajuda.html?novo=1&pedido='+encodeURIComponent(p.id)+'&assunto='+encodeURIComponent('📦 O meu pedido')+'">🎧 Falar com o atendimento sobre este pedido</a></div>';
 if(!pago(p)&&!cancelado(p)&&p.link_id)h+='<div class="box"><a class="pag" href="pagar-link.html?id='+encodeURIComponent(p.link_id)+'">💳 Pagar este pedido</a></div>';
 if(recebido(p)&&!cancelado(p))h+='<div class="box">'+(p.avaliado?'<div class="avd">⭐ Já avaliou este pedido</div>':'<a class="avb" href="avaliar.html?pedido='+encodeURIComponent(p.id)+'">⭐ Avaliar este pedido</a>')+'</div>';
 if(p.rastreio||fs.length)h+='<div class="box"><h3>🚚 Envio</h3><div class="dl">Transportadora: <b>'+esc(p.transportadora||'—')+'</b><br>Nº de rastreamento: <b>'+esc(p.rastreio||'—')+'</b>'+
  (p.shipped_at?'<br><span>Enviado em '+new Date(p.shipped_at).toLocaleString()+'</span>':'')+'</div>'+
  (p.rastreio?'<button class="bt" data-copiar="'+esc(p.rastreio)+'">Copiar número</button>':'')+
  (fs.length?'<div class="fs">'+fs.map(function(u,n){return'<div><a href="'+esc(u)+'" target="_blank"><img src="'+esc(u)+'" alt="Foto do pacote"></a><a class="bx" href="'+esc(u)+(u.indexOf('?')<0?'?':'&')+'download=pacote-'+esc(String(p.id).slice(0,8))+'-'+(n+1)+'.jpg">⬇ Baixar</a></div>'}).join('')+'</div><div class="dl" style="margin-top:6px"><span>Baixe as fotos do pacote para partilhar com a sua logística.</span></div>':'')+'</div>';
 h+='<div class="box"><h3>🛍️ Produtos</h3>'+itens(p,true)+'</div>';
 h+='<div class="box"><h3>📍 Entregar a</h3><div class="dl">'+esc(p.customer_name||'')+(p.customer_phone?' · '+esc(p.customer_phone):'')+'<br>'+esc(p.delivery_address||'—')+(p.country?'<br><span>'+esc(p.country)+'</span>':'')+'</div></div>';
 h+='<div class="box"><h3>💰 Valores</h3>'+(p.subtotal!=null?'<div class="tt"><span>Produtos</span><span>'+din(p.subtotal,p.currency)+'</span></div>':'')+
  (Number(p.platform_fee)?'<div class="tt"><span>Taxa da plataforma</span><span>'+din(p.platform_fee,p.currency)+'</span></div>':'')+
  '<div class="tt g"><span>Total</span><span>'+din(p.total,p.currency)+'</span></div>'+(p.payment_method?'<div class="dl" style="margin-top:6px"><span>Pagamento: '+esc(p.payment_method)+'</span></div>':'')+'</div>';
 $('det').innerHTML=h;
 var cf=$('conf');if(cf)cf.onclick=async function(){
  if(!confirm('Confirma que recebeu o produto em bom estado? O pagamento será libertado para o fornecedor.'))return;
  cf.disabled=true;var r=await sb.rpc('confirmar_rececao',{p_pedido:String(p.id)});
  if(r.error){$('cmsg').textContent=r.error.message;cf.disabled=false;return}
  p.status='recebido';p.recebido_em=new Date().toISOString();if(p.escrow_status==='retido')p.escrow_status='entregue';abrirDet(p.id,false);
 };
 $('det').querySelectorAll('[data-copiar]').forEach(function(b){b.onclick=function(){var t=b.getAttribute('data-copiar');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='Copiado ✓'}).catch(function(){prompt('Copie o número:',t)})}});
 window.scrollTo(0,0);
}
$('voltar').onclick=function(){
 if(aberto){if(history.state&&history.state.det)history.back();else{history.replaceState({},'','pedidos.html?f='+filtro);lista()}}
 else location.href='conta.html';
};
window.addEventListener('popstate',function(e){
 var id=new URLSearchParams(location.search).get('pedido');
 if(id&&pedidos.length)abrirDet(id,false);else lista();
});
async function abrir(){
 var s=(await sb.auth.getSession()).data.session;
 $('login').classList.toggle('hide',!!s);
 if(!s){$('lista').innerHTML='';$('tabs').innerHTML='';return}
 var em=String(s.user.email||'').toLowerCase();
 try{await sb.rpc('rever_prazos')}catch(e){}
 var r=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(200);
 pedidos=(r.data||[]).filter(function(p){return String(p.customer_id||'')===s.user.id||k(p.customer_email)===em});
 var id=q.get('pedido');
 if(id&&pedidos.some(function(p){return String(p.id)===id})){history.replaceState({},'','pedidos.html?f='+filtro);history.pushState({det:id},'','pedidos.html?f='+filtro+'&pedido='+encodeURIComponent(id));abas();abrirDet(id,false)}
 else lista();
}
$('ent').onclick=async function(){
 var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){$('lmsg').textContent='Email ou palavra-passe errados.';return}abrir();
};
document.addEventListener('click',async function(e){
 var a=e.target.closest&&e.target.closest('a.bx');if(!a)return;
 e.preventDefault();var t=a.textContent;a.textContent='…';
 var nome=decodeURIComponent((a.href.split('download=')[1]||'pacote.jpg').split('&')[0]);
 try{var b=await (await fetch(a.href)).blob(),x=URL.createObjectURL(b),l=document.createElement('a');
  l.href=x;l.download=nome;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(x)},4000);
  a.textContent='✓ Salvo';setTimeout(function(){a.textContent=t},2000);
 }catch(x){a.textContent=t;location.href=a.href}
});
abrir();
</script>
<script src="menu-babilonia.js"></script>
</body>
  </html>
