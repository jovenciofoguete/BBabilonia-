<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minhas moradas - BBabilônia</title>
<style>
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:#f4f4f4;color:#111}
header{background:#111;color:#fff;padding:16px;font-size:20px;font-weight:600}
.card{background:#fff;margin:12px;padding:16px;border-radius:16px}
h2{margin:0 0 12px;font-size:22px}
label{display:block;margin:14px 0 6px;font-weight:600}
input,select{width:100%;padding:14px;font-size:17px;border:1px solid #ccc;border-radius:12px;background:#fff;color:#111}
button{width:100%;padding:15px;font-size:17px;border:0;border-radius:12px;background:#111;color:#fff;margin-top:14px}
button.sec{background:#555}
.par{display:flex;gap:8px}
.par button{margin-top:10px}
.tag{display:inline-block;background:#eee;padding:6px 12px;border-radius:10px;font-size:15px;margin-bottom:10px}
.tag.ext{background:#dce9ff}
.end{border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px;line-height:1.5;overflow-wrap:anywhere}
.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}
.ok{background:#e3f7e8;color:#145a2a}
.err{background:#fde8e8;color:#8a1c1c}
.nota{font-size:14px;color:#555;margin-top:6px}
.tel{display:flex;gap:8px}
.tel span{padding:14px 12px;background:#eee;border-radius:12px;font-size:17px;white-space:nowrap}
.tel input{min-width:0}
.oculto{display:none}
.extra{margin-top:8px}
.janela{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);overflow-y:auto;overflow-x:hidden;z-index:10;padding:12px}
.jbox{background:#fff;border-radius:16px;padding:16px;max-width:600px;margin:0 auto 24px}
</style>
</head>
<body>
<header>BBabilônia · Minhas moradas</header>

<div class="card" id="boxLogin">
  <h2>Entrar na conta</h2>
  <label>Email</label>
  <input id="email" type="email" autocomplete="email">
  <label>Palavra-passe</label>
  <input id="senha" type="password" autocomplete="current-password">
  <button onclick="entrar(false)">Entrar</button>
  <button class="sec" onclick="entrar(true)">Criar conta</button>
  <div class="msg" id="msgLogin"></div>
</div>

<div id="boxApp" class="oculto">
  <div class="card">
    <h2>Moradas guardadas</h2>
    <div class="nota" style="margin:0 0 12px">Ao pagar, vai escolher uma destas moradas.</div>
    <div id="lista"></div>
    <button onclick="abrirJanela()">+ Nova morada</button>
    <button class="sec" onclick="sair()">Sair da conta</button>
  </div>
</div>

<div id="janela" class="janela oculto">
  <div class="jbox">
    <h2 id="jtitulo">Nova morada</h2>

    <label>Tipo de envio</label>
    <select id="tipo" onchange="mudarTipo()">
      <option value="entrega">Envio interno (dentro do país)</option>
      <option value="internacional">Envio externo (fora do país)</option>
    </select>
    <div class="nota" id="notaTipo"></div>

    <label>Nome do destinatário</label>
    <input id="nome" autocomplete="name">

    <label>País</label>
    <select id="pais" onchange="mudarPais()"></select>

    <label>Telemóvel</label>
    <div class="tel"><span id="prefixo">+258</span><input id="tel" type="tel" inputmode="numeric"></div>

    <label>Província / Região (escolha na lista)</label>
    <select id="provincia" onchange="mudarProvincia()"></select>
    <input id="provOutra" class="oculto extra" placeholder="Escreva a região">

    <label>Distrito (escolha na lista)</label>
    <select id="distrito" onchange="mudarDistrito()"></select>
    <input id="distOutra" class="oculto extra" placeholder="Escreva o distrito">

    <label>Cidade / localidade (escolha na lista)</label>
    <select id="cidade" onchange="mudarCidade()"></select>
    <input id="cidadeOutra" class="oculto extra" placeholder="Escreva a cidade">
    <div class="nota" id="notaGeo"></div>

    <label>Código postal</label>
    <input id="cp" inputmode="numeric">

    <label>Morada completa (andar, rua, bairro…)</label>
    <input id="endereco">

    <label id="lblMarca">Marca de envio</label>
    <input id="marca">
    <div class="nota">A marca vai junto da morada para o fornecedor a escrever na caixa externa.</div>

    <button onclick="guardarMorada()">Guardar morada</button>
    <button class="sec" onclick="fechar()">Cancelar</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
var URL_SB='https://dsfoqoeawvjafypycldz.supabase.co';
var KEY='sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0';
var GN_USER='jovenciofoguete';
var GN='https://secure.geonames.org/';

var DIAL={AF:93,AL:355,DZ:213,AD:376,AO:244,AG:1268,AR:54,AM:374,AU:61,AT:43,AZ:994,BS:1242,BH:973,BD:880,BB:1246,BY:375,BE:32,BZ:501,BJ:229,BT:975,BO:591,BA:387,BW:267,BR:55,BN:673,BG:359,BF:226,BI:257,CV:238,KH:855,CM:237,CA:1,CF:236,TD:235,CL:56,CN:86,CO:57,KM:269,CG:242,CD:243,CR:506,CI:225,HR:385,CU:53,CY:357,CZ:420,DK:45,DJ:253,DM:1767,DO:1809,EC:593,EG:20,SV:503,GQ:240,ER:291,EE:372,SZ:268,ET:251,FJ:679,FI:358,FR:33,GA:241,GM:220,GE:995,DE:49,GH:233,GR:30,GD:1473,GT:502,GN:224,GW:245,GY:592,HT:509,HN:504,HU:36,IS:354,IN:91,ID:62,IR:98,IQ:964,IE:353,IL:972,IT:39,JM:1876,JP:81,JO:962,KZ:7,KE:254,KI:686,XK:383,KW:965,KG:996,LA:856,LV:371,LB:961,LS:266,LR:231,LY:218,LI:423,LT:370,LU:352,MG:261,MW:265,MY:60,MV:960,ML:223,MT:356,MH:692,MR:222,MU:230,MX:52,FM:691,MD:373,MC:377,MN:976,ME:382,MA:212,MZ:258,MM:95,NA:264,NR:674,NP:977,NL:31,NZ:64,NI:505,NE:227,NG:234,MK:389,NO:47,OM:968,PK:92,PW:680,PS:970,PA:507,PG:675,PY:595,PE:51,PH:63,PL:48,PT:351,QA:974,RO:40,RU:7,RW:250,KN:1869,LC:1758,VC:1784,WS:685,SM:378,ST:239,SA:966,SN:221,RS:381,SC:248,SL:232,SG:65,SK:421,SI:386,SB:677,SO:252,ZA:27,KR:82,SS:211,ES:34,LK:94,SD:249,SR:597,SE:46,CH:41,SY:963,TW:886,TJ:992,TZ:255,TH:66,TL:670,TG:228,TO:676,TT:1868,TN:216,TR:90,TM:993,TV:688,UG:256,UA:380,AE:971,GB:44,US:1,UY:598,UZ:998,VU:678,VA:379,VE:58,VN:84,YE:967,ZM:260,ZW:263,HK:852,MO:853};

var ptN=null;
try{ptN=new Intl.DisplayNames(['pt'],{type:'region'})}catch(e){}
var PAISES=Object.keys(DIAL).map(function(c){
  var pt=c;
  try{pt=ptN.of(c)||c}catch(e){}
  return {c:c,pt:pt,tel:'+'+DIAL[c]};
}).sort(function(a,b){
  if(a.c==='MZ')return -1; if(b.c==='MZ')return 1;
  return a.pt.localeCompare(b.pt,'pt');
});

var MORADAS=[], editId=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function aviso(id,txt,ok){var m=$(id);m.textContent=txt;m.className='msg '+(ok?'ok':'err');m.style.display='block'}
function pais(){return PAISES.filter(function(x){return x.c===$('pais').value})[0]}

/* ---------- sessão ---------- */
function sessao(){try{return JSON.parse(localStorage.getItem('bb_sessao'))}catch(e){return null}}
function guardarSessao(d){
  localStorage.setItem('bb_sessao',JSON.stringify({at:d.access_token,refresh:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000,uid:d.user.id,email:d.user.email}));
}
async function token(){
  var s=sessao(); if(!s) return null;
  if(Date.now()>s.exp-60000){
    var r=await fetch(URL_SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh})});
    if(!r.ok){localStorage.removeItem('bb_sessao');return null}
    var d=await r.json(); guardarSessao(d); return d.access_token;
  }
  return s.at;
}
async function entrar(criar){
  var email=$('email').value.trim(), senha=$('senha').value;
  if(!email||!senha){aviso('msgLogin','Escreva o email e a palavra-passe.');return}
  try{
    var url=criar?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
    var r=await fetch(URL_SB+url,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:senha})});
    var d=await r.json();
    if(!r.ok){aviso('msgLogin',d.msg||d.error_description||d.message||'Não foi possível entrar.');return}
    if(!d.access_token){aviso('msgLogin','Conta criada. Confirme o email que recebeu e depois toque em Entrar.',true);return}
    guardarSessao(d); abrir();
  }catch(e){aviso('msgLogin','Sem ligação à internet.')}
}
function sair(){localStorage.removeItem('bb_sessao');location.reload()}

/* ---------- base de dados da loja ---------- */
async function api(metodo,caminho,corpo){
  var t=await token();
  if(!t){$('boxApp').className='oculto';$('boxLogin').className='card';throw new Error('Entre na conta.')}
  var r=await fetch(URL_SB+'/rest/v1/'+caminho,{method:metodo,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'return=minimal'},body:corpo?JSON.stringify(corpo):undefined});
  if(!r.ok){var e={};try{e=await r.json()}catch(x){}throw new Error(e.message||('Erro '+r.status))}
  return metodo==='GET'?r.json():null;
}

async function carregar(){
  var el=$('lista');
  try{
    var l=await api('GET','moradas?select=*&order=created_at.desc');
    MORADAS=l;
    if(!l.length){el.innerHTML='<p>Ainda não tem moradas guardadas.</p>';return}
    el.innerHTML=l.map(function(m){
      var ext=m.tipo==='internacional';
      var partes=[m.endereco,m.cidade,m.distrito,m.provincia,m.pais].filter(Boolean).join(', ');
      return '<div class="end"><span class="tag'+(ext?' ext':'')+'">'+(ext?'Envio externo':'Envio interno')+'</span><br>'
        +'<b>'+esc(m.nome)+'</b> · '+esc(m.telefone)+'<br>'+esc(partes)+(m.codigo_postal?' '+esc(m.codigo_postal):'')
        +(m.marca?'<br>Marca: '+esc(m.marca):'')
        +'<div class="par"><button onclick="editar(\''+m.id+'\')">Editar</button><button class="sec" onclick="apagar(\''+m.id+'\')">Apagar</button></div></div>';
    }).join('');
  }catch(e){el.innerHTML='<p>'+esc(e.message)+'</p>'}
}

async function apagar(id){
  if(!confirm('Apagar esta morada?'))return;
  try{await api('DELETE','moradas?id=eq.'+id);carregar()}catch(e){alert(e.message)}
}

/* ---------- GeoNames: país → província → distrito → cidade ---------- */
var jpN=0, ULTIMO_ERRO='';
function jp(url){
  return new Promise(function(res){
    var nome='gncb'+(++jpN), s=document.createElement('script'), fim=false, t;
    function fechar(v){
      if(fim) return; fim=true; clearTimeout(t);
      try{delete window[nome]}catch(e){window[nome]=undefined}
      if(s.parentNode) s.parentNode.removeChild(s);
      res(v);
    }
    t=setTimeout(function(){fechar(null)},20000);
    window[nome]=function(d){fechar(d)};
    s.onerror=function(){fechar(null)};
    s.src=GN+url+(url.indexOf('?')>-1?'&':'?')+'username='+GN_USER+'&callback='+nome;
    document.head.appendChild(s);
  });
}
function lerCache(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function gravarCache(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var ITENS={}, TOK={p:0,d:0,c:0}, SEMDIST=false;
function reg(l,nivel){(l||[]).forEach(function(x){x.nivel=nivel;ITENS[x.id]=x})}

function montar(d){
  var visto={}, l=[];
  d.geonames.forEach(function(x){
    if(!x.name||visto[x.geonameId]) return;
    visto[x.geonameId]=1;
    l.push({id:String(x.geonameId),n:x.name,cc:x.countryCode||'',a1:x.adminCode1||'',a2:x.adminCode2||'',a3:x.adminCode3||''});
  });
  l.sort(function(a,b){return a.n.localeCompare(b.n,'pt')});
  return l;
}
async function buscar(params,chave,max){
  var c=lerCache(chave); if(c) return c;
  var d=await jp('searchJSON?'+params+'&maxRows='+(max||1000));
  if(d&&d.status&&d.status.message) ULTIMO_ERRO=d.status.message;
  if(!d||!d.geonames) return null;
  var l=montar(d);
  if(l.length) gravarCache(chave,l);
  return l;
}
async function filhos(id){
  var chave='gn2f_'+id, c=lerCache(chave); if(c) return c;
  var d=await jp('childrenJSON?geonameId='+id+'&maxRows=1000');
  if(d&&d.status&&d.status.message) ULTIMO_ERRO=d.status.message;
  if(!d||!d.geonames) return null;
  var l=montar(d);
  if(l.length) gravarCache(chave,l);
  return l;
}
async function listarDistritos(p){
  var base='country='+p.cc+'&adminCode1='+encodeURIComponent(p.a1);
  var l2=await buscar(base+'&featureCode=ADM2','gn2d2_'+p.cc+'_'+p.a1);
  if(l2&&l2.length) return {l:l2,nivel:2};
  var l3=await buscar(base+'&featureCode=ADM3','gn2d3_'+p.cc+'_'+p.a1);
  if(l3&&l3.length) return {l:l3,nivel:3};
  return {l:(l2===null&&l3===null)?null:[],nivel:0};
}
async function listarCidades(it){
  var par='country='+it.cc+'&adminCode1='+encodeURIComponent(it.a1);
  if(it.nivel===2){
    if(!it.a2) return await filhos(it.id);
    par+='&adminCode2='+encodeURIComponent(it.a2);
  }
  if(it.nivel===3){
    if(!it.a3) return await filhos(it.id);
    if(it.a2) par+='&adminCode2='+encodeURIComponent(it.a2);
    par+='&adminCode3='+encodeURIComponent(it.a3);
  }
  return await buscar(par+'&featureClass=P&orderby=population','gn2c_'+par,500);
}

function encher(sel,l,outro){
  var s=$(sel);
  s.innerHTML='<option value="">Escolha na lista</option>'
    +(l||[]).map(function(x){return '<option value="'+x.id+'">'+esc(x.n)+'</option>'}).join('')
    +'<option value="__outra">Outra (escrever)</option>';
  s.value='';
  $(outro).className='oculto extra';
  $('notaGeo').textContent=(l===null)?('Não foi possível carregar a lista agora'+(ULTIMO_ERRO?' ('+ULTIMO_ERRO+')':'')+'. Escolha "Outra (escrever)" ou tente mais tarde.'):'';
}
function fixarOutra(sel,outro){
  var s=$(sel);
  s.innerHTML='<option value="__outra">Outra (escrever)</option>';
  s.value='__outra';
  $(outro).className='extra';
}
function limparCidade(){
  $('cidade').innerHTML='<option value="">Escolha primeiro o distrito</option>';
  $('cidadeOutra').className='oculto extra';
}
function limparDistrito(){
  SEMDIST=false;
  $('distrito').innerHTML='<option value="">Escolha primeiro a província</option>';
  $('distOutra').className='oculto extra';
  limparCidade();
}
async function preencherCidades(it){
  var meu=++TOK.c;
  $('cidadeOutra').className='oculto extra';
  $('cidade').innerHTML='<option value="">A carregar…</option>';
  var l=await listarCidades(it);
  if(meu!==TOK.c) return;
  encher('cidade',l,'cidadeOutra');
}
async function mudarPais(){
  var c=pais(), meu=++TOK.p;
  ++TOK.d; ++TOK.c;
  $('prefixo').textContent=c.tel;
  $('provOutra').className='oculto extra';
  $('notaGeo').textContent='';
  $('provincia').innerHTML='<option value="">A carregar…</option>';
  limparDistrito();
  var l=await buscar('country='+c.c+'&featureCode=ADM1','gn2p_'+c.c);
  if(meu!==TOK.p) return;
  reg(l,1);
  encher('provincia',l,'provOutra');
}
async function mudarProvincia(){
  var v=$('provincia').value, meu=++TOK.d;
  ++TOK.c;
  $('provOutra').className=v==='__outra'?'extra':'oculto extra';
  if(!v){limparDistrito();return}
  if(v==='__outra'){SEMDIST=false;fixarOutra('distrito','distOutra');fixarOutra('cidade','cidadeOutra');return}
  var p=ITENS[v];
  SEMDIST=false;
  limparCidade();
  $('distOutra').className='oculto extra';
  $('distrito').innerHTML='<option value="">A carregar…</option>';
  var r=await listarDistritos(p);
  if(meu!==TOK.d) return;
  if(r.nivel===0){
    SEMDIST=true;
    $('distrito').innerHTML='<option value="">Sem distritos na lista (pode saltar)</option><option value="__outra">Outra (escrever)</option>';
    $('distrito').value='';
    await preencherCidades(p);
    return;
  }
  reg(r.l,r.nivel);
  encher('distrito',r.l,'distOutra');
}
async function mudarDistrito(){
  var v=$('distrito').value;
  $('distOutra').className=v==='__outra'?'extra':'oculto extra';
  if(!v){if(!SEMDIST){++TOK.c;limparCidade()}return}
  if(v==='__outra'){if(!SEMDIST){++TOK.c;fixarOutra('cidade','cidadeOutra')}return}
  await preencherCidades(ITENS[v]);
}
function mudarCidade(){
  $('cidadeOutra').className=$('cidade').value==='__outra'?'extra':'oculto extra';
}
function val(sel,outro){
  var s=$(sel);
  if(s.value==='__outra') return $(outro).value.trim();
  if(!s.value) return '';
  return s.options[s.selectedIndex].text;
}
function poe(sel,outro,valor){
  var s=$(sel), i, achou=-1;
  if(!valor){$(outro).className='oculto extra';return}
  for(i=0;i<s.options.length;i++){if(s.options[i].text===valor){achou=i;break}}
  if(achou>-1){s.selectedIndex=achou;$(outro).value=''}
  else{
    for(i=0;i<s.options.length;i++){if(s.options[i].value==='__outra'){s.selectedIndex=i;break}}
    $(outro).value=valor;
  }
  $(outro).className=s.value==='__outra'?'extra':'oculto extra';
}

/* ---------- janela criar / editar ---------- */
function limparForm(){
  ['nome','tel','cp','endereco','marca','provOutra','distOutra','cidadeOutra'].forEach(function(i){$(i).value=''});
  $('tipo').value='entrega';
}
function abrirJanela(){
  editId=null;
  $('jtitulo').textContent='Nova morada';
  $('msg').style.display='none';
  limparForm(); mudarTipo();
  $('pais').value='MZ'; mudarPais();
  $('janela').className='janela';
}
function fechar(){$('janela').className='janela oculto'}
async function editar(id){
  var m=MORADAS.filter(function(x){return x.id===id})[0]; if(!m) return;
  editId=id;
  $('jtitulo').textContent='Editar morada';
  $('msg').style.display='none';
  $('janela').className='janela';
  limparForm();
  $('tipo').value=m.tipo; mudarTipo();
  $('nome').value=m.nome||'';
  var pc=PAISES.filter(function(x){return x.pt===m.pais})[0]||PAISES[0];
  $('pais').value=pc.c;
  await mudarPais();
  var tel=m.telefone||'';
  if(tel.indexOf(pc.tel)===0) tel=tel.slice(pc.tel.length);
  $('tel').value=tel.trim();
  poe('provincia','provOutra',m.provincia);
  await mudarProvincia();
  poe('distrito','distOutra',m.distrito);
  await mudarDistrito();
  poe('cidade','cidadeOutra',m.cidade);
  $('cp').value=m.codigo_postal||'';
  $('endereco').value=m.endereco||'';
  $('marca').value=m.marca||'';
}

async function guardarMorada(){
  var tipo=$('tipo').value, pc=pais();
  var prov=val('provincia','provOutra'), dist=val('distrito','distOutra'), cid=val('cidade','cidadeOutra');
  if(!cid&&dist) cid=dist;
  var d={
    tipo:tipo,
    nome:$('nome').value.trim(),
    telefone:(pc.tel+' '+$('tel').value.trim()).trim(),
    pais:pc.pt,
    provincia:prov,
    distrito:dist,
    cidade:cid,
    codigo_postal:$('cp').value.trim(),
    endereco:$('endereco').value.trim(),
    marca:$('marca').value.trim()
  };
  if(!d.nome||!$('tel').value.trim()||!d.provincia||!d.cidade||!d.codigo_postal||!d.endereco){aviso('msg','Preencha todos os campos obrigatórios e escolha a província e a cidade na lista.');return}
  if(tipo==='internacional'&&!d.marca){aviso('msg','No envio externo a marca de envio é obrigatória.');return}
  try{
    if(editId) await api('PATCH','moradas?id=eq.'+editId,d);
    else await api('POST','moradas',d);
    fechar(); carregar();
  }catch(e){aviso('msg',e.message)}
}

function mudarTipo(){
  var ext=$('tipo').value==='internacional';
  $('lblMarca').textContent=ext?'Marca de envio (obrigatória)':'Marca de envio (opcional)';
  $('notaTipo').textContent=ext
    ?'Para receber encomendas vindas de outro país. Pode escolher esta morada ao pagar o transporte internacional.'
    :'Para receber encomendas dentro do seu país.';
}
function abrir(){
  $('boxLogin').className='oculto';
  $('boxApp').className='';
  $('pais').innerHTML=PAISES.map(function(x){return '<option value="'+x.c+'">'+esc(x.pt)+'</option>'}).join('');
  $('pais').value='MZ';
  mudarTipo(); mudarPais(); carregar();
}
if(sessao()) abrir();
</script>
