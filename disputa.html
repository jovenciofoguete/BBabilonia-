<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--fundo:#f3f0fb;--papel:#fff;--texto:#1b1740;--suave:#6b6590;--linha:#e7e3f3;--lar:#ea580c}
@media (prefers-color-scheme:dark){:root{--fundo:#110e22;--papel:#1d1838;--texto:#f3f0ff;--suave:#a9a2cf;--linha:#2d2752}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);line-height:1.45}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;display:flex;align-items:center;gap:6px;padding:10px 8px;box-shadow:0 4px 14px #0003}
.bar button{border:0;background:none;color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%}
.bar h1{font-size:18px}
main{max-width:620px;margin:0 auto;padding:14px 14px 40px}
.box{background:var(--papel);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px #0002}
.box h3{font-size:15.5px;margin-bottom:10px}
.fases{display:flex;align-items:flex-start;margin:2px 0 12px}
.fase{flex:1;text-align:center;font-size:11.5px;color:var(--suave);position:relative;padding:0 2px}
.fase b{display:flex;width:30px;height:30px;margin:0 auto 5px;border-radius:50%;align-items:center;justify-content:center;background:var(--linha);color:var(--suave);font-size:13px;position:relative;z-index:1}
.fase:not(:first-child)::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:3px;background:var(--linha)}
.fase.feita b{background:#10b981;color:#fff}.fase.feita::before{background:#10b981}
.fase.agora{color:var(--texto);font-weight:800}.fase.agora b{background:var(--lar);color:#fff;box-shadow:0 0 0 4px rgba(234,88,12,.25)}.fase.agora::before{background:#10b981}
.fase.salto b{background:var(--linha);color:var(--suave)}.fase.salto{opacity:.5}
.vez{border-radius:14px;padding:12px;font-size:14.5px;background:#fff7ed;border:2px solid #fb923c;color:#9a3412}
.vez.az{background:#eff6ff;border-color:#60a5fa;color:#1e3a8a}.vez.ok{background:#ecfdf5;border-color:#34d399;color:#065f46}.vez.no{background:#fef2f2;border-color:#f87171;color:#991b1b}
.vez b{display:block;font-size:15.5px;margin-bottom:2px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.res div{background:var(--fundo);border-radius:12px;padding:9px 10px;font-size:12.5px;color:var(--suave)}
.res div b{display:block;font-size:15px;color:var(--texto)}
.msg{display:flex;gap:10px;margin:14px 0}
.msg .av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.msg.cliente .av{background:#f59e0b}.msg.fornecedor .av{background:#0ea5e9}.msg.admin .av{background:#10b981}.msg.sistema .av{background:#64748b}
.msg .c{flex:1;min-width:0}.msg .q{font-size:12.5px;color:var(--suave)}.msg .q b{color:var(--texto)}
.msg .ac{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:12px;background:var(--linha);margin:3px 0}
.msg p{font-size:14.5px;white-space:pre-line;word-wrap:break-word}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.fotos>div{position:relative}
.fotos img,.fotos video{width:86px;height:86px;object-fit:cover;border-radius:12px;background:#000;display:block}
.fotos .x{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:14px;border:0}
.fotos .du{position:absolute;bottom:4px;right:4px;background:#000a;color:#fff;font-size:11px;padding:1px 5px;border-radius:6px}
.add{width:86px;height:86px;border:2px dashed #94a3b8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--suave);text-align:center;line-height:1.2}
.add span{font-size:24px}
.op{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--linha);border-radius:12px;padding:11px;margin:8px 0;font-size:14.5px}
.op.on{border-color:var(--lar);background:rgba(234,88,12,.07)}.op input{width:20px;height:20px;margin-top:1px;flex:none}
.op small{display:block;color:var(--suave);font-size:12.5px}
textarea,input[type=number],input[type=email],input[type=password]{width:100%;padding:12px;border:2px solid var(--linha);border-radius:12px;font:inherit;font-size:16px;background:var(--fundo);color:var(--texto)}
textarea:focus,input:focus{outline:none;border-color:var(--lar)}
.bt{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;font:inherit;font-size:15.5px;font-weight:800;color:#fff;background:linear-gradient(90deg,#f59e0b,#ea580c)}
.bt.v{background:linear-gradient(90deg,#10b981,#059669)}.bt.a{background:linear-gradient(90deg,#0ea5e9,#2563eb)}.bt.r{background:#ef4444}
.bt.l{background:transparent;color:var(--suave);border:2px solid var(--linha)}.bt:disabled{opacity:.5}
.err{color:#dc2626;font-size:14px;margin-top:8px}.inf{color:var(--suave);font-size:13px;margin-top:6px}
.prog{height:8px;border-radius:5px;background:var(--linha);overflow:hidden;margin-top:8px;display:none}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#10b981,#0ea5e9);transition:width .2s}
.papel{display:flex;gap:6px;margin-bottom:12px}.papel button{flex:1;border:0;border-radius:12px;padding:10px 4px;font:inherit;font-size:13px;font-weight:700;background:var(--papel);color:var(--suave)}
.papel button.on{background:var(--lar);color:#fff}
.hide{display:none}
</style>
</head>
<body>
<div class="bar"><button id="voltar" aria-label="Voltar">&#8592;</button><h1 id="tit">⚠️ Disputa</h1></div>
<main>
 <div id="login" class="box hide"><h3>Entre na sua conta</h3>
  <input id="em" type="email" placeholder="Email"><br><br><input id="pw" type="password" placeholder="Palavra-passe">
  <button class="bt" id="ent">Entrar</button><div class="err" id="lmsg"></div></div>
 <div id="app"><div class="box">A carregar…</div></div>
</main>
<script>
var U='https://dsfoqoeawvjafypycldz.supabase.co',K='sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0',ADMIN='jovenciofoguete1904@gmail.com';
var sb=supabase.createClient(U,K);
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function arr(x){if(typeof x==='string'){try{x=JSON.parse(x)}catch(e){x=[]}}return Array.isArray(x)?x:[]}
function din(v,m){return Number(v||0).toLocaleString('pt-PT',{maximumFractionDigits:2})+' '+(m||'')}
function eVideo(u){return /\.(mp4|mov|webm|3gp|m4v)(\?|$)/i.test(u)}
var Q=new URLSearchParams(location.search),PED=Q.get('pedido'),DID=Q.get('id');
var eu=null,ped=null,disp=null,msgs=[],papeis=[],papel='';
var MOTIVOS=[['Não recebi','O pacote não chegou'],['Diferente da descrição ou fotos','Não é o que estava no anúncio'],['Danificado','Chegou partido ou estragado'],['Faltam peças ou quantidade','Veio menos do que comprei'],['Tamanho ou cor errados','Não é o tamanho ou a cor que escolhi'],['Falsificado','Não é original']];
var PEDE={reembolso_total:['Reembolso total','Devolvem-me todo o valor'],reembolso_parcial:['Reembolso parcial','Fico com o produto e devolvem-me uma parte'],devolucao:['Devolver o produto','Envio o produto de volta e recebo o dinheiro']};
var FINAL={fornecedor_aceitou:'O fornecedor aceitou',acordo:'Acordo entre as partes',ganha_cliente:'A favor do cliente',ganha_fornecedor:'A favor do fornecedor',dividida:'Valor dividido',cancelada:'Cancelada pelo cliente'};
var ACAO={abrir:'Abriu a disputa',mensagem:'Nova mensagem / prova',propor:'Propôs outro valor',aceitar:'Aceitou o pedido',recusar:'Recusou',aceitar_proposta:'Aceitou a proposta',intervencao:'Pediu a intervenção da BBabilônia',cancelar:'Cancelou',nota:'Nota do Atendimento',prazo:'Deu mais dias ao prazo',final:'Decisão final'};
var QUEM={cliente:['Cliente','🛒'],fornecedor:['Fornecedor','🏪'],admin:['Atendimento BBabilônia','🎧'],sistema:['BBabilônia','⚖️']};
var MAX_VIDEO_SEG=60,MAX_VIDEO_MB=100,MAX_PROVAS=6;

/* ---------- Provas (fotos e vídeos) com envio rápido e barra de progresso ---------- */
function Provas(){this.l=[]}
Provas.prototype.html=function(id){
 return'<div class="fotos">'+this.l.map(function(x,j){return'<div>'+(x.video?'<video src="'+x.prev+'" muted playsinline></video><span class="du">'+Math.round(x.seg)+'s</span>':'<img src="'+x.prev+'" alt="">')+'<button class="x" data-rm="'+j+'" aria-label="Tirar">×</button></div>'}).join('')+
  (this.l.length<MAX_PROVAS?'<label class="add"><span>📷</span>Foto ou vídeo<input type="file" accept="image/jpeg,image/png,image/webp,video/*" hidden id="'+id+'"></label>':'')+'</div>'+
  '<p class="inf" id="'+id+'-inf">Fotos e vídeos de até 1 minuto. Sem contactos nas imagens.</p><div class="prog" id="'+id+'-p"><i></i></div>';
};
Provas.prototype.ligar=function(id,redesenhar,erro){
 var me=this;
 document.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){me.l.splice(+b.getAttribute('data-rm'),1);redesenhar()}});
 var fi=$(id);if(!fi)return;
 fi.onchange=async function(){
  var f=this.files&&this.files[0];this.value='';if(!f)return;erro('');
  var inf=$(id+'-inf');
  if(/^video\//.test(f.type)){
   if(f.size>MAX_VIDEO_MB*1048576){erro('O vídeo é grande demais (máximo '+MAX_VIDEO_MB+' MB).');return}
   inf.textContent='A ver a duração do vídeo…';
   var seg=await duracao(f);
   if(!seg){erro('Não foi possível ler este vídeo. Tente gravar em MP4.');inf.textContent='';return}
   if(seg>MAX_VIDEO_SEG+0.5){erro('O vídeo tem '+Math.round(seg)+' segundos. O máximo é 1 minuto.');inf.textContent='';return}
   me.l.push({file:f,prev:URL.createObjectURL(f),video:true,seg:seg});redesenhar();return;
  }
  if(!window.FiltroImagem){erro('Não foi possível verificar a imagem.');return}
  inf.textContent='A verificar a imagem…';
  var r=await window.FiltroImagem.verificar(f,function(t){inf.textContent=t});
  if(!r.ok){erro(r.motivo);inf.textContent='';return}
  me.l.push({file:f,prev:URL.createObjectURL(f)});redesenhar();
 };
};
Provas.prototype.enviar=async function(id,botao){
 var urls=[],tok=(await sb.auth.getSession()).data.session.access_token,bar=$(id+'-p');
 var total=this.l.reduce(function(t,x){return t+x.file.size},0),feito=0;
 if(bar&&this.l.length){bar.style.display='block'}
 for(var j=0;j<this.l.length;j++){
  var f=this.l[j].file,ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  var cam=eu.id+'/disputa-'+Date.now()+'-'+j+'.'+ext;
  if(botao)botao.textContent='A enviar '+(j+1)+' de '+this.l.length+'…';
  await envio(cam,f,tok,function(p){if(bar)bar.firstChild.style.width=Math.round((feito+p*f.size)*100/total)+'%'});
  feito+=f.size;
  urls.push(U+'/storage/v1/object/public/produtos/'+cam.split('/').map(encodeURIComponent).join('/'));
 }
 return urls;
};
function duracao(f){return new Promise(function(ok){var v=document.createElement('video'),u=URL.createObjectURL(f),t=setTimeout(function(){ok(0)},15000);v.preload='metadata';v.muted=true;
 v.onloadedmetadata=function(){clearTimeout(t);var d=v.duration;URL.revokeObjectURL(u);ok(isFinite(d)?d:0)};v.onerror=function(){clearTimeout(t);ok(0)};v.src=u})}
function envio(cam,f,tok,prog){return new Promise(function(ok,falha){
 var x=new XMLHttpRequest();x.open('POST',U+'/storage/v1/object/produtos/'+cam.split('/').map(encodeURIComponent).join('/'));
 x.setRequestHeader('Authorization','Bearer '+tok);x.setRequestHeader('apikey',K);x.setRequestHeader('x-upsert','false');x.setRequestHeader('Content-Type',f.type||'application/octet-stream');
 x.upload.onprogress=function(e){if(e.lengthComputable)prog(e.loaded/e.total)};
 x.onload=function(){if(x.status>=200&&x.status<300){prog(1);ok()}else{var m='';try{m=JSON.parse(x.responseText).message}catch(e){}falha(new Error('O ficheiro não foi enviado'+(m?': '+m:'.')))}};
 x.onerror=function(){falha(new Error('Sem ligação à internet. Tente outra vez.'))};
 x.send(f);
})}
function provasVer(l){return l.length?'<div class="fotos">'+l.map(function(u){return eVideo(u)?'<div><video src="'+esc(u)+'" controls playsinline preload="metadata"></video></div>':'<div><a href="'+esc(u)+'" target="_blank"><img loading="lazy" src="'+esc(u)+'" alt=""></a></div>'}).join('')+'</div>':''}
function textoOk(t){return!t||!window.FiltroContactos||window.FiltroContactos.verificar(t).ok}

/* ---------- Abrir disputa ---------- */
var NOVA={motivo:'',pede:'',valor:'',texto:'',provas:new Provas()};
function formNova(){
 $('tit').textContent='⚠️ Abrir disputa';
 var h=resumoPedido()+
 '<div class="box">'+fasesHtml('nova')+'<div class="vez"><b>Antes de abrir</b>Fale primeiro com o fornecedor no chat. Se não resolver, abra a disputa: o dinheiro fica congelado até haver decisão.</div></div>'+
 '<div class="box"><h3>1. Qual é o problema?</h3>'+MOTIVOS.map(function(m){return'<label class="op'+(NOVA.motivo===m[0]?' on':'')+'"><input type="radio" name="mo" value="'+esc(m[0])+'"'+(NOVA.motivo===m[0]?' checked':'')+'><div><b>'+esc(m[0])+'</b><small>'+esc(m[1])+'</small></div></label>'}).join('')+'</div>'+
 '<div class="box"><h3>2. O que pretende?</h3>'+Object.keys(PEDE).map(function(k){return'<label class="op'+(NOVA.pede===k?' on':'')+'"><input type="radio" name="pe" value="'+k+'"'+(NOVA.pede===k?' checked':'')+'><div><b>'+PEDE[k][0]+'</b><small>'+PEDE[k][1]+'</small></div></label>'}).join('')+
 '<div class="'+(NOVA.pede==='reembolso_parcial'?'':'hide')+'"><p class="inf">Valor a devolver (máximo '+din(ped.total,ped.currency)+')</p><input id="valor" type="number" min="1" step="0.01" inputmode="decimal" value="'+esc(NOVA.valor)+'"></div></div>'+
 '<div class="box"><h3>3. Explique o que aconteceu</h3><textarea id="texto" rows="4" maxlength="2000" placeholder="Conte com detalhe o problema">'+esc(NOVA.texto)+'</textarea>'+
 '<h3 style="margin-top:14px">4. Provas '+(NOVA.motivo&&NOVA.motivo!=='Não recebi'?'(obrigatório)':'')+'</h3>'+NOVA.provas.html('fn')+
 '<button class="bt" id="abrir">Abrir disputa</button><div class="err" id="msg"></div>'+
 '<p class="inf">O fornecedor tem 3 dias para responder. Se não responder, recebe o reembolso automaticamente.</p></div>';
 $('app').innerHTML=h;
 function guarda(){NOVA.texto=$('texto').value;var v=$('valor');if(v)NOVA.valor=v.value}
 document.querySelectorAll('input[name=mo]').forEach(function(r){r.onchange=function(){guarda();NOVA.motivo=r.value;formNova()}});
 document.querySelectorAll('input[name=pe]').forEach(function(r){r.onchange=function(){guarda();NOVA.pede=r.value;formNova()}});
 NOVA.provas.ligar('fn',function(){guarda();formNova()},function(t){$('msg').textContent=t});
 $('abrir').onclick=async function(){
  var b=this,m=$('msg');guarda();m.textContent='';
  if(!NOVA.motivo)return m.textContent='Escolha qual é o problema.';
  if(!NOVA.pede)return m.textContent='Escolha o que pretende.';
  var val=NOVA.pede==='reembolso_parcial'?Number(String(NOVA.valor).replace(',','.')):null;
  if(NOVA.pede==='reembolso_parcial'&&(!val||val<=0||val>Number(ped.total)))return m.textContent='Escreva um valor válido, até '+din(ped.total,ped.currency)+'.';
  if(NOVA.texto.trim().length<10)return m.textContent='Explique o problema com pelo menos 10 letras.';
  if(!textoOk(NOVA.texto))return m.textContent='O texto tem contactos, links ou redes sociais. Não é permitido.';
  if(NOVA.motivo!=='Não recebi'&&!NOVA.provas.l.length)return m.textContent='Adicione pelo menos uma foto ou vídeo como prova.';
  b.disabled=true;
  try{
   var urls=await NOVA.provas.enviar('fn',b);b.textContent='A abrir…';
   var r=await sb.rpc('abrir_disputa',{p_pedido:String(ped.id),p_motivo:NOVA.motivo,p_pedido_tipo:NOVA.pede,p_valor:val,p_descricao:NOVA.texto.trim(),p_provas:JSON.stringify(urls)});
   if(r.error)throw new Error(r.error.message);
   DID=r.data;history.replaceState({},'','disputa.html?id='+encodeURIComponent(DID));carregar();
  }catch(e){m.textContent=e.message||String(e);b.disabled=false;b.textContent='Abrir disputa'}
 };
}

/* ---------- Ver a disputa ---------- */
function fasesHtml(est){
 var passou=msgs.some(function(x){return x.acao==='intervencao'||x.acao==='recusar'||x.autor==='admin'})||est==='em_analise';
 var negoc=msgs.some(function(x){return x.acao==='propor'})||est==='negociacao';
 var fim=!!FINAL[est];
 var f=[['📝','Disputa aberta'],['🤝','Negociação'],['🎧','Intervenção da BBabilônia'],['⚖️','Decisão final']];
 var idx=est==='nova'?-1:est==='aberta'?0:est==='negociacao'?1:est==='em_analise'?2:3;
 return'<div class="fases">'+f.map(function(s,i){
  var c=i<idx?'feita':i===idx?(fim?'feita':'agora'):'';
  if(fim&&i===2&&!passou)c='salto';if(fim&&i===1&&!negoc&&c==='feita'&&!passou)c='salto';
  return'<div class="fase '+c+'"><b>'+(c==='feita'?'✓':s[0])+'</b>'+s[1]+'</div>'}).join('')+'</div>';
}
function falta(t){if(!t)return'';var h=Math.max(0,Math.ceil((new Date(t)-new Date())/3600000));return h>=24?Math.ceil(h/24)+' dia(s)':h+' hora(s)'}
function vezHtml(){
 var e=disp.estado,f=falta(disp.prazo||disp.prazo_fornecedor),de=disp.proposta_de,pv=din(disp.proposta_valor,disp.moeda);
 var NOME={cliente:'o cliente',fornecedor:'o fornecedor',admin:'o Atendimento'};
 if(e==='aberta')return papel==='fornecedor'?'<div class="vez"><b>⏰ É a sua vez de responder</b>Tem '+f+' para aceitar, propor outro valor ou recusar com provas. Se não responder, o cliente é reembolsado automaticamente.</div>':
  '<div class="vez"><b>⏳ À espera do fornecedor</b>'+(papel==='admin'?'Faltam ':'O fornecedor tem ')+f+' para responder. Se não responder, o cliente recebe o reembolso automaticamente. O dinheiro está congelado.</div>';
 if(e==='negociacao'){
  if(de===papel)return'<div class="vez"><b>⏳ Propôs '+pv+'</b>À espera da resposta da outra parte (faltam '+f+'). Pode editar o valor no separador 💰 Valor.</div>';
  if(papel==='admin')return'<div class="vez"><b>🤝 Em negociação</b>Proposta atual de '+NOME[de]+': '+pv+' · faltam '+f+'.</div>';
  return'<div class="vez"><b>⏰ '+(de==='cliente'?'O cliente pede':'O fornecedor propõe')+' '+pv+'</b>Tem '+f+' para aceitar ou fazer outra proposta. Se não responder, este valor fica aceite.</div>';
 }
 if(e==='em_analise'){
  if(de==='admin'){var ok=[],fa=[];(disp.aceite_cliente?ok:fa).push('cliente');(disp.aceite_fornecedor?ok:fa).push('fornecedor');
   var eu2=papel==='cliente'?disp.aceite_cliente:papel==='fornecedor'?disp.aceite_fornecedor:null;
   return'<div class="vez az"><b>🎧 O Atendimento propôs '+pv+'</b>'+(eu2===false?'Aceite no separador 💰 Valor ou responda com provas. ':'')+(ok.length?'Já aceitou: '+ok.join(' e ')+'. ':'')+(fa.length?'Falta aceitar: '+fa.join(' e ')+'.':'')+'</div>'}
  return'<div class="vez az"><b>🎧 Intervenção da BBabilônia</b>A equipa de Atendimento está a analisar as provas dos dois lados. Pode continuar a juntar provas e a propor valores.</div>';
 }
 var cls=e==='cancelada'?'no':'ok';
 return'<div class="vez '+cls+'"><b>⚖️ Decisão final: '+esc(FINAL[e]||e)+'</b>'+(Number(disp.valor_reembolso)?'Reembolso ao cliente: <b style="display:inline">'+din(disp.valor_reembolso,disp.moeda)+'</b>. É feito pelo mesmo meio de pagamento.':'Sem reembolso.')+'</div>';
}
