<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrinho | BBabilônia</title>
<style>
  :root { --texto:#1b1b1b; --suave:#6b6b6b; --linha:#e3e3e3; --marca:#111; --erro:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--texto); background:#fff; }
  .pagina { max-width:520px; margin:0 auto; padding:16px 16px 150px; }
  h1 { font-size:1.2rem; margin:0 0 14px; }
  .item { display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--linha); }
  .item img { width:84px; height:84px; object-fit:cover; border-radius:8px; background:#f2f2f2; flex:none; }
  .dados { flex:1; min-width:0; }
  .nome { font-weight:600; font-size:.95rem; }
  .detalhe { color:var(--suave); font-size:.85rem; margin:2px 0 8px; }
  .linha { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .qtd { display:flex; align-items:center; border:1.5px solid var(--linha); border-radius:8px; overflow:hidden; }
  .qtd button { width:36px; height:36px; border:0; background:#fff; font-size:1.2rem; cursor:pointer; }
  .qtd span { min-width:34px; text-align:center; font-weight:600; }
  .preco { font-weight:700; }
  .remover { background:none; border:0; color:var(--erro); font-size:.85rem; padding:6px 0; cursor:pointer; }
  .vazio { text-align:center; padding:50px 10px; color:var(--suave); }
  .vazio a { color:var(--marca); font-weight:600; }
  .barra { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--linha); padding:12px 16px; }
  .barra-interna { max-width:520px; margin:0 auto; }
  .total { display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem; margin-bottom:10px; }
  .botao { width:100%; padding:15px; border:0; border-radius:10px; background:var(--marca); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  .continuar { display:block; text-align:center; margin-top:10px; font-size:.9rem; color:var(--suave); }
  button:focus-visible, a:focus-visible { outline:3px solid #2b6cff; outline-offset:2px; }
</style>
</head>
<body>
<div class="pagina" id="app"></div>

<script>
  const chave = "carrinho";
  const app = document.getElementById("app");

  const ler = () => { try { return JSON.parse(localStorage.getItem(chave) || "[]"); } catch (e) { return []; } };
  const guardar = c => localStorage.setItem(chave, JSON.stringify(c));
  const fmt = (n, m) => Number(n).toLocaleString("pt-PT", { minimumFractionDigits:2 }) + " " + (m || "MZN");

  function desenhar() {
    const carrinho = ler();
    if (!carrinho.length) {
      app.innerHTML = '<h1>Carrinho</h1><div class="vazio">O seu carrinho está vazio.<br><br><a href="javascript:history.back()">Voltar à loja</a></div>';
      return;
    }

    const totais = {};
    carrinho.forEach(i => { const m = i.moeda || "MZN"; totais[m] = (totais[m] || 0) + Number(i.preco) * i.qtd; });

    app.innerHTML = `
      <h1>Carrinho (${carrinho.reduce((s, i) => s + i.qtd, 0)})</h1>
      ${carrinho.map((i, n) => `
        <div class="item">
          <img src="${i.foto || ""}" alt="">
          <div class="dados">
            <div class="nome">${i.nome}</div>
            <div class="detalhe">${i.cor} · ${i.tamanho}</div>
            <div class="linha">
              <div class="qtd">
                <button data-menos="${n}" aria-label="Menos">−</button>
                <span>${i.qtd}</span>
                <button data-mais="${n}" aria-label="Mais">+</button>
              </div>
              <div class="preco">${fmt(Number(i.preco) * i.qtd, i.moeda)}</div>
            </div>
            <button class="remover" data-remover="${n}">Remover</button>
          </div>
        </div>`).join("")}

      <div class="barra"><div class="barra-interna">
        ${Object.keys(totais).map(m => `<div class="total"><span>Total</span><span>${fmt(totais[m], m)}</span></div>`).join("")}
        <button class="botao" id="finalizar">Finalizar compra</button>
        <a class="continuar" href="javascript:history.back()">Continuar a comprar</a>
      </div></div>`;

    app.querySelectorAll("[data-menos]").forEach(b => b.onclick = () => {
      const c = ler(), n = Number(b.dataset.menos);
      if (c[n].qtd > 1) c[n].qtd--; guardar(c); desenhar();
    });
    app.querySelectorAll("[data-mais]").forEach(b => b.onclick = () => {
      const c = ler(), n = Number(b.dataset.mais);
      c[n].qtd++; guardar(c); desenhar();
    });
    app.querySelectorAll("[data-remover]").forEach(b => b.onclick = () => {
      const c = ler(); c.splice(Number(b.dataset.remover), 1); guardar(c); desenhar();
    });
    document.getElementById("finalizar").onclick = () => {
      alert("O pagamento (M-Pesa, e-Mola e cartão) será o próximo passo.");
    };
  }

  desenhar();
</script>
</body>
</html>
