<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aprovar lojas • BBabilônia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="verificar-documentos.js?v=1"></script>
<style>
:root{--bg:#111;--card:#1c1c1f;--line:#2c2c30;--tx:#f3f3f3;--mut:#9a9aa2;--ac:#ff4d6a;--ok:#2e9d62}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px 16px 70px;max-width:640px}
h1{font-size:22px;margin:0}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,button{font:inherit}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin-top:8px}
button{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.loja{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.loja h3{margin:0 0 8px;font-size:18px}
.k{color:var(--mut);font-size:13px;margin-top:6px}
.v{word-break:break-word}
.docs{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.doc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hide{display:none}
.chk{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.chk label{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:15px;color:var(--tx)}
.chk input{width:auto;margin:3px 0 0}
button:disabled{opacity:.4}
#m{margin-top:12px;color:var(--ac)}
.vst{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.v-ok{background:#123d27;color:#5fe39a}.v-at{background:#4a3a05;color:#ffd36b}.v-su{background:#4d1220;color:#ff8a9a}.v-cz{background:#2c2c30;color:#9a9aa2}
.vres summary{cursor:pointer;color:var(--mut);font-size:13px;margin:2px 0 4px}
.vres ul li{line-height:1.35}
</style></head><body>
<div class="topo"><h1>Aprovar lojas</h1><button id="sair" class="hide">Sair</button></div>

<div id="login" class="hide">
 <label>Email</label><input id="em" type="email" autocomplete="email">
 <label>Palavra-passe</label><input id="pw" type="password" autocomplete="current-password">
 <button class="p" id="ent" style="width:100%;margin-top:14px">Entrar</button>
</div>

<div id="app" class="hide">
 <div class="tabs" id="tabs"></div>
 <input id="busca" type="search" placeholder="🔍 Pesquisar loja pelo nome" autocomplete="off">
 <div id="lista"></div>
 <button id="mais" class="hide" style="width:100%">Carregar mais lojas</button>
</div>
<div id="m"></div>

<script>
const sb=supabase.createClient('https://dsfoqoeawvjafypycldz.supabase.co','sb_publishable_BN4NiVcDab9CqdTY_odgDA_uUOhjja0');
const ADMIN='jovenciofoguete1904@gmail.com',PAGINA=20;
const $=i=>document.getElementById(i);
const msg=t=>$('m').textContent=t||'';
const ESTADOS=[['pendente','Em análise'],['aprovada','Aprovadas'],['rejeitada','Rejeitadas'],['suspensa','Suspensas']];
const TIPOS={id:'BI ou passaporte',morada:'Comprovativo de morada',banco:'Comprovativo da conta bancária',registo:'Registo da empresa',nuit:'NUIT da empresa',rep:'BI do representante',cert:'Certificados dos produtos',prova:'🎥 Vídeo de prova ao vivo'};
const COMUM=['Documentos legíveis, completos e dentro da validade','O nome no documento de identificação é o mesmo do titular da loja e da conta bancária','O país da loja corresponde ao país dos documentos (morada e identificação)','Nome e descrição da loja sem contactos externos (WhatsApp, Instagram, links) e sem produtos proibidos','Países e meios de envio preenchidos'];
const INDIV=['BI ou passaporte (frente e verso) visível','Comprovativo de morada recente','Comprovativo da conta bancária em nome da própria pessoa'];
const EMP=['Registo ou certidão da empresa válido, com o mesmo nome da loja','Identificação fiscal da empresa (NUIT) presente','BI ou passaporte do representante da empresa','Comprovativo de morada da empresa','Comprovativo da conta bancária em nome da empresa','Certificados dos produtos, se o tipo de produto os exigir'];
let filtro='pendente',desde=0,docs={},tempo=null;

function mostrar(app){$('login').classList.toggle('hide',app);$('app').classList.toggle('hide',!app);$('sair').classList.toggle('hide',!app)}

async function iniciar(){
  const {data}=await sb.auth.getSession();
  const s=data.session;
  if(!s){mostrar(false);return}
  if((s.user.email||'').toLowerCase()!==ADMIN){
    await sb.auth.signOut();mostrar(false);
    return msg('Esta conta não é de administrador. Entre com o email do admin.');
  }
  mostrar(true);desenharTabs();carregar(false);
}
async function entrar(){
  msg('A entrar…');
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)return msg('Erro: '+error.message);
  msg('');iniciar();
}
$('ent').onclick=entrar;
$('pw').onkeydown=e=>{if(e.key==='Enter')entrar()};
$('sair').onclick=async()=>{await sb.auth.signOut();msg('');iniciar()};
$('mais').onclick=()=>carregar(true);
$('busca').oninput=()=>{clearTimeout(tempo);tempo=setTimeout(()=>carregar(false),400)};

function desenharTabs(){
  $('tabs').innerHTML='';
  ESTADOS.forEach(([e,n])=>{
    const b=document.createElement('button');
    b.textContent=n;b.className=e===filtro?'on':'';
    b.onclick=()=>{filtro=e;desenharTabs();carregar(false)};
    $('tabs').appendChild(b);
  });
}

async function carregar(mais){
  if(!mais){desde=0;docs={};$('lista').innerHTML=''}
  $('mais').classList.add('hide');msg('A carregar…');
  const q=$('busca').value.trim().replace(/[%,()]/g,' ');
  const pedido=ordem=>{
    let r=sb.from('lojas').select('*').eq('estado',filtro);
    if(q)r=r.ilike('nome','%'+q+'%');
    if(ordem)r=r.order('created_at',{ascending:false});
    return r.range(desde,desde+PAGINA-1);
  };
  let r=await pedido(true);
  if(r.error)r=await pedido(false);
  if(r.error)return msg('Erro: '+r.error.message);
  const lote=r.data||[];
  if(lote.length){
    const d=await sb.from('loja_documentos').select('*').in('loja_id',lote.map(l=>l.id));
    if(d.error)return msg('Erro nos documentos: '+d.error.message);
    (d.data||[]).forEach(x=>{(docs[x.loja_id]=docs[x.loja_id]||[]).push(x)});
  }
  lote.forEach(desenharLoja);
  desde+=lote.length;
  $('mais').classList.toggle('hide',lote.length<PAGINA);
  msg(desde?'':'Nenhuma loja nesta lista.');
}

function linha(pai,k,v){
  const a=document.createElement('div');a.className='k';a.textContent=k;
  const b=document.createElement('div');b.className='v';
  b.textContent=Array.isArray(v)?v.join(', '):(typeof v==='object'?JSON.stringify(v):String(v));
  pai.appendChild(a);pai.appendChild(b);
}

function desenharLoja(l){
  const c=document.createElement('div');c.className='loja';
  const h=document.createElement('h3');h.textContent=l.nome||'(sem nome)';c.appendChild(h);
  Object.keys(l).forEach(k=>{
    if(['id','user_id','owner_id','nome'].includes(k)||l[k]===null||l[k]==='')return;
    linha(c,k,l[k]);
  });
  const dd=document.createElement('div');dd.className='docs';
  const t=document.createElement('div');t.className='k';t.textContent='Documentos';dd.appendChild(t);
  const lista=docs[l.id]||[];
  if(!lista.length){const n=document.createElement('div');n.className='v';n.textContent='Nenhum documento enviado';dd.appendChild(n)}
  lista.forEach(x=>{
    const r=document.createElement('div');r.className='doc';
    const s=document.createElement('span');s.textContent=TIPOS[x.tipo]||x.tipo||'Documento';
    const b=document.createElement('button');b.textContent='Ver';
    b.onclick=async()=>{
      const w=window.open('','_blank');
      const u=await sb.storage.from('documentos-loja').createSignedUrl(x.ficheiro,300);
      if(u.error){if(w)w.close();return msg('Erro: '+u.error.message)}
      if(w)w.location.href=u.data.signedUrl;else location.href=u.data.signedUrl;
    };
    const est=document.createElement('span');est.className='vst v-cz';est.textContent='🔍 por verificar';
    const dir=document.createElement('div');dir.style.cssText='display:flex;gap:6px;align-items:center';dir.appendChild(est);dir.appendChild(b);
    r.appendChild(s);r.appendChild(dir);dd.appendChild(r);
    const res=document.createElement('details');res.className='vres hide';dd.appendChild(res);
    x._ui={est,res};
  });
  if(lista.length){
    const vb=document.createElement('button');vb.textContent='🔍 Verificar documentos (anti-falsificação)';vb.style.cssText='width:100%;margin-top:8px';
    vb.onclick=()=>verificarLoja(l,lista,vb);dd.appendChild(vb);
    if(l.estado==='pendente')filaVerificar.push(()=>verificarLoja(l,lista,vb));
  }
  c.appendChild(dd);
  const tipos=lista.map(x=>x.tipo);
  const emp=(l.tipo||'')==='empresa'||tipos.includes('registo')||tipos.includes('nuit');
  const prova=lista.find(x=>x.tipo==='prova');
  const codProva=prova?((/-prova-(BB-[A-Z0-9]+)\./.exec(prova.ficheiro)||[])[1]||'?'):'';
  if(!prova){const sp=document.createElement('div');sp.className='v';sp.style.cssText='color:#ffd36b;margin-top:6px';sp.textContent='⚠️ Sem vídeo de prova ao vivo (loja registada antes desta regra). Peça uma videochamada antes de aprovar.';dd.appendChild(sp)}
  const itens=COMUM.concat(emp?EMP:INDIV).concat(prova?['Vídeo de prova: aparecem o rosto, o documento original na mão e o papel com o código '+codProva]:[]);
  let aprovar=null;
  const ck=document.createElement('div');ck.className='chk';
  const ct=document.createElement('div');ct.className='k';ct.textContent='Confirme antes de aprovar ('+(emp?'empresa':'pessoa individual')+')';ck.appendChild(ct);
  const caixas=itens.map(t=>{
    const lb=document.createElement('label');const i=document.createElement('input');i.type='checkbox';
    i.onchange=()=>{if(aprovar)aprovar.disabled=!caixas.every(x=>x.checked)};
    lb.appendChild(i);const sp=document.createElement('span');sp.textContent=t;lb.appendChild(sp);ck.appendChild(lb);return i;
  });
  if(l.estado!=='aprovada')c.appendChild(ck);
  const ac=document.createElement('div');ac.className='acoes';
  [['aprovada','Aprovar','ok'],['rejeitada','Rejeitar',''],['suspensa','Suspender','']].forEach(([e,n,cl])=>{
    if(e===l.estado)return;
    const b=document.createElement('button');b.textContent=n;if(cl)b.className=cl;
    if(e==='aprovada'){aprovar=b;b.disabled=true}
    b.onclick=async()=>{
      if(e==='aprovada'&&lista.some(x=>x._r&&x._r.nivel==='suspeito')&&!confirm('Há documentos SUSPEITOS nesta loja. Confirmou no registo oficial e quer aprovar mesmo assim?'))return;
      b.disabled=true;msg('A guardar…');
      const r=await sb.from('lojas').update({estado:e}).eq('id',l.id).select();
      if(r.error){b.disabled=false;return msg('Erro: '+r.error.message)}
      if(!r.data||!r.data.length){b.disabled=false;return msg('Sem permissão para alterar (falta o SQL do passo 1).')}
      carregar(false);
    };
    ac.appendChild(b);
  });
  c.appendChild(ac);
  $('lista').appendChild(c);
}
/* ---- verificador próprio de documentos (verificar-documentos.js) ---- */
let filaVerificar=[],aCorrer=false;
async function correrFila(){
  if(aCorrer)return;aCorrer=true;
  while(filaVerificar.length){const f=filaVerificar.shift();try{await f()}catch(e){}}
  aCorrer=false;
}
const NV={ok:['v-ok','✅ sem sinais'],atencao:['v-at','⚠️ atenção'],suspeito:['v-su','🚨 suspeito']};
async function verificarLoja(l,lista,vb){
  if(vb._a)return;vb._a=1;vb.disabled=true;
  if(!window.BBVerificaDoc){vb.textContent='Falta o ficheiro verificar-documentos.js no GitHub';vb._a=0;vb.disabled=false;return}
  let susp=0,aten=0;
  for(const x of lista){
    const u=x._ui;if(!u)continue;
    if(x.tipo==='prova'){
      const cod=(/-prova-(BB-[A-Z0-9]+)\./.exec(x.ficheiro)||[])[1]||'?';
      u.est.className='vst v-at';u.est.textContent='🎥 ver vídeo';
      u.res.innerHTML='<summary>O que confirmar no vídeo</summary><div class="k" style="color:var(--tx)">Toque em Ver e confirme: o rosto da pessoa, o documento original na mão (o mesmo dos ficheiros) e o papel com o código <b style="font-size:17px;letter-spacing:2px">'+cod+'</b>. Se o código for outro ou não aparecer, rejeite.</div>';
      u.res.classList.remove('hide');u.res.open=true;continue;
    }
    u.est.className='vst v-cz';u.est.textContent='⏳ a verificar…';
    try{
      const d=await sb.storage.from('documentos-loja').download(x.ficheiro);
      if(d.error)throw d.error;
      const r=await BBVerificaDoc.analisar(d.data,x.ficheiro);
      await duplicados(l,x,r);
      x._r=r;
      if(r.nivel==='suspeito')susp++;else if(r.nivel==='atencao')aten++;
      u.est.className='vst '+NV[r.nivel][0];u.est.textContent=NV[r.nivel][1];
      u.res.innerHTML='<summary>Ver análise ('+r.sinais.length+(r.sinais.length===1?' sinal':' sinais')+')</summary>';
      u.res.appendChild(BBVerificaDoc.cartao(r));
      u.res.classList.remove('hide');
      if(r.nivel!=='ok')u.res.open=true;
    }catch(e){u.est.className='vst v-cz';u.est.textContent='❌ não abriu';u.res.innerHTML='<summary>Erro</summary><div class="k">'+String(e&&e.message||e)+'</div>';u.res.classList.remove('hide')}
  }
  vb.textContent=susp?('🚨 '+susp+' documento(s) suspeito(s)'+(aten?' · '+aten+' com atenção':'')+' — toque para verificar de novo'):aten?('⚠️ '+aten+' documento(s) para rever com atenção — toque para verificar de novo'):'✅ Documentos sem sinais fortes — toque para verificar de novo';
  vb._a=0;vb.disabled=false;
}
/* o mesmo documento já foi usado noutra loja? (tabela doc_verificacoes) */
async function duplicados(l,x,r){
  try{
    await sb.from('doc_verificacoes').upsert({ficheiro:x.ficheiro,loja_id:String(l.id),tipo:x.tipo||'',dhash:r.dhash,sha:r.sha,nivel:r.nivel,pontos:r.pontos,sinais:r.sinais.map(s=>s.t),verificado_em:new Date().toISOString()});
    const o=await sb.from('doc_verificacoes').select('ficheiro,loja_id,dhash,sha').neq('loja_id',String(l.id)).limit(5000);
    if(o.error)throw o.error;
    const iguais=(o.data||[]).filter(d=>(r.sha&&d.sha===r.sha)||(r.dhash&&d.dhash&&!/^0+$|^f+$/.test(r.dhash)&&BBVerificaDoc.distancia(r.dhash,d.dhash)<=5));
    if(iguais.length){
      const ids=[...new Set(iguais.map(d=>d.loja_id))];
      const n=await sb.from('lojas').select('id,nome').in('id',ids);
      const nomes=((n.data)||[]).map(z=>z.nome||z.id);
      r.sinais.unshift({p:8,t:'Este documento (ou quase igual) já foi enviado por outra loja: '+(nomes.length?nomes.join(', '):ids.join(', '))+'.'});
      r.pontos+=8;r.nivel=r.pontos>=7?'suspeito':r.pontos>=3?'atencao':'ok';
    }
  }catch(e){r.info.push('Comparação com outras lojas indisponível (falta correr o SQL da tabela doc_verificacoes).')}
}
const _carregar=carregar;
carregar=async function(mais){if(!mais)filaVerificar=[];await _carregar(mais);correrFila()};
iniciar();
</script></body></html>
